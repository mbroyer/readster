<title>Readster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Lexend:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: eine schmale Spalte fürs Tablet. Start = Monster, Wochenziel, nächster Text, Themen. Lesen = ein Text pro Bildschirm. Stil und Farben wie Vokamon. */
:root{
  --bg:#07202b;--surface:#0f3342;--ink:#e8f8ff;--muted:#8fbccc;--line:#1d4d61;
  --accent:#2fd6d0;--accent-edge:#169a96;--accent-ink:#042321;
  --xp:#ffd04d;--xp-edge:#c79500;--xp-ink:#3d2a00;
  --good:#4fd18b;--good-bg:#12392a;--bad:#ff7c82;--bad-bg:#46202a;--warn-bg:#443a14;
  --sy-a:#8be9e3;--sy-b:#ffd9a0;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:14px 32px}
.app{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
h2{font-family:var(--f-display);font-weight:600;font-size:1.45rem;text-wrap:balance;line-height:1.2}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.6rem;color:var(--ink)}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.92rem;font-variant-numeric:tabular-nums}
.chip.lvl{background:var(--xp);border-color:var(--xp-edge);color:var(--xp-ink)}
.iconbtn{cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:50%;width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-family:var(--f-display);font-weight:600;font-size:1rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.btn{font-family:var(--f-display);font-weight:600;font-size:1.2rem;padding:14px 22px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 var(--accent-edge);cursor:pointer;transition:transform .08s,box-shadow .08s;text-align:center;min-height:52px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--accent-edge)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn.wide{width:100%}
.btn.on{background:var(--warn-bg);border-color:var(--xp)}
.link{background:none;border:0;color:var(--muted);font-weight:800;cursor:pointer;padding:10px;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 180px}
.bar{height:16px;border-radius:999px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--xp);box-shadow:inset 0 -4px 0 var(--xp-edge);transition:width .5s ease}
.xptext{font-size:.9rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.mon{width:112px;height:116px;flex:none;--mi:#4ade80;--tile:var(--surface);padding:4px}
.mon .m{fill:var(--mi)}.mon .k{fill:var(--tile)}
.mon .ms{fill:none;stroke:var(--mi);stroke-linecap:round;stroke-linejoin:round}
.mon .ks{fill:none;stroke:var(--tile);stroke-linecap:round;stroke-linejoin:round}
.sw{flex:0 0 48px!important;min-width:48px;height:48px;border-radius:50%!important;padding:0!important}
.sw[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.evo{display:flex;align-items:center;justify-content:center;gap:10px}
.evo .mon{width:120px;height:134px}.evo-old{opacity:.55}.evo-ar{font-size:2rem;color:var(--xp)}
.rank{display:inline-block;background:var(--xp);color:#1b1500;border-radius:999px;padding:2px 12px;font-weight:800;font-size:.85rem}
.mon svg{width:100%;height:100%;display:block;overflow:visible}
.mon.big{width:150px;height:156px}
.hero{flex-direction:row;align-items:center;gap:16px}
.hero .info{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.stagename{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1.05}
.week{gap:10px}
.dots{display:flex;gap:8px;justify-content:space-between}
.dot{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
.dot i{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;border:3px solid var(--line);background:var(--bg);display:block}
.dot.on i{background:var(--xp);border-color:var(--xp-edge)}
.dot.today i{border-color:var(--accent)}
.dot span{font-size:.75rem;font-weight:800;color:var(--muted)}
.next{gap:10px}
.next .q{font-family:var(--f-display);font-weight:600;font-size:1.5rem;line-height:1.2;text-wrap:balance}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;box-shadow:0 4px 0 var(--line);min-height:96px}
.cat:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.cat svg{width:32px;height:32px;color:var(--accent)}
.cat b{font-family:var(--f-display);font-weight:600;font-size:1.15rem}
.cat span{font-size:.85rem;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.backrow{display:flex;align-items:center;gap:12px}
.back{background:none;border:0;cursor:pointer;color:var(--muted);font-weight:800;padding:10px 8px 10px 0;min-height:44px}
.steps{display:flex;gap:6px;flex:1}
.steps i{height:8px;flex:1;border-radius:999px;background:var(--line)}
.steps i.on{background:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;box-shadow:0 4px 0 var(--line);min-height:64px}
.trow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.trow b{font-weight:800;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.badge{flex:none;font-size:.8rem;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--muted);border:2px solid var(--line)}
.badge.done{background:var(--good-bg);color:var(--good);border-color:var(--good)}
/* Lesetext */
.rtext{--rf:'Nunito';--rsize:1.5rem;--rline:1.9;--rsp:0em;font-family:var(--rf),system-ui,sans-serif;font-size:var(--rsize);line-height:var(--rline);letter-spacing:var(--rsp);word-spacing:.12em;font-weight:600;max-width:36em;overflow-wrap:break-word}
.rtext .w{border-radius:8px;padding:2px 3px;margin-inline:-3px;transition:background .15s}
.rtext.syl-on .sy.s0{color:var(--sy-a)}
.rtext.syl-on .sy.s1{color:var(--sy-b)}
.rtext .w.now{background:var(--warn-bg);box-shadow:0 0 0 3px var(--accent)}
.rtext.marking .w{cursor:pointer}
.rtext.seek .w{cursor:pointer}
.rtext .w.st{background:var(--bad-bg);text-decoration:underline wavy var(--bad);text-underline-offset:6px}
.card.riddle{border:2px dashed var(--accent)}
.card.riddle.locked{opacity:.75}

<script>
/* Flat-Monster: einfarbige Silhouette (.m) mit ausgesparten Details (.k = Kachelfarbe). Eigene Entwürfe. */
var MON=(function(){
  function f(n){return Math.round(n*10)/10;}
  function fuzz(cx,cy,r,n,amp){
    var p=[],i,a,rr;
    for(i=0;i<n*2;i++){a=i/(n*2)*Math.PI*2-Math.PI/2;rr=(i%2)?(r-amp):(r+amp*0.4);p.push(f(cx+Math.cos(a)*rr)+' '+f(cy+Math.sin(a)*rr*1.04));}

    blob:{d:'M60 28C88 28 98 52 98 74C98 98 82 108 60 108C38 108 22 98 22 74C22 52 32 28 60 28Z',top:28,ey:62,my:84,hw:38,bot:108},
    egg:{d:'M60 20C84 20 94 54 94 80C94 100 78 110 60 110C42 110 26 100 26 80C26 54 36 20 60 20Z',top:20,ey:64,my:88,hw:34,bot:110},
    tall:{d:'M60 18C80 18 90 28 90 46L90 84C90 100 78 110 60 110C42 110 30 100 30 84L30 46C30 28 40 18 60 18Z',top:18,ey:48,my:76,hw:30,bot:110},
    round:{d:'M22 68A38 38 0 1 1 98 68A38 38 0 1 1 22 68Z',top:30,ey:62,my:84,hw:38,bot:106},
    squat:{d:'M60 44C92 44 110 62 110 82C110 100 92 110 60 110C28 110 10 100 10 82C10 62 28 44 60 44Z',top:44,ey:72,my:93,hw:46,bot:110},
    pear:{d:'M60 22C76 22 84 34 84 48C84 55 90 59 96 68C106 84 100 108 60 108C20 108 14 84 24 68C30 59 36 55 36 48C36 34 44 22 60 22Z',top:22,ey:50,my:80,hw:26,bot:108},
    box:{d:'M36 28H84Q98 28 98 42V94Q98 108 84 108H36Q22 108 22 94V42Q22 28 36 28Z',top:28,ey:54,my:82,hw:36,bot:108},
    fuzz:{d:fuzz(60,68,38,17,5),top:28,ey:62,my:84,hw:36,bot:106}
  };
  function mirror(d){ /* spiegelt einen Pfad an x=60 (nur absolute Befehle M L C Q Z) */
    return d.replace(/(-?\d+\.?\d*)\s+(-?\d+\.?\d*)/g,function(_,x,y){return f(120-parseFloat(x))+' '+y;});
  }
  function cs(sp,k){return sp.pal?('fill="'+(k==='m'?sp.pal.mi:sp.pal.tile)+'"'):('class="'+k+'"');}
  function st(sp,k,w){return sp.pal?('fill="none" stroke="'+(k==='m'?sp.pal.mi:sp.pal.tile)+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"'):('class="'+k+'s" stroke-width="'+w+'"');}
  function P(sp,k,d){return '<path '+cs(sp,k)+' d="'+d+'"/>';}
  function C(sp,k,x,y,r){return '<circle '+cs(sp,k)+' cx="'+f(x)+'" cy="'+f(y)+'" r="'+r+'"/>';}
  function E(sp,k,x,y,rx,ry,rot){return '<ellipse '+cs(sp,k)+' cx="'+f(x)+'" cy="'+f(y)+'" rx="'+rx+'" ry="'+ry+'"'+(rot?' transform="rotate('+rot+' '+f(x)+' '+f(y)+')"':'')+'/>';}
  function PL(sp,k,pts){return '<path '+cs(sp,k)+' d="M'+pts.map(function(p){return f(p[0])+' '+f(p[1]);}).join('L')+'Z"/>';}
  function L(sp,k,d,w){return '<path '+st(sp,k,w)+' d="'+d+'"/>';}
  /* Aufsätze oben */
  function topPart(sp,b){
    var t=b.top,o='',i;
    switch(sp.top){
      case 'horns':
        o+=P(sp,'m','M40 '+(t+8)+'C32 '+(t-6)+' 24 '+(t-12)+' 16 '+(t-20)+'C34 '+(t-22)+' 50 '+(t-8)+' 54 '+(t+6)+'Z');
        o+=P(sp,'m','M80 '+(t+8)+'C88 '+(t-6)+' 96 '+(t-12)+' 104 '+(t-20)+'C86 '+(t-22)+' 70 '+(t-8)+' 66 '+(t+6)+'Z');break;
      case 'cat':
        o+=PL(sp,'m',[[30,t+20],[26,t-8],[56,t+6]]);o+=PL(sp,'m',[[90,t+20],[94,t-8],[64,t+6]]);break;
      case 'bunny':

        o+=P(sp,'m','M80 '+(t+10)+'C92 '+(t-16)+' 86 '+(t-34)+' 74 '+(t-32)+'C64 '+(t-30)+' 66 '+(t-6)+' 68 '+(t+8)+'Z');break;

    switch(sp.arms){
      case 'wings':(function(){var x=60-hw+4,y0=b.ey+2,pts=[[x,y0-6],[x-30,y0-36],[x-24,y0-20],[x-38,y0-20],[x-26,y0-4],[x-36,y0+0],[x-18,y0+12],[x,y0+12]];

      case 'up':o+=L(sp,'m','M'+(60-hw+2)+' '+(b.ey+16)+'Q'+(60-hw-16)+' '+(b.ey+2)+' '+(60-hw-10)+' '+(b.ey-18),9)+L(sp,'m','M'+(60+hw-2)+' '+(b.ey+16)+'Q'+(60+hw+16)+' '+(b.ey+2)+' '+(60+hw+10)+' '+(b.ey-18),9);break;
    }

  }
  function eyePart(sp,b){
    var y=b.ey,o='',dx=Math.min(16,b.hw*0.5);
    switch(sp.eyes){
      case 'two':o+=C(sp,'k',60-dx,y,10)+C(sp,'k',60+dx,y,10)+C(sp,'m',60-dx+2,y+1,4.6)+C(sp,'m',60+dx+2,y+1,4.6)+C(sp,'k',60-dx+3.5,y-1,1.5)+C(sp,'k',60+dx+3.5,y-1,1.5);break;
      case 'twoSmall':o+=C(sp,'k',60-dx,y,7)+C(sp,'k',60+dx,y,7)+C(sp,'m',60-dx+1,y+1,3.2)+C(sp,'m',60+dx+1,y+1,3.2);break;
      case 'wide':o+=C(sp,'k',60-dx,y,12)+C(sp,'k',60+dx,y,12)+C(sp,'m',60-dx+1,y-2,5.4)+C(sp,'m',60+dx+1,y-2,5.4)+C(sp,'k',60-dx+3,y-4,1.6)+C(sp,'k',60+dx+3,y-4,1.6);break;
      case 'one':o+=C(sp,'k',60,y,16)+C(sp,'m',62,y+1,8)+C(sp,'k',65,y-3,2.8);break;

function rankOf(L){var r=0;MON.STAGES.forEach(function(s,i){if(L>=s.lv)r=i;});return r;}
var TEXTS=[{"id": "tier-01", "cat": "Tiere", "title": "Warum fällt ein Gecko nicht von der Decke?", "name": "Gecko", "syl": "Ein Ge·cko läuft an der Wand. Er läuft so·gar kopf·über an der De·cke. Wie geht das? Hat er Kle·ber an den Fü·ßen? Nein! Sei·ne Ze·hen sind vol·ler win·zi·ger Här·chen. Es sind Mil·li·o·nen. Die Här·chen be·rüh·ren die Wand ganz ge·nau. Da·bei zie·hen sich kleins·te Teil·chen ge·gen·sei·tig an. So hält der Ge·cko fest. Will er los·las·sen, rollt er die Ze·hen ab. Die Na·tur hat noch mehr Tricks. Ein Tier wech·selt sei·ne Far·be. Sei·ne Au·gen dre·hen sich ein·zeln. Wie heißt es?", "q": [{"q": "Hat der Gecko Kleber an den Füßen?", "a": "Nein, seine Zehen haben winzige Härchen.", "f": ["Ja, er hat klebrigen Schleim an den Füßen.", "Ja, seine Füße saugen sich fest."]}, {"q": "Was macht der Gecko, wenn er loslassen will?", "a": "Er rollt die Zehen ab.", "f": ["Er springt einfach ab.", "Er wartet, bis der Kleber trocknet."]}], "next": "tier-02", "card": "Millionen winziger Härchen an den Zehen halten ihn fest.", "r": "Die Natur hat noch mehr Tricks. Ein Tier wechselt seine Farbe. Seine Augen drehen sich einzeln. Wie heißt es?"}, {"id": "tier-02", "cat": "Tiere", "title": "Warum wechselt das Chamäleon die Farbe?", "name": "Chamäleon", "syl": "Ein Cha·mä·le·on sitzt auf ei·nem Ast. Plötz·lich wird es grün. Dann gelb. Dann fast rot. Vie·le den·ken: Es ver·steckt sich. Das stimmt nur ein biss·chen. Meis·tens zeigt es da·mit sei·ne Lau·ne. Ist es auf·ge·regt, leuch·tet es gelb und rot. Ist es ru·hig, bleibt es e·her grün. In der Haut ste·cken win·zi·ge Kris·tal·le. Sie wer·fen das Licht mal so und mal so zu·rück. Dann sieht die Haut an·ders aus. Ein Tier im Meer hat acht Ar·me und blau·es Blut. Wie vie·le Her·zen hat es?", "q": [{"q": "Wozu wechselt das Chamäleon meistens die Farbe?", "a": "Um seine Laune zu zeigen.", "f": ["Um sich vor Feinden zu verstecken.", "Um Insekten anzulocken."]}, {"q": "Was steckt in der Haut des Chamäleons?", "a": "Winzige Kristalle.", "f": ["Winzige Härchen.", "Bunte Farbtropfen."]}], "next": "tier-03", "card": "Mit der Farbe zeigt es vor allem seine Laune.", "r": "Ein Tier im Meer hat acht Arme und blaues Blut. Wie viele Herzen hat es?"}, {"id": "tier-03", "cat": "Tiere", "title": "Welches Tier hat drei Herzen?", "name": "Krake", "syl": "Der Kra·ke hat drei Her·zen! Zwei Her·zen pum·pen das Blut zu den Kie·men. Das drit·te pumpt es durch den Kör·per. Sein Blut ist nicht rot. Es ist blau! Au·ßer·dem hat der Kra·ke acht Ar·me. Er hat kei·ne Kno·chen. Dar·um passt er durch ganz en·ge Spal·ten. Und er ist ziem·lich schlau. In ei·nem A·qua·ri·um hat ein Kra·ke schon ein Glas ge·öff·net. Es lebt im Meer, at·met a·ber Luft. Es springt gern aus dem Was·ser. Nachts ruht nur sein hal·bes Ge·hirn. Wer ist das?", "q": [{"q": "Wie viele Herzen hat der Krake?", "a": "Drei.", "f": ["Eins.", "Acht."]}, {"q": "Welche Farbe hat das Blut vom Kraken?", "a": "Blau.", "f": ["Rot.", "Grün."]}], "next": "tier-04", "card": "Der Krake hat drei Herzen und blaues Blut.", "r": "Es lebt im Meer, atmet aber Luft. Es springt gern aus dem Wasser. Nachts ruht nur sein halbes Gehirn. Wer ist das?"}, {"id": "tier-04", "cat": "Tiere", "title": "Wer schläft mit halbem Gehirn?", "name": "Delfin", "syl": "Der Del·fin schläft mit hal·bem Ge·hirn! Er muss zum At·men im·mer wie·der auf·tau·chen. Er ist ein Säu·ge·tier und at·met Luft, so wie du. Wür·de er tief schla·fen, könn·te er er·trin·ken. Dar·um schläft er nur halb. Ei·ne Hälf·te vom Ge·hirn ruht. Die an·de·re bleibt wach. Meist bleibt da·bei ein Au·ge of·fen. Dann wech·seln die Hälf·ten. So ruht sich der Del·fin aus und bleibt trotz·dem si·cher. Ein an·de·res Tier schläft den gan·zen Win·ter. Es rollt sich im Laub zu·sam·men. Und es hat Sta·cheln. Wer ist das?", "q": [{"q": "Warum schläft der Delfin nur mit halbem Gehirn?", "a": "Er muss zum Atmen auftauchen und könnte sonst ertrinken.", "f": ["Er hat nur ein halbes Gehirn.", "Er muss die ganze Zeit fressen."]}, {"q": "Was bleibt beim schlafenden Delfin oft offen?", "a": "Ein Auge.", "f": ["Das Maul.", "Beide Ohren."]}], "next": "tier-05", "card": "Er schläft mit nur einer Hälfte vom Gehirn.", "r": "Ein anderes Tier schläft den ganzen Winter. Es rollt sich im Laub zusammen. Und es hat Stacheln. Wer ist das?"}, {"id": "tier-05", "cat": "Tiere", "title": "Wie schläft ein Igel im Winter?", "name": "Igel", "syl": "Im Win·ter gibt es kaum Fut·ter. Dar·um macht der I·gel Win·ter·schlaf. Er rollt sich in ei·nem Laub·hau·fen ein. Sein Kör·per wird kalt. Sein Herz schlägt nur noch et·wa fünf Mal pro Mi·nu·te. Sonst sind es rund 200 Schlä·ge! So spart er Kraft, bis der Früh·ling kommt. Wacht er zu früh auf, ver·braucht er viel E·ner·gie. Dar·um soll man schla·fen·de I·gel nicht stö·ren. Und jetzt das Ge·gen·teil: Ein Tier mit Fle·cken und lan·gen Bei·nen. Es ist an Land am schnells·ten. Wie heißt es?", "q": [{"q": "Warum macht der Igel Winterschlaf?", "a": "Im Winter gibt es kaum Futter.", "f": ["Im Winter ist es ihm zu hell.", "Er muss im Winter wachsen."]}, {"q": "Warum soll man schlafende Igel nicht stören?", "a": "Wacht er zu früh auf, verbraucht er viel Energie.", "f": ["Er wird sonst wütend und beißt.", "Er schläft dann nie wieder ein."]}], "next": "tier-06", "card": "Im Winterschlaf schlägt sein Herz nur noch etwa fünf Mal pro Minute.", "r": "Und jetzt das Gegenteil: Ein Tier mit Flecken und langen Beinen. Es ist an Land am schnellsten. Wie heißt es?"}, {"id": "tier-06", "cat": "Tiere", "title": "Welches Landtier ist am schnellsten?", "name": "Gepard", "syl": "Der Ge·pard ist das schnells·te Land·tier. Er rennt et·wa 100 Ki·lo·me·ter pro Stun·de. So schnell fährt ein Au·to auf der Land·stra·ße. A·ber nur für kur·ze Zeit. Nach we·ni·gen hun·dert Me·tern ist er er·schöpft. Dann muss er sich aus·ru·hen. Trotz·dem ist er an Land un·schlag·bar. Sei·ne Bei·ne sind lang und sein Kör·per ist schlank. Mit dem Schwanz hält er das Gleich·ge·wicht. Nur ein Tier ist noch viel schnel·ler. Es fliegt und hat schar·fe Au·gen. Im Sturz·flug fällt es wie ein Pfeil. Wie heißt es?", "q": [{"q": "Wie schnell rennt der Gepard?", "a": "Etwa 100 Kilometer pro Stunde.", "f": ["Etwa 30 Kilometer pro Stunde.", "Etwa 300 Kilometer pro Stunde."]}, {"q": "Wie lange kann der Gepard so schnell rennen?", "a": "Nur kurz, nach wenigen hundert Metern ist er erschöpft.", "f": ["Mehrere Stunden am Stück.", "Einen ganzen Tag lang."]}], "next": "tier-07", "card": "Etwa 100 km/h schnell, aber nur ganz kurz.", "r": "Nur ein Tier ist noch viel schneller. Es fliegt und hat scharfe Augen. Im Sturzflug fällt es wie ein Pfeil. Wie heißt es?"}, {"id": "tier-07", "cat": "Tiere", "title": "Wer ist das schnellste Tier der Welt?", "name": "Wanderfalke", "syl": "Der Wan·der·fal·ke ist das schnells·te Tier der Welt. Er jagt an·de·re Vö·gel in der Luft. Da·zu legt er die Flü·gel an. Dann stürzt er wie ein Pfeil nach un·ten. Im Sturz·flug schafft er mehr als 300 Ki·lo·me·ter pro Stun·de. Der Ge·pard kommt nur auf et·wa 100. Der Fal·ke trifft sei·ne Beu·te mit·ten im Flug. Er sieht Beu·te schon aus gro·ßer Ent·fer·nung. A·ber das größ·te Tier der Welt lebt im Meer. Es ist län·ger als zwei Bus·se. Und es frisst win·zi·ge Kreb·se. Wie heißt es?", "q": [{"q": "Wie jagt der Wanderfalke?", "a": "Er stürzt mit angelegten Flügeln nach unten.", "f": ["Er läuft schnell am Boden hinterher.", "Er wartet still im Wasser."]}, {"q": "Wie schnell ist er im Sturzflug?", "a": "Mehr als 300 Kilometer pro Stunde.", "f": ["Etwa 50 Kilometer pro Stunde.", "Genau 100 Kilometer pro Stunde."]}], "next": "tier-08", "card": "Im Sturzflug schneller als 300 km/h.", "r": "Aber das größte Tier der Welt lebt im Meer. Es ist länger als zwei Busse. Und es frisst winzige Krebse. Wie heißt es?"}, {"id": "tier-08", "cat": "Tiere", "title": "Welches Tier ist das größte der Welt?", "name": "Blauwal", "syl": "Der Blau·wal ist das größ·te Tier der Welt. Er wird bis zu 30 Me·ter lang. Das sind mehr als zwei Bus·se hin·ter·ein·an·der. Und er frisst win·zi·ge Kreb·se. Sie hei·ßen Krill. Je·den Tag ver·schlingt er da·von meh·re·re Ton·nen. Er nimmt einen rie·si·gen Schluck Was·ser. Dann presst er es durch sei·ne Bar·ten wie·der hi·naus. Bar·ten sind wie ein Sieb. Der Krill bleibt hän·gen. Der Blau·wal ist rie·sig. Doch im Welt·all gibt es et·was viel Grö·ße·res. Es leuch·tet hell und ist heiß. Du siehst es je·den Tag. Was ist das?", "q": [{"q": "Wovon ernährt sich der Blauwal?", "a": "Von winzigen Krebsen, dem Krill.", "f": ["Von großen Fischen und Robben.", "Von Algen und Seegras."]}, {"q": "Was sind Barten?", "a": "Eine Art Sieb im Maul, in dem der Krill hängen bleibt.", "f": ["Seine Zähne zum Kauen.", "Die Flossen am Bauch."]}], "next": "weltall-01", "card": "Bis zu 30 Meter lang und er frisst winzigen Krill.", "r": "Doch im Weltall gibt es etwas viel Größeres. Es leuchtet hell und ist heiß. Du siehst es jeden Tag. Was ist das?"}, {"id": "weltall-01", "cat": "Weltall", "title": "Wie groß ist die Sonne?", "name": "Sonne", "syl": "Die Son·ne ist ei·ne rie·si·ge Ku·gel aus glü·hend hei·ßem Gas. Sie ist so groß, dass über ei·ne Mil·li·on Er·den hi·nein·pas·sen. Sie ist et·wa 150 Mil·li·o·nen Ki·lo·me·ter von uns ent·fernt. Ihr Licht braucht gut acht Mi·nu·ten bis zu uns. In ih·rer Mit·te ist es un·vor·stell·bar heiß. Dort sind es mehr als 15 Mil·li·o·nen Grad. Oh·ne die Son·ne gä·be es kein Le·ben auf der Er·de. Sie ist ein Stern. Nachts siehst du vie·le an·de·re Ster·ne. Das hells·te Licht am Nacht·him·mel ist a·ber gar kein Stern. Wie heißt es?", "q": [{"q": "Wie viele Erden passen in die Sonne?", "a": "Über eine Million.", "f": ["Ungefähr zehn.", "Genau tausend."]}, {"q": "Wie lange braucht das Sonnenlicht bis zu uns?", "a": "Gut acht Minuten.", "f": ["Ein ganzes Jahr.", "Eine Sekunde."]}], "next": "weltall-02", "card": "Über eine Million Erden passen hinein.", "r": "Nachts siehst du viele andere Sterne. Das hellste Licht am Nachthimmel ist aber gar kein Stern. Wie heißt es?"}, {"id": "weltall-02", "cat": "Weltall", "title": "Wie weit ist der Mond entfernt?", "name": "Mond", "syl": "Der Mond ist et·wa 384.000 Ki·lo·me·ter von der Er·de ent·fernt. Das ist weit. Mit dem Au·to auf der Land·stra·ße bräuch·test du un·ge·fähr 160 Ta·ge, oh·ne Pau·se! Der Mond leuch·tet nicht selbst. Er wirft nur das Licht der Son·ne zu·rück. Dort gibt es kei·ne Luft zum At·men. Dar·um braucht man einen Raum·an·zug. Zwölf Men·schen sind bis·her auf dem Mond ge·lau·fen. Ih·re Fuß·spu·ren sind noch da. Dort weht kein Wind, der sie ver·wi·schen könn·te. Und jetzt zu ei·nem Pla·ne·ten mit be·rühm·ten Rin·gen. Er hat kei·nen fes·ten Bo·den. Wie heißt er?", "q": [{"q": "Leuchtet der Mond selbst?", "a": "Nein, er wirft nur das Licht der Sonne zurück.", "f": ["Ja, er hat ein eigenes Feuer.", "Ja, nur in der Nacht."]}, {"q": "Warum sind die Fußspuren noch da?", "a": "Dort weht kein Wind.", "f": ["Die Astronauten haben sie nachgemalt.", "Der Boden ist dort aus Beton."]}], "next": "weltall-03", "card": "Die Fußspuren der ersten Menschen sind noch da.", "r": "Und jetzt zu einem Planeten mit berühmten Ringen. Er hat keinen festen Boden. Wie heißt er?"}, {"id": "weltall-03", "cat": "Weltall", "title": "Welcher Planet hat Ringe?", "name": "Saturn", "syl": "Sa·turn ist der Pla·net mit den be·rühm·ten Rin·gen. Sie se·hen aus wie ei·ne rie·si·ge Schei·be. In Wahr·heit be·ste·hen sie aus Mil·li·ar·den Eis·bro·cken. Man·che sind klein wie Sand. An·de·re sind groß wie ein Haus. Sa·turn ist ein Gas·pla·net. Er hat kei·nen fes·ten Bo·den zum Lan·den. Er ist so·gar leich·ter als Was·ser. Er wür·de schwim·men, wenn es ein rie·si·ges Be·cken gä·be. Wie kommt man über·haupt ins Welt·all? Da·zu braucht man ein Fahr·zeug, das Feu·er speit. Es star·tet mit lau·tem Don·ner. Wie heißt es?", "q": [{"q": "Woraus bestehen die Ringe vom Saturn?", "a": "Aus Milliarden Eisbrocken.", "f": ["Aus Sand und Steinen.", "Aus heißem Gas."]}, {"q": "Kann man auf Saturn landen?", "a": "Nein, er hat keinen festen Boden.", "f": ["Ja, auf seinen Ringen.", "Ja, der Boden ist aus Eis."]}], "next": "technik-01", "card": "Seine Ringe bestehen aus Milliarden Eisbrocken.", "r": "Wie kommt man überhaupt ins Weltall? Dazu braucht man ein Fahrzeug, das Feuer speit. Es startet mit lautem Donner. Wie heißt es?"}, {"id": "technik-01", "cat": "Technik", "title": "Wie kommt man ins Weltall?", "name": "Rakete", "syl": "Ei·ne Ra·ke·te muss sehr schnell sein, um im Welt·all zu blei·ben. Et·wa 28.000 Ki·lo·me·ter pro Stun·de! Da·für ver·brennt sie rie·si·ge Men·gen Treib·stoff. Die hei·ßen Ga·se schie·ßen nach un·ten aus der Dü·se. Da·durch wird die Ra·ke·te nach o·ben ge·drückt. Das nennt man Rück·stoß. Du kennst ihn von ei·nem Luft·bal·lon. Lässt du ihn los, flitzt er da·von. Ei·ne Ra·ke·te funk·tio·niert ge·nau·so, nur viel grö·ßer. Wer hat das Flug·zeug er·fun·den? Es wa·ren zwei Brü·der aus A·me·ri·ka. Vor·her bau·ten sie Fahr·rä·der. Wie hie·ßen sie?", "q": [{"q": "Wie nennt man den Schub, der die Rakete nach oben drückt?", "a": "Rückstoß.", "f": ["Anziehung.", "Gegenwind."]}, {"q": "Mit welchem Spielzeug kann man das vergleichen?", "a": "Mit einem Luftballon, den man loslässt.", "f": ["Mit einem Kreisel, der sich dreht.", "Mit einem Ball, der hüpft."]}], "next": "technik-02", "card": "Eine Rakete fliegt mit Rückstoß, wie ein Luftballon.", "r": "Wer hat das Flugzeug erfunden? Es waren zwei Brüder aus Amerika. Vorher bauten sie Fahrräder. Wie hießen sie?"}, {"id": "technik-02", "cat": "Technik", "title": "Wer hat das Flugzeug erfunden?", "name": "Flugzeug", "syl": "Den ers·ten Flug mit Mo·tor schaff·ten die Brü·der Wil·bur und Or·ville Wright. Das war im Jahr 1903 in A·me·ri·ka. Ihr ers·ter Flug dau·er·te nur zwölf Se·kun·den. Er war et·wa 37 Me·ter weit. Das ist kür·zer, als ein Jum·bo-Jet lang ist. Die Brü·der bau·ten vor·her Fahr·rä·der und tüf·tel·ten meh·re·re Jah·re. Sie bau·ten so·gar einen ei·ge·nen Wind·ka·nal und tes·te·ten Flü·gel. Heu·te flie·gen Flug·zeu·ge vie·le Stun·den oh·ne Pau·se. A·ber wie fin·den Pi·lo·ten und See·leu·te den Weg? Sie nut·zen ein Ge·rät mit ei·ner Na·del. Wie heißt es?", "q": [{"q": "Wie lange dauerte der erste Flug?", "a": "Zwölf Sekunden.", "f": ["Zwölf Minuten.", "Zwei Stunden."]}, {"q": "Was bauten die Brüder, um Flügel zu testen?", "a": "Einen Windkanal.", "f": ["Ein Schwimmbad.", "Einen Turm."]}], "next": "technik-03", "card": "Der erste Flug dauerte nur zwölf Sekunden.", "r": "Aber wie finden Piloten und Seeleute den Weg? Sie nutzen ein Gerät mit einer Nadel. Wie heißt es?"}, {"id": "technik-03", "cat": "Technik", "title": "Wie funktioniert ein Kompass?", "name": "Kompass", "syl": "Ei·ne Kom·pass·na·del zeigt im·mer nach Nor·den. Wie macht sie das? Die Na·del ist ein klei·ner Ma·gnet. Und die Er·de ist selbst wie ein rie·si·ger Ma·gnet. In ih·rem In·ne·ren fließt flüs·si·ges Me·tall. Da·durch ent·steht ein Ma·gnet·feld. Die Na·del rich·tet sich da·nach aus. Schon vor lan·ger Zeit nutz·ten See·leu·te so et·was. So fan·den sie auch bei Ne·bel ih·ren Weg. Auch man·che Zug·vö·gel spü·ren das Ma·gnet·feld. Und jetzt zu dir. In dei·ner Brust ar·bei·tet ein Mus·kel, Tag und Nacht. Du kannst ihn nicht an·hal·ten. Wie heißt er?", "q": [{"q": "Wohin zeigt die Kompassnadel?", "a": "Nach Norden.", "f": ["Nach Süden.", "Immer zur Sonne."]}, {"q": "Wie ist die Erde in diesem Text beschrieben?", "a": "Wie ein riesiger Magnet.", "f": ["Wie ein riesiger Ball aus Eis.", "Wie ein großes Uhrwerk."]}], "next": "koerper-01", "card": "Die Erde ist wie ein riesiger Magnet.", "r": "Und jetzt zu dir. In deiner Brust arbeitet ein Muskel, Tag und Nacht. Du kannst ihn nicht anhalten. Wie heißt er?"}, {"id": "koerper-01", "cat": "Körper", "title": "Was macht dein Herz den ganzen Tag?", "name": "Herz", "syl": "Dein Herz ist un·ge·fähr so groß wie dei·ne Faust. Es schlägt oh·ne Pau·se, Tag und Nacht. Wenn du ruhst, sind es et·wa 80 Schlä·ge pro Mi·nu·te. Das sind mehr als 100.000 Schlä·ge an je·dem Tag. Das Herz pumpt das Blut durch dei·nen gan·zen Kör·per. Wenn du rennst, schlägt das Herz schnel·ler. Du kannst es spü·ren, wenn du die Hand auf die Brust legst. O·der am Hals. Ver·such es mal! Bei Käl·te o·der Angst ste·hen dir plötz·lich die Haa·re zu Ber·ge. Wie nennt man das?", "q": [{"q": "Wie groß ist dein Herz ungefähr?", "a": "So groß wie deine Faust.", "f": ["So groß wie dein Kopf.", "So groß wie eine Erbse."]}, {"q": "Was passiert mit dem Herzschlag, wenn du rennst?", "a": "Er wird schneller.", "f": ["Er wird langsamer.", "Er hört kurz auf."]}], "next": "koerper-02", "card": "Dein Herz schlägt über 100.000 Mal am Tag.", "r": "Bei Kälte oder Angst stehen dir plötzlich die Haare zu Berge. Wie nennt man das?"}, {"id": "koerper-02", "cat": "Körper", "title": "Warum bekommst du Gänsehaut?", "name": "Gänsehaut", "syl": "Wenn dir kalt ist, be·kommst du Gän·se·haut. Auch bei Angst o·der ei·nem schö·nen Lied kann das pas·sie·ren. Fast je·des Haar auf dei·ner Haut hat einen win·zi·gen Mus·kel. Er zieht sich zu·sam·men und stellt das Haar auf. Da·durch ent·ste·hen die klei·nen Hü·gel. Frü·her hat·ten Men·schen viel mehr Kör·per·haa·re. Auf·ge·stell·te Haa·re hiel·ten warm o·der lie·ßen einen grö·ßer wir·ken. Heu·te hilft uns das kaum noch. Der Kör·per macht es trotz·dem. Et·was in dir hält dich auf·recht. Es ist hart und schützt dein Ge·hirn. Was ist das?", "q": [{"q": "Wann bekommst du Gänsehaut?", "a": "Zum Beispiel bei Kälte, Angst oder einem schönen Lied.", "f": ["Nur, wenn du krank bist.", "Nur beim Schlafen."]}, {"q": "Was stellt die Haare auf?", "a": "Ein winziger Muskel am Haar.", "f": ["Der Wind von draußen.", "Ein Knochen unter der Haut."]}], "next": "koerper-03", "card": "Winzige Muskeln stellen die Haare auf.", "r": "Etwas in dir hält dich aufrecht. Es ist hart und schützt dein Gehirn. Was ist das?"}, {"id": "koerper-03", "cat": "Körper", "title": "Wie viele Knochen hat ein Mensch?", "name": "Knochen", "syl": "Ein Er·wach·se·ner hat 206 Kno·chen. Als Ba·by hat·test du noch mehr, et·wa 300. Vie·le da·von wach·sen tsel-01", "cat": "Rätsel", "title": "Was ist das Bermuda-Dreieck?", "name": "Bermuda-Dreieck", "syl": "Das Ber·mu·da-Drei·eck liegt im At·lan·tik. Es ist ein Ge·biet zwi·schen Flo·ri·da, Ber·mu·da und Puer·to Ri·co. Dort sol·len Schif·fe und Flug·zeu·ge ein·fach ver·schwin·den. Das er·zählt man sich seit vie·len Jahr·zehn·ten. Doch For·scher ha·ben nach·ge·zählt. Es ver·schwin·den dort nicht mehr Schif·fe als in an·de·ren, stark be·fah·re·nen Mee·ren. Oft sind Stür·me schuld. Man·che Ge·schich·ten wur·den auch aus·ge·schmückt. Ein ech·tes Rät·sel ist es al·so nicht. A·ber in Schott·land soll in ei·nem See ein Mons·ter le·ben. Es hat einen lan·gen Hals. Wie heißt es?", "q": [{"q": "Wo liegt das Bermuda-Dreieck?", "a": "Im Atlantik.", "f": ["Im Pazifik.", "In der Nordsee."]}, {"q": "Was sagen Forscher zu den verschwundenen Schiffen?", "a": "Dort verschwinden nicht mehr als anderswo.", "f": ["Dort wohnt ein Seeungeheuer.", "Ein Magnet zieht sie nach unten."]}], "next": "raetsel-02", "card": "Dort verschwinden nicht mehr Schiffe als anderswo.", "r": "Aber in Schottland soll in einem See ein Monster leben. Es hat einen langen Hals. Wie heißt es?"}, {"id": "raetsel-02", "cat": "Rätsel", "title": "Gibt es Nessie wirklich?", "name": "Nessie", "syl": "Im Loch Ness in Schott·land soll ein Mons·ter le·ben. Man nennt es Nes·sie. Im Jahr 1933 gab es vie·le Be·rich·te. Men·schen woll·ten einen lan·gen Hals im Was·ser ge·se·hen ha·ben. Spä·ter such·ten vie·le Leu·te mit Boo·ten, Schall·wel·len und Ka·me·ras. Ge·fun·den ha·ben sie nichts. Im Jahr 2018 un·ter·such·ten For·scher so·gar Was·ser·pro·ben auf Erb·gut. Ein Mons·ter fan·den sie nicht. A·ber sie fan·den sehr viel Erb·gut von Aa·len. Viel·leicht sa·hen Men·schen al·so gro·ße Aa·le. In Ägyp·ten ste·hen rie·si·ge Stein·bau·ten mit ei·ner Spit·ze. Da·mals gab es noch kei·ne Krä·ne. Wie wur·den sie ge·baut?", "q": [{"q": "In welchem See soll Nessie leben?", "a": "Im Loch Ness in Schottland.", "f": ["Im Bodensee in Deutschland.", ·fun·den. Pla·ton woll·te da·mit et·was er·klä·ren. Viel·leicht er·zählst du die Ge·schich·te ein·mal selbst wei·ter. Und jetzt zu·rück zu den Tie·ren! Ein klei·nes Tier läuft kopf·über an der De·cke und fällt nicht her·un·ter. Wie macht es das?", "q": [{"q": "Wer hat die Geschichte von Atlantis erzählt?", "a": "Der Denker Platon.", "f": ["Ein Seemann aus Spanien.", "Ein Forscher von heute."]}, {"q": "Was glauben die meisten Forscher über Atlantis?", "a": "Dass die Geschichte erfunden ist.", "f": ["Dass Atlantis unter dem Eis liegt.", "Dass man es bald findet."]}], "next": "tier-01", "card": "Platon erzählte von der versunkenen Insel.", "r": "Vielleicht erzählst du die Geschichte einmal selbst weiter. Und jetzt zurück zu den Tieren! Ein kleines Tier läuft kopfüber an der Decke und fällt nicht herunter. Wie macht es das?"}];

function pauseAnalyze(x,sr){

  for(i=0;i<n;i++){if(e[i]>thr){if(first<0)first=i;last=i;}}

    case 'finish':finish();break;
    case 'evoOk':closeBox('#modal');if(R&&R.afterEvo){var f=R.afterEvo;R.afterEvo=null;f();}break;
    case 'col':S.col=v;save();renderSheet();if(!$('#v-home').hidden)renderHome();break;
    case 'album':renderAlbum();break;
    case 'card':var t=byId[v];openBox('#modal','<div class="card">'+cardHTML(t,true)+'<div class="cfbtns"><button class="btn ghost" data-a="closeModal">Schließen</button><button class="btn" data-a="nextread" data-v="'+t.id+'">Nochmal lesen</button></div></div>');break;
    case 'closeModal':stopListen();closeBox('#modal');break;
    case 'settings':renderSheet();break;
    case 'set':var k=b.dataset.k,val=v;if(k==='size'||k==='line'||k==='space')val=+v;else if(k==='syl'||k==='rec'||k==='nums')val=(v==='true');S.set[k]=val;save();renderSheet();readStyle();break;
    case 'sheetOk':closeBox('#sheet');break;
    case 'reset':renderReset();break;
    case 'delRecs':recDelAll().then(function(){var b=$('#delRecsBtn');if(b)b.textContent='Aufnahmen gelöscht';});break;
    case 'wj':wjStart();break;
    case 'wjSay':if(W)sayWord(W.list[W.k]);break;
    case 'wjClap':wjClap(+v);break;
    case 'wjRead':wjRead();break;
    case 'wjJudge':wjJudge(v==='1');break;
    case 'backup':renderBackup();break;
    case 'copyCode':var ta=$('#expCode');try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){b.textContent='Kopiert';},function(){ta.select();document.execCommand('copy');b.textContent='Kopiert';});}else{ta.select();document.execCommand('copy');b.textContent='Kopiert';}}catch(er){ta.select();}break;
    case 'saveFile':try{var bl=new Blob([JSON.stringify(S)],{type:'application/json'}),au=URL.createObjectURL(bl),an=document.createElement('a');an.href=au;an.download='readster-'+dkey(new Date())+'.json';document.body.appendChild(an);an.click();setTimeout(function(){URL.revokeObjectURL(au);an.remove();},2000);}catch(er){}break;
    case 'loadCode':applyBackup($('#impCode').value);break;
    case 'doReset':S=defaults();save();closeBox('#sheet');R=null;renderHome();show('home');break;
  }
});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='nameIn'){S.name=e.target.value.trim().slice(0,16);save();if(!$('#v-home').hidden)renderHome();}});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='impFile'&&e.target.files&&e.target.files[0]){var fr=new FileReader();fr.onload=function(){applyBackup(fr.result);};fr.readAsText(e.target.files[0]);}
});
if(window.speechSynthesis){try{window.speechSynthesis.onvoiceschanged=function(){};}catch(e){}}
renderHome();show('home');
})();
</script>
</body>
</html>
