<title>Readster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Lexend:wght@300;400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: eine schmale Spalte fürs Tablet. Start = Monster, Wochenziel, nächster Text, Themen. Lesen = ein Text pro Bildschirm. Stil und Farben wie Vokamon. */
:root{
  --bg:#07202b;--surface:#0f3342;--ink:#e8f8ff;--muted:#8fbccc;--line:#1d4d61;
  --accent:#2fd6d0;--accent-edge:#169a96;--accent-ink:#042321;
  --cta:#ff7a59;--cta-edge:#c4492b;--cta-ink:#2b0c03;
  --xp:#ffd04d;--xp-edge:#c79500;--xp-ink:#3d2a00;
  --good:#4fd18b;--good-bg:#12392a;--bad:#ff7c82;--bad-bg:#46202a;--warn-bg:#443a14;
  --sy-a:#8be9e3;--sy-b:#ffd9a0;
  --f-display:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
/* Partner-Modus: eigener Farbton, damit man sofort sieht, wer liest */
html[data-mode="partner"]{--bg:#2a1206;--surface:#45210d;--line:#6e3a1a;--muted:#e3b896;--warn-bg:#5a3512}
html{background:var(--bg);transition:background .3s}
*{box-sizing:border-box}
html,body{margin:0}
b,strong{font-weight:600}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:14px 32px}
.app{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
h2{font-family:var(--f-display);font-weight:500;font-size:1.45rem;text-wrap:balance;line-height:1.2}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
.eyebrow{font-size:.75rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.6rem;color:var(--ink)}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:500;font-size:.92rem;font-variant-numeric:tabular-nums}
.chip.lvl{background:var(--xp);border-color:var(--xp-edge);color:var(--xp-ink)}
.iconbtn{cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:50%;width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-family:var(--f-display);font-weight:500;font-size:1rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.btn{font-family:var(--f-display);font-weight:500;font-size:1.2rem;padding:14px 22px;border-radius:18px;border:0;background:var(--cta);color:var(--cta-ink);box-shadow:0 5px 0 var(--cta-edge);cursor:pointer;transition:transform .08s,box-shadow .08s;text-align:center;min-height:52px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--cta-edge)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn.wide{width:100%}
.btn.on{background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent);box-shadow:0 5px 0 var(--accent-edge)}
.link{background:none;border:0;color:var(--muted);font-weight:500;cursor:pointer;padding:10px;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 180px}
.bar{height:16px;border-radius:999px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--xp);box-shadow:inset 0 -4px 0 var(--xp-edge);transition:width .5s ease}
.xptext{font-size:.9rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.mon{width:112px;height:116px;flex:none;--mi:#4ade80;--tile:var(--surface);padding:4px}
.mon .m{fill:var(--mi)}.mon .k{fill:var(--tile)}
.mon .ms{fill:none;stroke:var(--mi);stroke-linecap:round;stroke-linejoin:round}
.mon .ks{fill:none;stroke:var(--tile);stroke-linecap:round;stroke-linejoin:round}
.sw{flex:0 0 48px!important;min-width:48px;height:48px;border-radius:50%!important;padding:0!important}
.sw[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.evo{display:flex;align-items:center;justify-content:center;gap:10px}
.evo .mon{width:120px;height:134px}.evo-old{opacity:.55}.evo-ar{font-size:2rem;color:var(--xp)}
.rank{display:inline-block;background:var(--xp);color:#1b1500;border-radius:999px;padding:2px 12px;font-weight:500;font-size:.85rem}
.mon svg{width:100%;height:100%;display:block;overflow:visible}
.mon.big{width:150px;height:156px}
/* Rennbelohnung: Autos aus Strip 402 */
.carimg{width:132px;height:88px;flex:none;display:block;object-fit:contain}
.carimg.big{width:240px;height:160px;max-width:100%}
.evo .carimg{width:150px;height:100px}
.rgar{gap:12px}
.rgo{display:grid;grid-template-columns:112px 1fr auto;gap:12px;align-items:center;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.rgo .carimg{width:112px;height:75px}
.rgo .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.rgo .stagename{font-size:1.2rem;line-height:1.2}
.rgo .chev{font-size:1.8rem;color:var(--muted);line-height:1}
.rtank{display:flex;align-items:center;gap:10px;min-height:44px}
.rtank .btn{margin-left:auto;padding:9px 18px;font-size:1rem}
.pips{display:flex;gap:6px}
.pips i{width:16px;height:22px;border-radius:5px;border:2px solid var(--line);background:var(--bg)}
.pips i.on{background:var(--good);border-color:#2a9a5f;box-shadow:inset 0 -4px 0 #2a9a5f}
.pips.big i{width:30px;height:40px;border-radius:9px}
.rwt{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:16px;padding:12px 14px;text-align:left;width:100%}
.rwt b{display:block;font-weight:500;font-size:1.1rem}
.cars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rcar{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-align:center}
.rcar[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.rcar .carimg{width:100%;height:auto;aspect-ratio:3/2}
.rcar b{font-weight:500;font-size:.95rem}
.rcar span{font-size:.8rem;color:var(--muted)}
.peek{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;border:2px dashed var(--line);border-radius:18px;padding:10px 14px}
.peek .carimg{width:110px;height:73px;filter:blur(5px) brightness(.75)}
.peek .pt{display:flex;flex-direction:column;gap:2px;min-width:0}
.peek b{font-weight:500}
#race{position:fixed;inset:0;z-index:80;background:#000}
#race[hidden]{display:none!important}
#race iframe{width:100%;height:100%;border:0;display:block}
@media (max-width:420px){.rgo{grid-template-columns:92px 1fr auto}.rgo .carimg{width:92px;height:61px}}
.hero{flex-direction:row;align-items:center;gap:16px}
.hero .info{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.stagename{font-family:var(--f-display);font-weight:600;font-size:1.7rem;line-height:1.05}
.week{gap:14px}
.setgrp{font-size:1rem;font-weight:600;margin:6px 0 -6px;padding-top:12px;border-top:2px solid var(--line)}details.adult.set>div>.setgrp:first-child{border-top:0;padding-top:0}.setrow .link{align-self:flex-start;padding-left:0}

.cfbox .card{max-width:440px;width:100%;margin-block:auto;text-align:center;align-items:center}
.cfbox .card.left{text-align:left;align-items:stretch}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 90px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:500;cursor:pointer;min-height:48px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.setrow{display:flex;flex-direction:column;gap:8px}
.dbg{display:flex;flex-wrap:wrap;gap:6px}.dbg .btn{flex:0 0 auto}
.cfbtns{display:flex;gap:10px;width:100%}
.cfbtns .btn{flex:1}
.xpgain{font-family:var(--f-display);font-weight:600;font-size:1.6rem;color:var(--xp)}
.xplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-weight:600;color:var(--muted);font-size:.95rem}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fxp{position:absolute;display:block;opacity:0;left:50%;top:40%}
.fxs{width:14px;height:14px;background:var(--xp);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:fxs 900ms ease-out forwards}
@keyframes fxs{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.6) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){#fx{display:none}.mbob,.eyes,.wing,.aura,.tw{animation:none!important}}
.foot{display:flex;justify-content:center;padding:28px 0 20px}
.madeby{display:flex;flex-direction:column;align-items:center;gap:10px;opacity:.9}
.madeby span{font:500 10px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:#fff}
.madeby img{width:80px;height:auto;display:block;filter:brightness(0) invert(1)}

<style>

body{padding-top:max(14px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

.dock .in{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.dock .row{flex-wrap:nowrap;gap:10px}
.dock .row>*{flex:1 1 0;min-width:0}

.dock .btn{padding:12px 14px;font-size:1.1rem}
.dock .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:500}

.dock .lbl.opa b{color:var(--xp)}.dock .lbl.kid b{color:var(--accent)}
.dock .lbl span{color:var(--muted);font-size:.85rem}
/* Größere Tippflächen für Wörter beim Markieren */
.rtext.marking .w,.rtext.opa .w{padding:6px 4px;margin-inline:-4px}
.result .wpm{font-weight:500;color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
details.adult{border:0;padding:0;background:none}
details.adult summary{color:var(--muted);font-weight:500;font-size:.9rem;cursor:pointer;min-height:32px}

.badge.star{color:var(--xp);border-color:var(--line);letter-spacing:.05em}

.wjcta svg{flex:none;width:40px;height:40px;color:var(--xp)}
.wjcta b{font-family:var(--f-display);font-weight:600;font-size:1.3rem;display:block}
.wjcta span{color:var(--muted);font-weight:500;font-size:.9rem}
.wjword{font-family:var(--rf,'Nunito'),system-ui,sans-serif;font-weight:600;font-size:2.6rem;text-align:center;line-height:1.3;overflow-wrap:anywhere;letter-spacing:var(--rsp,0)}
.claps{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.clap{font-family:var(--rf,'Nunito'),system-ui,sans-serif;font-weight:600;font-size:1.8rem;min-width:72px;min-height:72px;padding:8px 16px;border-radius:18px;background:var(--bg);border:3px solid var(--line);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--line)}
.clap.s0{color:var(--sy-a)}.clap.s1{color:var(--sy-b)}
.clap.on{border-color:var(--xp);background:var(--warn-bg)}

.rdots{display:flex;justify-content:center;gap:12px}

.rdots i.on{background:var(--xp);border-color:var(--xp-edge)}
.wjstep{text-align:center;color:var(--muted);font-weight:500}
.wj span.ok{border-color:var(--good);color:var(--good)}
textarea.code{width:100%;min-height:90px;font:600 .8rem/1.3 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px;resize:vertical}

<script>
/* Flat-Monster: einfarbige Silhouette (.m) mit ausgesparten Details (.k = Kachelfarbe). Eigene Entwürfe. */
var MON=(function(){
  function f(n){return Math.round(n*10)/10;}
  function fuzz(cx,cy,r,n,amp){
    var p=[],i,a,rr;
    for(i=0;i<n*2;i++){a=i/(n*2)*Math.PI*2-Math.PI/2;rr=(i%2)?(r-amp):(r+amp*0.4);p.push(f(cx+Math.cos(a)*rr)+' '+f(cy+Math.sin(a)*rr*1.04));}
    return 'M'+p.join('L')+'Z';
  }
  var BODIES={
    blob:{d:'M60 28C88 28 98 52 98 74C98 98 82 108 60 108C38 108 22 98 22 74C22 52 32 28 60 28Z',top:28,ey:62,my:84,hw:38,bot:108},
    egg:{d:'M60 20C84 20 94 54 94 80C94 100 78 110 60 110C42 110 26 100 26 80C26 54 36 20 60 20Z',top:20,ey:64,my:88,hw:34,bot:110},
    tall:{d:'M60 18C80 18 90 28 90 46L90 84C90 100 78 110 60 110C42 110 30 100 30 84L30 46C30 28 40 18 60 18Z',top:18,ey:48,my:76,hw:30,bot:110},
    round:{d:'M22 68A38 38 0 1 1 98 68A38 38 0 1 1 22 68Z',top:30,ey:62,my:84,hw:38,bot:106},
    squat:{d:'M60 44C92 44 110 62 110 82C110 100 92 110 60 110C28 110 10 100 10 82C10 62 28 44 60 44Z',top:44,ey:72,my:93,hw:46,bot:110},
    pear:{d:'M60 22C76 22 84 34 84 48C84 55 90 59 96 68C106 84 100 108 60 108C20 108 14 84 24 68C30 59 36 55 36 48C36 34 44 22 60 22Z',top:22,ey:50,my:80,hw:26,bot:108},
    box:{d:'M36 28H84Q98 28 98 42V94Q98 108 84 108H36Q22 108 22 94V42Q22 28 36 28Z',top:28,ey:54,my:82,hw:36,bot:108},
    fuzz:{d:fuzz(60,68,38,17,5),top:28,ey:62,my:84,hw:36,bot:106}
  };
  function mirror(d){ /* spiegelt einen Pfad an x=60 (nur absolute Befehle M L C Q Z) */
    return d.replace(/(-?\d+\.?\d*)\s+(-?\d+\.?\d*)/g,function(_,x,y){return f(120-parseFloat(x))+' '+y;});
  }
  function cs(sp,k){return sp.pal?('fill="'+(k==='m'?sp.pal.mi:sp.pal.tile)+'"'):('class="'+k+'"');}
  function st(sp,k,w){return sp.pal?('fill="none" stroke="'+(k==='m'?sp.pal.mi:sp.pal.tile)+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"'):('class="'+k+'s" stroke-width="'+w+'"');}
  function P(sp,k,d){return '<path '+cs(sp,k)+' d="'+d+'"/>';}
  function C(sp,k,x,y,r){return '<circle '+cs(sp,k)+' cx="'+f(x)+'" cy="'+f(y)+'" r="'+r+'"/>';}
  function E(sp,k,x,y,rx,ry,rot){return '<ellipse '+cs(sp,k)+' cx="'+f(x)+'" cy="'+f(y)+'" rx="'+rx+'" ry="'+ry+'"'+(rot?' transform="rotate('+rot+' '+f(x)+' '+f(y)+')"':'')+'/>';}
  function PL(sp,k,pts){return '<path '+cs(sp,k)+' d="M'+pts.map(function(p){return f(p[0])+' '+f(p[1]);}).join('L')+'Z"/>';}
  function L(sp,k,d,w){return '<path '+st(sp,k,w)+' d="'+d+'"/>';}
  /* Aufsätze oben */
  function topPart(sp,b){
    var t=b.top,o='',i;
    switch(sp.top){
      case 'horns':
        o+=P(sp,'m','M40 '+(t+8)+'C32 '+(t-6)+' 24 '+(t-12)+' 16 '+(t-20)+'C34 '+(t-22)+' 50 '+(t-8)+' 54 '+(t+6)+'Z');
        o+=P(sp,'m','M80 '+(t+8)+'C88 '+(t-6)+' 96 '+(t-12)+' 104 '+(t-20)+'C86 '+(t-22)+' 70 '+(t-8)+' 66 '+(t+6)+'Z');break;
      case 'cat':
        o+=PL(sp,'m',[[30,t+20],[26,t-8],[56,t+6]]);o+=PL(sp,'m',[[90,t+20],[94,t-8],[64,t+6]]);break;
      case 'bunny':
        o+=P(sp,'m','M40 '+(t+10)+'C28 '+(t-16)+' 34 '+(t-34)+' 46 '+(t-32)+'C56 '+(t-30)+' 54 '+(t-6)+' 52 '+(t+8)+'Z');
        o+=P(sp,'m','M80 '+(t+10)+'C92 '+(t-16)+' 86 '+(t-34)+' 74 '+(t-32)+'C64 '+(t-30)+' 66 '+(t-6)+' 68 '+(t+8)+'Z');break;
      case 'antennae':
        o+=L(sp,'m','M46 '+(t+4)+'Q40 '+(t-12)+' 34 '+(t-16),5)+C(sp,'m',33,t-17,6);
        o+=L(sp,'m','M74 '+(t+4)+'Q80 '+(t-12)+' 86 '+(t-16),5)+C(sp,'m',87,t-17,6);break;
      case 'tuft':
        o+=PL(sp,'m',[[48,t+4],[50,t-12],[56,t+2]]);o+=PL(sp,'m',[[54,t+3],[60,t-16],[66,t+3]]);o+=PL(sp,'m',[[64,t+2],[70,t-12],[72,t+4]]);break;
      case 'spikes':
        for(i=0;i<5;i++){var x=36+i*12;o+=PL(sp,'m',[[x-5,t+10-Math.abs(i-2)*3],[x,t-10+Math.abs(i-2)*5],[x+5,t+10-Math.abs(i-2)*3]]);}break;
      case 'bear':
        o+=C(sp,'m',30,t+12,13)+C(sp,'m',90,t+12,13)+C(sp,'k',30,t+12,5.5)+C(sp,'k',90,t+12,5.5);break;
      case 'crown':
        o+=PL(sp,'m',[[42,t+8],[40,t-14],[51,t-3],[60,t-20],[69,t-3],[80,t-14],[78,t+8]])+C(sp,'k',60,t-2,3)+C(sp,'k',48,t+1,2.2)+C(sp,'k',72,t+1,2.2);break;
      case 'horn1':
        o+=PL(sp,'m',[[53,t+6],[60,t-24],[67,t+6]]);break;
    }
    return o;
  }
  function armPart(sp,b){
    var hw=b.hw,y=b.ey+22,o='';
    switch(sp.arms){
      case 'wings':(function(){var x=60-hw+4,y0=b.ey+2,pts=[[x,y0-6],[x-30,y0-36],[x-24,y0-20],[x-38,y0-20],[x-26,y0-4],[x-36,y0+0],[x-18,y0+12],[x,y0+12]];
        o+=PL(sp,'m',pts);o+=PL(sp,'m',pts.map(function(p){return [120-p[0],p[1]];}));})();break;
      case 'blobs':o+=E(sp,'m',60-hw-3,y,9,15,18)+E(sp,'m',60+hw+3,y,9,15,-18);break;
      case 'long':o+=L(sp,'m','M'+(60-hw+2)+' '+(b.ey+12)+'Q'+(60-hw-22)+' '+(b.ey+30)+' '+(60-hw-10)+' '+(b.ey+54),9)+L(sp,'m','M'+(60+hw-2)+' '+(b.ey+12)+'Q'+(60+hw+22)+' '+(b.ey+30)+' '+(60+hw+10)+' '+(b.ey+54),9);break;
      case 'up':o+=L(sp,'m','M'+(60-hw+2)+' '+(b.ey+16)+'Q'+(60-hw-16)+' '+(b.ey+2)+' '+(60-hw-10)+' '+(b.ey-18),9)+L(sp,'m','M'+(60+hw-2)+' '+(b.ey+16)+'Q'+(60+hw+16)+' '+(b.ey+2)+' '+(60+hw+10)+' '+(b.ey-18),9);break;
    }
    return o;
  }
  function eyePart(sp,b){
    var y=b.ey,o='',dx=Math.min(16,b.hw*0.5);
    switch(sp.eyes){
      case 'two':o+=C(sp,'k',60-dx,y,10)+C(sp,'k',60+dx,y,10)+C(sp,'m',60-dx+2,y+1,4.6)+C(sp,'m',60+dx+2,y+1,4.6)+C(sp,'k',60-dx+3.5,y-1,1.5)+C(sp,'k',60+dx+3.5,y-1,1.5);break;
      case 'twoSmall':o+=C(sp,'k',60-dx,y,7)+C(sp,'k',60+dx,y,7)+C(sp,'m',60-dx+1,y+1,3.2)+C(sp,'m',60+dx+1,y+1,3.2);break;
      case 'wide':o+=C(sp,'k',60-dx,y,12)+C(sp,'k',60+dx,y,12)+C(sp,'m',60-dx+1,y-2,5.4)+C(sp,'m',60+dx+1,y-2,5.4)+C(sp,'k',60-dx+3,y-4,1.6)+C(sp,'k',60+dx+3,y-4,1.6);break;
      case 'one':o+=C(sp,'k',60,y,16)+C(sp,'m',62,y+1,8)+C(sp,'k',65,y-3,2.8);break;
      case 'three':o+=C(sp,'k',60,y-2,10)+C(sp,'m',61,y-1,4.4)+C(sp,'k',32+(60-b.hw)*0.2,y+8,6.5)+C(sp,'m',33+(60-b.hw)*0.2,y+9,3)+C(sp,'k',88-(60-b.hw)*0.2,y+8,6.5)+C(sp,'m',89-(60-b.hw)*0.2,y+9,3);break;
      case 'angry':
        o+=C(sp,'k',60-dx,y,10)+C(sp,'k',60+dx,y,10)+C(sp,'m',60-dx+2,y+2,4.4)+C(sp,'m',60+dx-2,y+2,4.4);
        o+=PL(sp,'m',[[60-dx-12,y-13],[60-dx+12,y-13],[60-dx+12,y+1],[60-dx-12,y-7]]);
        o+=PL(sp,'m',[[60+dx-12,y+1],[60+dx-12,y-13],[60+dx+12,y-13],[60+dx+12,y-7]]);break;
      case 'happy':o+=L(sp,'k','M'+(60-dx-8)+' '+(y+3)+'Q'+(60-dx)+' '+(y-10)+' '+(60-dx+8)+' '+(y+3),4.5)+L(sp,'k','M'+(60+dx-8)+' '+(y+3)+'Q'+(60+dx)+' '+(y-10)+' '+(60+dx+8)+' '+(y+3),4.5);break;
    }
    return o;
  }
  function mouthPart(sp,b){
    var y=b.my,o='',w=Math.min(20,b.hw*0.6),i;
    switch(sp.mouth){
      case 'smile':o+=P(sp,'k','M'+(60-w)+' '+y+'Q60 '+(y+18)+' '+(60+w)+' '+y+'Z');break;
      case 'open':o+=P(sp,'k','M'+(60-w)+' '+y+'Q60 '+(y+26)+' '+(60+w)+' '+y+'Z')+E(sp,'m',60,y+13,8,4.4);break;
      case 'grin':o+=P(sp,'k','M'+(60-w-4)+' '+y+'Q60 '+(y+18)+' '+(60+w+4)+' '+y+'Q60 '+(y+7)+' '+(60-w-4)+' '+y+'Z');break;
      case 'teeth':
        o+=P(sp,'k','M'+(60-w)+' '+y+'H'+(60+w)+'Q'+(60+w)+' '+(y+18)+' 60 '+(y+18)+'Q'+(60-w)+' '+(y+18)+' '+(60-w)+' '+y+'Z');
        for(i=0;i<4;i++){var x=60-w+i*(2*w/4);o+=PL(sp,'m',[[x,y],[x+w/4,y+7],[x+w/2,y]]);}break;
      case 'fangs':
        o+=P(sp,'k','M'+(60-w)+' '+y+'Q60 '+(y+18)+' '+(60+w)+' '+y+'Z');
        o+=PL(sp,'m',[[60-w+3,y+1],[60-w+7,y+9],[60-w+11,y+4]]);o+=PL(sp,'m',[[60+w-3,y+1],[60+w-7,y+9],[60+w-11,y+4]]);break;
      case 'ribs':
        o+=P(sp,'k','M'+(60-w)+' '+(y-4)+'H'+(60+w)+'V'+(y+20)+'Q'+(60+w)+' '+(y+24)+' '+(60+w-4)+' '+(y+24)+'H'+(60-w+4)+'Q'+(60-w)+' '+(y+24)+' '+(60-w)+' '+(y+20)+'Z');
        for(i=0;i<3;i++)o+=L(sp,'m','M'+(60-w+1)+' '+(y+i*7+1)+'H'+(60+w-1),3);break;
      case 'o':o+=C(sp,'k',60,y+4,6.5);break;
    }
    return o;
  }
  function decor(sp,b){
    var o='',y=b.my+12;
    switch(sp.decor){
      case 'spots':o+=C(sp,'k',60-b.hw*0.55,y+2,3.6)+C(sp,'k',60+b.hw*0.5,y-2,4.4)+C(sp,'k',60-b.hw*0.15,y+10,2.6)+C(sp,'k',60+b.hw*0.2,y+12,3);break;
      case 'stripes':
        for(var i=0;i<3;i++)o+=L(sp,'k','M'+(60-b.hw*0.8)+' '+(y+i*8-2)+'Q60 '+(y+i*8+6)+' '+(60+b.hw*0.8)+' '+(y+i*8-2),3);break;
    }
    return o;
  }
  function legPart(sp,b,dy){
    var o='',bot=b.bot+dy;
    if(sp.legs==='stick'){
      [46,74].forEach(function(x){o+=L(sp,'m','M'+x+' '+(bot-4)+'V'+(bot+14),4.5)+E(sp,'m',x+(x<60?-4:4),bot+15,8,3.6);});
    }else if(sp.legs==='stub'){
      o+=E(sp,'m',60-17,bot-1,11,6)+E(sp,'m',60+17,bot-1,11,6);
    }
    return o;
  }
  function build(sp){
    var b=BODIES[sp.body],dy=(sp.legs==='stick')?-10:0,g='';
    if(sp.egg){
      return '<svg viewBox="0 -10 120 134" aria-hidden="true">'+P(sp,'m',BODIES.egg.d)+L(sp,'k','M36 70L46 62L54 72L64 60L72 72L84 64',4)+'</svg>';
    }
    g+=topPart(sp,b)+armPart(sp,b)+P(sp,'m',b.d)+decor(sp,b)+eyePart(sp,b)+mouthPart(sp,b);
    var sc=sp.sc||1;if(sc!==1){var gy=114;g='<g transform="translate(60 '+gy+') scale('+sc+') translate(-60 -'+gy+')">'+g+legPart(sp,b,dy)+'</g>';return '<svg viewBox="0 -10 120 134" aria-hidden="true"><g'+(dy?' transform="translate(0 '+dy+')"':'')+'></g>'+g+'</svg>';}
    return '<svg viewBox="0 -10 120 134" aria-hidden="true"><g'+(dy?' transform="translate(0 '+dy+')"':'')+'>'+g+'</g>'+legPart(sp,b,dy)+'</svg>';
  }
  var SPECS=[
    {body:'tall',top:'tuft',eyes:'wide',mouth:'smile',arms:'blobs',legs:'stub'},
    {body:'round',top:'spikes',eyes:'one',mouth:'grin',arms:'',legs:'stick'},
    {body:'egg',top:'antennae',eyes:'three',mouth:'open',arms:'long',legs:'stub',decor:'spots'},
    {body:'pear',top:'bunny',eyes:'two',mouth:'teeth',arms:'blobs',legs:'stub'},
    {body:'fuzz',top:'tuft',eyes:'twoSmall',mouth:'smile',arms:'',legs:'stick'},

var CAR0=2; /* ab diesem Index gibt es Autos */
function rankOf(L){var r=0;RSTAGES.forEach(function(s,i){if(L>=s.lv)r=i;});return r;}
function hasCar(){return rankOf(lvl(S.xp))>=CAR0;}
function carStage(id){for(var i=CAR0;i<RSTAGES.length;i++)if(RSTAGES[i].car===id)return RSTAGES[i];return null;}
function curCar(){var r=rankOf(lvl(S.xp));if(r<CAR0)return null;var c=carStage(S.rcar);return c&&RSTAGES.indexOf(c)<=r?c:RSTAGES[r];}
/* Tank: füllt sich mit den XP, sobald ein Auto da ist. Das erste Auto kommt mit vollem Tank. */
function addFuel(gain,wasRank){var r=rankOf(lvl(S.xp));if(r<CAR0)return;if(wasRank<CAR0)S.fuel=XP_RACE;else S.fuel=Math.min(XP_RACE,(S.fuel||0)+gain);}
function fuelFull(){return hasCar()&&(S.fuel||0)>=XP_RACE;}
function litPips(){if(!hasCar())return 0;var n=0;for(var i=0;i<3;i++)if((S.fuel||0)>=(i+1)*XP_RACE/3-0.01)n++;return n;}
function tankPips(big,before){var lit=litPips(),o='<div class="pips'+(big?' big':'')+'" aria-hidden="true">';for(var i=0;i<3;i++)o+='<i class="'+(i<lit?'on':'')+(before!=null&&i>=before&&i<lit?' new':'')+'"></i>';return o+'</div>';}
/* Eine kurze Zeile und ein Hinweis-Ton: wie weit ist es bis zum Auto oder zum Rennen */
function textsToCar(){var need=XPK*(RSTAGES[CAR0].lv-1)*(RSTAGES[CAR0].lv-1);return Math.max(1,Math.ceil((need-S.xp)/XP_TEXT));}
function tankLine(){
  if(!hasCar()){var n=textsToCar();return 'Noch '+(n===1?'ein Text':n+' Texte')+', dann dein erstes Auto!';}
  if(fuelFull())return 'Tank voll! Rennen fahren!';
  var m=Math.max(1,Math.ceil((XP_RACE-(S.fuel||0))/XP_TEXT));return 'Noch '+(m===1?'ein Text':m+' Texte')+', dann Rennen!';
}
function tankHint(){
  if(!hasCar())return 'auto'+Math.min(3,textsToCar());
  if(fuelFull())return 'tankvoll';
  return 'tank'+Math.min(3,Math.max(1,Math.ceil((XP_RACE-(S.fuel||0))/XP_TEXT)));
}
function tankText(){var need=Math.max(1,Math.ceil((XP_RACE-(S.fuel||0))/XP_TEXT));
  return fuelFull()?'Jetzt kannst du ein Rennen fahren.':'Noch '+(need===1?'ein Text':need+' Texte')+', dann ist der Tank voll.';}
function tankBlock(){
  if(!hasCar())return '<div class="bar" style="width:100%"><i style="width:'+stageProg().pct+'%"></i></div><span class="xptext">'+esc(growText())+'</span>';
  return '<div class="rwt">'+tankPips(true)+'<div><b>'+(fuelFull()?'Dein Tank ist voll!':'Dein Tank füllt sich')+'</b><span class="xptext">'+esc(tankText())+'</span></div></div>';
}

Ar·me und blau·es Blut. Wie vie·le Her·zen hat es?", "q": [{"q": "Wozu wechselt das Chamäleon meistens die Farbe?", "a": "Um seine Laune zu zeigen.", "f": ["Um sich vor Feinden zu verstecken.", "Um Insekten anzulocken."]}, {"q": "Was steckt in der Haut des Chamäleons?", "a": "Winzige Kristalle.", "f": ["Winzige Härchen.", "Bunte Farbtropfen."]}], "next": "tier-03", "card": "Mit der Farbe zeigt es vor allem seine Laune.", "r": "Ein Tier im Meer hat acht Arme und blaues Blut. Wie viele Herzen hat es?"}, {"id": "tier-03", "cat": "Tiere", "title": "Welches Tier hat drei Herzen?", "name": "Krake", "syl": "Der Kra·ke hat drei Her·zen! Zwei da·von pum·pen das Blut zu den Kie·men, und das drit·te pumpt es durch den Kör·per. Sein Blut ist auch nicht rot, son·dern blau. Au·ßer·dem hat der Kra·ke acht Ar·me, a·ber kei·ne Kno·chen. Dar·um passt er so·gar durch ganz en·ge Spal·ten. Und er ist ziem·lich schlau: In ei·nem A·qua·ri·um hat ein Kra·ke schon ein·mal ein Glas ge·öff·net. Ein an·de·res Tier lebt im Meer, at·met a·ber Luft und springt gern aus dem Was·ser. Nachts ruht nur sein hal·bes Ge·hirn. Wer ist das?", "q": [{"q": "Wie viele Herzen hat der Krake?", "a": "Drei.", "f": ["Eins.", "Acht."]}, {"q": "Welche Farbe hat das Blut vom Kraken?", "a": "Blau.", "f": ["Rot.", "Grün."]}], "next": "tier-04", "card": "Der Krake hat drei Herzen und blaues Blut.", "r": "Ein anderes Tier lebt im Meer, atmet aber Luft und springt gern aus dem Wasser. Nachts ruht nur sein halbes Gehirn. Wer ist das?"}, {"id": "tier-04", "cat": "Tiere", "title": "Wer schläft mit halbem Gehirn?", "name": "Delfin", "syl": "Der Del·fin schläft mit hal·bem Ge·hirn! Er ist ein Säu·ge·tier und at·met Luft, so wie du. Dar·um muss er im·mer wie·der zum At·men auf·tau·chen. Wür·de er tief schla·fen, könn·te er er·trin·ken. Des·halb ruht im·mer nur ei·ne Hälf·te von sei·nem Ge·hirn, und die an·de·re bleibt wach. Meist bleibt da·bei auch ein Au·ge of·fen. Da·nach wech·seln die Hälf·ten. So ruht sich der Del·fin aus und bleibt trotz·dem si·cher. Ein an·de·res Tier schläft den gan·zen Win·ter lang. Es rollt sich im Laub zu·sam·men und hat Sta·cheln. Wer ist das?", "q": [{"q": "Warum schläft der Delfin nur mit halbem Gehirn?", "a": "Er muss zum Atmen auftauchen und könnte sonst ertrinken.", "f": ["Er hat nur ein halbes Gehirn.", "Er muss die ganze Zeit fressen."]}, {"q": "Was bleibt beim schlafenden Delfin oft offen?", "a": "Ein Auge.", "f": ["Das Maul.", "Beide Ohren."]}], "next": "tier-05", "card": "Er schläft mit nur einer Hälfte vom Gehirn.", "r": "Ein anderes Tier schläft den ganzen Winter lang. Es rollt sich im Laub zusammen und hat Stacheln. Wer ist das?"}, {"id": "tier-05", "cat": "Tiere", "title": "Wie schläft ein Igel im Winter?", "name": "Igel", "syl": "Im Win·ter gibt es kaum Fut·ter, dar·um macht der I·gel Win·ter·schlaf. Er rollt sich in ei·nem Laub·hau·fen ein, und sein Kör·per wird kalt. Sein Herz schlägt dann nur noch et·wa fünf Mal pro Mi·nu·te, sonst sind es rund 200 Schlä·ge! So spart er Kraft, bis der Früh·ling kommt. Wenn er zu früh auf·wacht, ver·braucht er viel E·ner·gie. Dar·um soll man schla·fen·de I·gel nicht stö·ren. Und jetzt das Ge·gen·teil: Ein Tier mit Fle·cken und lan·gen Bei·nen ist an Land am schnells·ten. Wie heißt es?", "q": [{"q": "Warum macht der Igel Winterschlaf?", "a": "Im Winter gibt es kaum Futter.", "f": ["Im Winter ist es ihm zu hell.", "Er muss im Winter wachsen."]}, {"q": "Warum soll man schlafende Igel nicht stören?", "a": "Wacht er zu früh auf, verbraucht er viel Energie.", "f": ["Er wird sonst wütend und beißt.", "Er schläft dann nie wieder ein."]}], "next": "tier-06", "card": "Im Winterschlaf schlägt sein Herz nur noch etwa fünf Mal pro Minute.", "r": "Und jetzt das Gegenteil: Ein Tier mit Flecken und langen Beinen ist an Land am schnellsten. Wie heißt es?"}, {"id": "tier-06", "cat": "Tiere", "title": "Welches Landtier ist am schnellsten?", "name": "Gepard", "syl": "Der Ge·pard ist das schnells·te Land·tier. Er rennt et·wa 100 Ki·lo·me·ter pro Stun·de, so schnell wie ein Au·to auf der Land·stra·ße. Das schafft er a·ber nur kurz, denn nach we·ni·gen hun·dert Me·tern ist er er·schöpft. Dann muss er sich erst ein·mal aus·ru·hen. Trotz·dem ist er an Land un·schlag·bar. Sei·ne Bei·ne sind lang und sein Kör·per ist schlank. Mit dem Schwanz hält er beim Ren·nen das Gleich·ge·wicht. Nur ein Tier ist noch viel schnel·ler. Es fliegt, hat schar·fe Au·gen und fällt im Sturz·flug wie ein Pfeil. Wie heißt es?", "q": [{"q": "Wie schnell rennt der Gepard?", "a": "Etwa 100 Kilometer pro Stunde.", "f": ["Etwa 30 Kilometer pro Stunde.", "Etwa 300 Kilometer pro Stunde."]}, {"q": "Wie lange kann der Gepard so schnell rennen?", "a": "Nur kurz, nach wenigen hundert Metern ist er erschöpft.", "f": ["Mehrere Stunden am Stück.", "Einen ganzen Tag lang."]}], "next": "tier-07", "card": "Etwa 100 km/h schnell, aber nur ganz kurz.", "r": "Nur ein Tier ist noch viel schneller. Es fliegt, hat scharfe Augen und fällt im Sturzflug wie ein Pfeil. Wie heißt es?"}, {"id": "tier-07", "cat": "Tiere", "title": "Wer ist das schnellste Tier der Welt?", "name": "Wanderfalke", "syl": "Der Wan·der·fal·ke ist das schnells·te Tier der Welt. Er jagt an·de·re Vö·gel in der Luft und sieht sei·ne Beu·te schon von weit weg. Dann legt er die Flü·gel an und stürzt wie ein Pfeil nach un·ten. Im Sturz·flug schafft er mehr als 300 Ki·lo·me·ter pro Stun·de, der Ge·pard da·ge·gen nur et·wa 100. So trifft der Fal·ke sei·ne Beu·te mit·ten im Flug. Das größ·te Tier der Welt lebt a·ber im Meer. Es ist län·ger als zwei Bus·se und frisst win·zi·ge Kreb·se. Wie heißt es?", "q": [{"q": "Wie jagt der Wanderfalke?", "a": "Er stürzt mit angelegten Flügeln nach unten.", "f": ["Er läuft schnell am Boden hinterher.", "Er wartet still im Wasser."]}, {"q": "Wie schnell ist er im Sturzflug?", "a": "Mehr als 300 Kilometer pro Stunde.", "f": ["Etwa 50 Kilometer pro Stunde.", "Genau 100 Kilometer pro Stunde."]}], "next": "tier-08", "card": "Im Sturzflug schneller als 300 km/h.", "r": "Das größte Tier der Welt lebt aber im Meer. Es ist länger als zwei Busse und frisst winzige Krebse. Wie heißt es?"}, {"id": "tier-08", "cat": "Tiere", "title": "Welches Tier ist das größte der Welt?", "name": "Blauwal", "syl": "Der Blau·wal ist das größ·te Tier der Welt. Er wird bis zu 30 Me·ter lang, das sind mehr als zwei Bus·se hin·ter·ein·an·der. Trotz·dem frisst er nur win·zi·ge Kreb·se, die Krill hei·ßen. Da·von ver·schlingt er je·den Tag meh·re·re Ton·nen. Da·zu nimmt er einen rie·si·gen Schluck Was·ser und presst ihn durch sei·ne Bar·ten wie·der hi·naus. Bar·ten sind wie ein Sieb, in dem der Krill hän·gen bleibt. Der Blau·wal ist rie·sig, doch im Welt·all gibt es et·was viel Grö·ße·res. Es leuch·tet hell und ist heiß, und du siehst es je·den Tag. Was ist das?", "q": [{"q": "Wovon ernährt sich der Blauwal?", "a": "Von winzigen Krebsen, dem Krill.", "f": ["Von großen Fischen und Robben.", "Von Algen und Seegras."]}, {"q": "Was sind Barten?", "a": "Eine Art Sieb im Maul, in dem der Krill hängen bleibt.", "f": ["Seine Zähne zum Kauen.", "Die Flossen am Bauch."]}], "next": "weltall-01", "card": "Bis zu 30 Meter lang und er frisst winzigen Krill.", "r": "Der Blauwal ist riesig, doch im Weltall gibt es etwas viel Größeres. Es leuchtet hell und ist heiß, und du siehst es jeden Tag. Was ist das?"}, {"id": "weltall-01", "cat": "Weltall", "title": "Wie groß ist die Sonne?", "name": "Sonne", "syl": "Die Son·ne ist ei·ne rie·si·ge Ku·gel aus glü·hend hei·ßem Gas. Sie ist so groß, dass über ei·ne Mil·li·on Er·den hi·nein·pas·sen. Sie ist et·wa 150 Mil·li·o·nen Ki·lo·me·ter von uns ent·fernt. Ihr Licht braucht gut acht Mi·nu·ten bis zu uns. In ih·rer Mit·te ist es mehr als 15 Mil·li·o·nen Grad heiß. Oh·ne die Son·ne gä·be es kein Le·ben auf der Er·de. Die Son·ne ist ein Stern, und nachts siehst du vie·le an·de·re Ster·ne. Das hells·te Licht am Nacht·him·mel ist a·ber gar kein Stern. Wie heißt es?", "q": [{"q": "Wie viele Erden passen in die Sonne?", "a": "Über eine Million.", "f": ["Ungefähr zehn.", "Genau tausend."]}, {"q": "Wie lange braucht das Sonnenlicht bis zu uns?", "a": "Gut acht Minuten.", "f": ["Ein ganzes Jahr.", "Eine Sekunde."]}], "next": "weltall-02", "card": "Über eine Million Erden passen hinein.", "r": "Die Sonne ist ein Stern, und nachts siehst du viele andere Sterne. Das hellste Licht am Nachthimmel ist aber gar kein Stern. Wie heißt es?"}, {"id": "weltall-02", "cat": "Weltall", "title": "Wie weit ist der Mond entfernt?", "name": "Mond", "syl": "Der Mond ist et·wa 384.000 Ki·lo·me·ter von der Er·de ent·fernt. Mit dem Au·to auf der Land·stra·ße bräuch·test du un·ge·fähr 160 Ta·ge bis dort·hin, und zwar oh·ne Pau·se! Der Mond leuch·tet nicht selbst, son·dern wirft nur das Licht der Son·ne zu·rück. Dort gibt es kei·ne Luft zum At·men, dar·um braucht man einen Raum·an·zug. Zwölf Men·schen sind bis·her auf dem Mond ge·lau·fen. Ih·re Fuß·spu·ren sind im·mer noch da, denn dort weht kein Wind, der sie ver·wi·schen könn·te. Und jetzt zu ei·nem Pla·ne·ten mit be·rühm·ten Rin·gen, der kei·nen fes·ten Bo·den hat. Wie heißt er?", "q": [{"q": "Leuchtet der Mond selbst?", "a": "Nein, er wirft nur das Licht der Sonne zurück.", "f": ["Ja, er hat ein eigenes Feuer.", "Ja, nur in der Nacht."]}, {"q": "Warum sind die Fußspuren noch da?", "a": "Dort weht kein Wind.", "f": ["Die Astronauten haben sie nachgemalt.", "Der Boden ist dort aus Beton."]}], "next": "weltall-03", "card": "Die Fußspuren der ersten Menschen sind noch da.", "r": "Und jetzt zu einem Planeten mit berühmten Ringen, der keinen festen Boden hat. Wie heißt er?"}, {"id": "weltall-03", "cat": "Weltall", "title": "Welcher Planet hat Ringe?", "name": "Saturn", "syl": "Sa·turn ist der Pla·net mit den be·rühm·ten Rin·gen. Sie se·hen aus wie ei·ne rie·si·ge Schei·be, a·ber in Wahr·heit be·ste·hen sie aus Mil·li·ar·den Eis·bro·cken. Man·che sind klein wie Sand, an·de·re sind groß wie ein Haus. Sa·turn ist ein Gas·pla·net und hat kei·nen fes·ten Bo·den zum Lan·den. Er ist so·gar leich·ter als Was·ser. Wenn es ein rie·si·ges Be·cken gä·be, wür·de er dar·in schwim·men. A·ber wie kommt man über·haupt ins Welt·all? Da·zu braucht man ein Fahr·zeug, das Feu·er speit und mit lau·tem Don·ner star·tet. Wie heißt es?", "q": [{"q": "Woraus bestehen die Ringe vom Saturn?", "a": "Aus Milliarden Eisbrocken.", "f": ["Aus Sand und Steinen.", "Aus heißem Gas."]}, {"q": "Kann man auf Saturn landen?", "a": "Nein, er hat keinen festen Boden.", "f": ["Ja, auf seinen Ringen.", "Ja, der Boden ist aus Eis."]}], "next": "technik-01", "card": "Seine Ringe bestehen aus Milliarden Eisbrocken.", "r": "Aber wie kommt man überhaupt ins Weltall? Dazu braucht man ein Fahrzeug, das Feuer speit und mit lautem Donner startet. Wie heißt es?"}, {"id": "technik-01", "cat": "Technik", "title": "Wie kommt man ins Weltall?", "name": "Rakete", "syl": "Ei·ne Ra·ke·te muss sehr schnell sein, um im Welt·all zu blei·ben, näm·lich et·wa 28.000 Ki·lo·me·ter pro Stun·de! Da·für ver·brennt sie rie·si·ge Men·gen Treib·stoff. Die hei·ßen Ga·se schie·ßen nach un·ten aus der Dü·se, und da·durch wird die Ra·ke·te nach o·ben ge·drückt. Das nennt man Rück·stoß. Du kennst ihn von ei·nem Luft·bal·lon, denn wenn du ihn los·lässt, flitzt er da·von. Ei·ne Ra·ke·te funk·tio·niert ge·nau·so, nur viel grö·ßer. Und wer hat das Flug·zeug er·fun·den? Es wa·ren zwei Brü·der aus A·me·ri·ka, die vor·her Fahr·rä·der bau·ten. Wie hie·ßen sie?", "q": [{"q": "Wie nennt man den Schub, der die Rakete nach oben drückt?", "a": "Rückstoß.", "f": ["Anziehung.", "Gegenwind."]}, {"q": "Mit welchem Spielzeug kann man das vergleichen?", "a": "Mit einem Luftballon, den man loslässt.", "f": ["Mit einem Kreisel, der sich dreht.", "Mit einem Ball, der hüpft."]}], "next": "technik-02", "card": "Eine Rakete fliegt mit Rückstoß, wie ein Luftballon.", "r": "Und wer hat das Flugzeug erfunden? Es waren zwei Brüder aus Amerika, die vorher Fahrräder bauten. Wie hießen sie?"}, {"id": "technik-02", "cat": "Technik", "title": "Wer hat das Flugzeug erfunden?", "name": "Flugzeug", "syl": "Den ers·ten Flug mit Mo·tor schaff·ten die Brü·der Wil·bur und Or·ville Wright. Das war im Jahr 1903 in A·me·ri·ka. Ihr ers·ter Flug dau·er·te nur zwölf Se·kun·den und war et·wa 37 Me·ter weit. Das ist kür·zer, als ein Jum·bo-Jet lang ist! Vor·her bau·ten die Brü·der Fahr·rä·der und tüf·tel·ten meh·re·re Jah·re lang. Sie bau·ten so·gar einen ei·ge·nen Wind·ka·nal, um ih·re Flü·gel zu tes·ten. Heu·te flie·gen Flug·zeu·ge vie·le Stun·den oh·ne Pau·se. A·ber wie fin·den Pi·lo·ten und See·leu·te ih·ren Weg? Sie nut·zen ein Ge·rät mit ei·ner Na·del. Wie heißt es?", "q": [{"q": "Wie lange dauerte der erste Flug?", "a": "Zwölf Sekunden.", "f": ["Zwölf Minuten.", "Zwei Stunden."]}, {"q": "Was bauten die Brüder, um Flügel zu testen?", "a": "Einen Windkanal.", "f": ["Ein Schwimmbad.", "Einen Turm."]}], "next": "technik-03", "card": "Der erste Flug dauerte nur zwölf Sekunden.", "r": "Aber wie finden Piloten und Seeleute ihren Weg? Sie nutzen ein Gerät mit einer Nadel. Wie heißt es?"}, {"id": "technik-03", "cat": "Technik", "title": "Wie funktioniert ein Kompass?", "name": "Kompass", "syl": "Ei·ne Kom·pass·na·del zeigt im·mer nach Nor·den. A·ber wie macht sie das? Die Na·del ist ein klei·ner Ma·gnet, und die Er·de ist selbst wie ein rie·si·ger Ma·gnet. In ih·rem In·ne·ren fließt näm·lich flüs·si·ges Me·tall, und da·durch ent·steht ein Ma·gnet·feld. Da·nach rich·tet sich die Na·del aus. Schon vor lan·ger Zeit nutz·ten See·leu·te so et·was, da·mit sie auch bei Ne·bel ih·ren Weg fan·den. Auch man·che Zug·vö·gel kön·nen das Ma·gnet·feld spü·ren. Und jetzt zu dir: In dei·ner Brust ar·bei·tet Tag und Nacht ein Mus·kel, den du nicht an·hal·ten kannst. Wie heißt er?", "q": [{"q": "Wohin zeigt die Kompassnadel?", "a": "Nach Norden.", "f": ["Nach Süden.", "Immer zur Sonne."]}, {"q": "Wie ist die Erde in diesem Text beschrieben?", "a": "Wie ein riesiger Magnet.", "f": ["Wie ein riesiger Ball aus Eis.", "Wie ein großes Uhrwerk."]}], "next": "koerper-01", "card": "Die Erde ist wie ein riesiger Magnet.", "r": "Und jetzt zu dir: In deiner Brust arbeitet Tag und Nacht ein Muskel, den du nicht anhalten kannst. Wie heißt er?"}, {"id": "koerper-01", "cat": "Körper", "title": "Was macht dein Herz den ganzen Tag?", "name": "Herz", "syl": "Dein Herz ist un·ge·fähr so groß wie dei·ne Faust, und es schlägt oh·ne Pau·se, Tag und Nacht. Wenn du ruhst, sind es et·wa 80 Schlä·ge pro Mi·nu·te. Das sind mehr als 100.000 Schlä·ge an je·dem Tag! Da·bei pumpt das Herz das Blut durch dei·nen gan·zen Kör·per. Wenn du rennst, schlägt es schnel·ler. Du kannst es spü·ren, wenn du die Hand auf die Brust o·der an den Hals legst. Ver·such es mal! Bei Käl·te o·der Angst ste·hen dir manch·mal plötz·lich die Haa·re zu Ber·ge. Wie nennt man das?", "q": [{"q": "Wie groß ist dein Herz ungefähr?", "a": "So groß wie deine Faust.", "f": ["So groß wie dein Kopf.", "So groß wie eine Erbse."]}, {"q": "Was passiert mit dem Herzschlag, wenn du rennst?", "a": "Er wird schneller.", "f": ["Er wird langsamer.", "Er hört kurz auf."]}], "next": "koerper-02", "card": "Dein Herz schlägt über 100.000 Mal am Tag.", "r": "Bei Kälte oder Angst stehen dir manchmal plötzlich die Haare zu Berge. Wie nennt man das?"}, {"id": "koerper-02", "cat": "Körper", "title": "Warum bekommst du Gänsehaut?", "name": "Gänsehaut", "syl": "Wenn dir kalt ist, be·kommst du Gän·se·haut. Das kann auch bei Angst o·der bei ei·nem schö·nen Lied pas·sie·ren. Fast je·des Haar auf dei·ner Haut hat einen win·zi·gen Mus·kel. Der zieht sich zu·sam·men und stellt das Haar auf, und so ent·ste·hen die klei·nen Hü·gel. Frü·her hat·ten Men·schen viel mehr Kör·per·haa·re. Auf·ge·stell·te Haa·re hiel·ten sie warm o·der lie·ßen sie grö·ßer wir·ken. Heu·te hilft uns das kaum noch, a·ber der Kör·per macht es trotz·dem. Et·was in dir ist hart, hält dich auf·recht und schützt dein Ge·hirn. Was ist das?", "q": [{"q": "Wann bekommst du Gänsehaut?", "a": "Zum Beispiel bei Kälte, Angst oder einem schönen Lied.", "f": ["Nur, wenn du krank bist.", "Nur beim Schlafen."]}, {"q": "Was stellt die Haare auf?", "a": "Ein winziger Muskel am Haar.", "f": ["Der Wind von draußen.", "Ein Knochen unter der Haut."]}], "next": "koerper-03", "card": "Winzige Muskeln stellen die Haare auf.", "r": "Etwas in dir ist hart, hält dich aufrecht und schützt dein Gehirn. Was ist das?"}, {"id": "koerper-03", "cat": "Körper", "title": "Wie viele Knochen hat ein Mensch?", "name": "Knochen", "syl": "Ein Er·wach·se·ner hat 206 Kno·chen. Als Ba·by hat·test du so·gar noch mehr, näm·lich et·wa 300. Vie·le da·von wach·sen mit der Zeit zu·sam·men. Die meis·ten Kno·chen ste·cken in dei·nen Hän·den und Fü·ßen. Der kleins·te Kno·chen sitzt im Ohr und ist nur so groß wie ein Reis·korn. Der größ·te ist der O·ber·schen·kel·kno·chen. Kno·chen sind ü·bri·gens le·ben·dig, denn sie wach·sen und hei·len, wenn sie bre·chen. Das dau·ert oft ei·ni·ge Wo·chen. A·ber wie schnell kann ein Mensch ren·nen? Ein Mann aus Ja·mai·ka ist schnel·ler ge·lau·fen als je·der an·de·re. Wie heißt er?", "q": [{"q": "Wie viele Knochen hat ein Erwachsener?", "a": "206.", "f": ["Genau 100.", "Über 1000."]}, {"q": "Wo sitzt der kleinste Knochen?", "a": "Im Ohr.", "f": ["Im kleinen Zeh.", "In der Nase."]}], "next": "sport-01", "card": "206 Knochen, der kleinste sitzt im Ohr.", "r": "Aber wie schnell kann ein Mensch rennen? Ein Mann aus Jamaika ist schneller gelaufen als jeder andere. Wie heißt er?"}, {"id": "sport-01", "cat": "Sport", "title": "Wer ist der schnellste Mensch der Welt?", "name": "Schnellster Mensch", "syl": "U·sain Bolt aus Ja·mai·ka ist der schnells·te Mensch der Welt. Im Jahr 2009 lief er in Ber·lin 100 Me·ter in 9,58 Se·kun·den. Das ist bis heu·te Welt·re·kord. Sei·ne Schrit·te sind sehr lang, des·halb brauch·te er für die gan·ze Stre·cke nur et·wa 41 Schrit·te. Da·bei war er kurz mit mehr als 40 Ki·lo·me·tern pro Stun·de un·ter·wegs. Das ist fast so schnell wie ein Au·to in der Stadt. Und jetzt zu ei·nem Sport mit Ball und Korb. Der Korb hängt weit über dei·nem Kopf, a·ber wie hoch ge·nau?", "q": [{"q": "Aus welchem Land kommt Usain Bolt?", "a": "Aus Jamaika.", "f": ["Aus Amerika.", "Aus Kenia."]}, {"q": "Wie viele Meter lief er in 9,58 Sekunden?", "a": "100 Meter.", "f": ["400 Meter.", "1000 Meter."]}], "next": "sport-02", "card": "100 Meter in 9,58 Sekunden.", "r": "Und jetzt zu einem Sport mit Ball und Korb. Der Korb hängt weit über deinem Kopf, aber wie hoch genau?"}, {"id": "sport-02", "cat": "Sport", "title": "Wie hoch hängt ein Basketballkorb?", "name": "Basketballkorb", "syl": "Ein Bas·ket·ball·korb hängt 3,05 Me·ter hoch, bei den Pro·fis und bei al·len Gro·ßen. Der Ring ist 45 Zen·ti·me·ter breit und der Ball et·wa 24 Zen·ti·me·ter groß. Der Ball passt al·so mit et·was Platz hin·durch, a·ber man braucht viel Ge·fühl beim Wer·fen. Man·che Spie·ler sprin·gen so hoch, dass sie den Ball von o·ben in den Korb stop·fen. Das nennt man Dun·king. Und jetzt zu ei·nem Spiel mit gel·bem Ball und Schlä·ger, das ein·mal drei Ta·ge dau·er·te! Wie lan·ge spiel·ten die bei·den ins·ge·samt?", "q": [{"q": "Wie hoch hängt der Korb?", "a": "3,05 Meter.", "f": ["2 Meter.", "5 Meter."]}, {"q": "Wie nennt man es, wenn man den Ball mit der Hand in den Korb stopft?", "a": "Dunking.", "f": ["Freiwurf.", "Rebound."]}], "next": "sport-03", "card": "Der Korb hängt 3,05 Meter hoch.", "r": "Und jetzt zu einem Spiel mit gelbem Ball und Schläger, das einmal drei Tage dauerte! Wie lange spielten die beiden insgesamt?"}, {"id": "sport-03", "cat": "Sport", "title": "Welches Tennisspiel dauerte drei Tage?", "name": "Längstes Match", "syl": "Im Jahr 2010 spiel·ten John Is·ner und Ni·co·las Ma·hut in Wim·ble·don ge·gen·ein·an·der. Das Spiel dau·er·te mehr als elf Stun·den und zog sich über drei Ta·ge. Der letz·te Satz ging 70 zu 68, da·bei en·det ein Satz nor·ma·ler·wei·se bei 6 o·der 7. So·gar die An·zei·ge·ta·fel gab ir·gend·wann auf. Am En·de wa·ren bei·de völ·lig er·schöpft. Es ist das längs·te Ten·nis·spiel al·ler Zei·ten. Und jetzt zu ei·nem ech·ten Rät·sel: Im Meer zwi·schen Flo·ri·da und Ber·mu·da sol·len Schif·fe und Flug·zeu·ge ein·fach ver·schwin·den. Wie heißt die·ser Ort?", "q": [{"q": "Wie lange dauerte das Spiel?", "a": "Mehr als elf Stunden, über drei Tage.", "f": ["Genau 90 Minuten.", "Eine Stunde."]}, {"q": "Wo fand das Spiel statt?", "a": "In Wimbledon.", "f": ["In Paris.", "In New York."]}], "next": "raetsel-01", "card": "Über elf Stunden, verteilt auf drei Tage.", "r": "Und jetzt zu einem echten Rätsel: Im Meer zwischen Florida und Bermuda sollen Schiffe und Flugzeuge einfach verschwinden. Wie heißt dieser Ort?"}, {"id": "raetsel-01", "cat": "Rätsel", "title": "Was ist das Bermuda-Dreieck?", "name": "Bermuda-Dreieck", "syl": "Das Ber·mu·da-Drei·eck ist ein Ge·biet im At·lan·tik, zwi·schen Flo·ri·da, Ber·mu·da und Puer·to Ri·co. Dort sol·len Schif·fe und Flug·zeu·ge ein·fach ver·schwin·den, das er·zählt man sich schon seit vie·len Jahr·zehn·ten. Doch For·scher ha·ben nach·ge·zählt. Dort ver·schwin·den nicht mehr Schif·fe als in an·de·ren Mee·ren, in de·nen viel los ist. Oft sind Stür·me schuld, und man·che Ge·schich·ten wur·den auch aus·ge·schmückt. Ein ech·tes Rät·sel ist es al·so nicht. A·ber in Schott·land soll in ei·nem See ein Mons·ter mit ei·nem lan·gen Hals le·ben. Wie heißt es?", "q": [{"q": "Wo liegt das Bermuda-Dreieck?", "a": "Im Atlantik.", "f": ["Im Pazifik.", "In der Nordsee."]}, {"q": "Was sagen Forscher zu den verschwundenen Schiffen?", "a": "Dort verschwinden nicht mehr als anderswo.", "f": ["Dort wohnt ein Seeungeheuer.", "Ein Magnet zieht sie nach unten."]}], "next": "raetsel-02", "card": "Dort verschwinden nicht mehr Schiffe als anderswo.", "r": "Aber in Schottland soll in einem See ein Monster mit einem langen Hals leben. Wie heißt es?"}, {"id": "raetsel-02", "cat": "Rätsel", "title": "Gibt es Nessie wirklich?", "name": "Nessie", "syl": "Im Loch Ness in Schott·land soll ein Mons·ter le·ben, das man Nes·sie nennt. Im Jahr 1933 gab es vie·le Be·rich·te, denn Men·schen woll·ten einen lan·gen Hals im Was·ser ge·se·hen ha·ben. Spä·ter such·ten vie·le Leu·te mit Boo·ten, Schall·wel·len und Ka·me·ras, a·ber ge·fun·den ha·ben sie nichts. Im Jahr 2018 un·ter·such·ten For·scher so·gar Was·ser·pro·ben auf Erb·gut. Ein Mons·ter fan·den sie nicht, a·ber sehr viel Erb·gut von Aa·len. Viel·leicht ha·ben die Men·schen al·so gro·ße Aa·le ge·se·hen. In Ägyp·ten ste·hen rie·si·ge Stein·bau·ten mit ei·ner Spit·ze. Da·mals gab es a·ber noch kei·ne Krä·ne. Wie wur·den sie ge·baut?", "q": [{"q": "In welchem See soll Nessie leben?", "a": "Im Loch Ness in Schottland.", "f": ["Im Bodensee in Deutschland.", "Im Meer bei Norwegen."]}, {"q": "Was fanden die Forscher in den Wasserproben?", "a": "Viel Erbgut von Aalen, aber kein Monster.", "f": ["Knochen von einem Saurier.", "Ein großes Nest."]}], "next": "raetsel-03", "card": "Im See fand man Erbgut von Aalen, aber kein Monster.", "r": "In Ägypten stehen riesige Steinbauten mit einer Spitze. Damals gab es aber noch keine Kräne. Wie wurden sie gebaut?"}, {"id": "raetsel-03", "cat": "Rätsel", "title": "Wie wurden die Pyramiden gebaut?", "name": "Pyramiden", "syl": "Die gro·ße Py·ra·mi·de von Gi·zeh in Ägyp·ten ist rund 4500 Jah·re alt. Sie be·steht aus mehr als zwei Mil·li·o·nen Stein·blö·cken, und man·che da·von wie·gen meh·re·re Ton·nen. Wie ha·ben die Men·schen das oh·ne Krä·ne ge·schafft? Sie nutz·ten Ram·pen, Schlit·ten und vie·le Ar·bei·ter. Man hat so·gar die Stadt der Ar·bei·ter ge·fun·den, mit Bä·cke·rei·en und Un·ter·künf·ten. Nach heu·ti·gem Wis·sen wa·ren es kei·ne Skla·ven. Ganz si·cher weiß man a·ber trotz·dem nicht al·les. Von ei·ner In·sel er·zählt man, sie sei im Meer ver·sun·ken, a·ber viel·leicht gab es sie nie. Wie heißt sie?", "q": [{"q": "Wie alt ist die große Pyramide ungefähr?", "a": "Rund 4500 Jahre.", "f": ["Rund 100 Jahre.", "Eine Million Jahre."]}, {"q": "Was nutzten die Menschen statt Kränen?", "a": "Rampen, Schlitten und viele Arbeiter.", "f": ["Riesige Maschinen.", "Elefanten aus Afrika."]}], "next": "raetsel-04", "card": "Mehr als zwei Millionen Steinblöcke.", "r": "Von einer Insel erzählt man, sie sei im Meer versunken, aber vielleicht gab es sie nie. Wie heißt sie?"}, {"id": "raetsel-04", "cat": "Rätsel", "title": "Was war Atlantis?", "name": "Atlantis", "syl": "At·lan·tis soll ei·ne In·sel ge·we·sen sein, die im Meer ver·sun·ken ist. Da·von er·zähl·te der Den·ker Pla·ton vor mehr als 2300 Jah·ren. Er be·schrieb ei·ne mäch·ti·ge Stadt mit Hä·fen und Tem·peln. Dann sei sie an ei·nem Tag und in ei·ner Nacht un·ter·ge·gan·gen. Ge·fun·den hat man sie nie. Die meis·ten For·scher glau·ben, dass Pla·ton die Ge·schich·te er·fun·den hat, um da·mit et·was zu er·klä·ren. Viel·leicht er·zählst du die Ge·schich·te ja ein·mal selbst wei·ter. Und jetzt zu·rück zu den Tie·ren: Ein klei·nes Tier läuft kopf·über an der De·cke und fällt nicht her·un·ter. Wie macht es das?", "q": [{"q": "Wer hat die Geschichte von Atlantis erzählt?", "a": "Der Denker Platon.", "f": ["Ein Seemann aus Spanien.", "Ein Forscher von heute."]}, {"q": "Was glauben die meisten Forscher über Atlantis?", "a": "Dass die Geschichte erfunden ist.", "f": ["Dass Atlantis unter dem Eis liegt.", "Dass man es bald findet."]}], "next": "tier-01", "card": "Platon erzählte von der versunkenen Insel.", "r": "Vielleicht erzählst du die Geschichte ja einmal selbst weiter. Und jetzt zurück zu den Tieren: Ein kleines Tier läuft kopfüber an der Decke und fällt nicht herunter. Wie macht es das?"}];

function pauseAnalyze(x,sr){
  /* Stockstellen: Pausen, die deutlich länger sind als die eigenen Pausen zwischen Wörtern */
  var F=0.02,hop=Math.max(1,Math.round(sr*F)),n=Math.floor(x.length/hop),i,j;
  if(n<50)return null;
  var e=new Float32Array(n);
  for(i=0;i<n;i++){var s=0,o=i*hop;for(j=0;j<hop;j++){var v=x[o+j];s+=v*v;}e[i]=Math.sqrt(s/hop);}
  var srt=Array.prototype.slice.call(e).sort(function(a,b){return a-b;});
  var floor=srt[Math.floor(n*0.1)],peak=srt[Math.floor(n*0.95)],thr=Math.max(floor*2.5,peak*0.1,1e-4),first=-1,last=-1;
  for(i=0;i<n;i++){if(e[i]>thr){if(first<0)first=i;last=i;}}
  if(first<0||last-first<50)return null;
  /* Lücken sammeln; kurze Geräusche (unter 60 ms) beenden keine Lücke */
  var gaps=[],run=0,sp=0,gs=-1;
  for(i=first;i<=last;i++){
    if(e[i]>thr){sp++;if(sp>=3&&gs>=0){if(run>=3)gaps.push({s:gs,len:run*F});gs=-1;run=0;}}
    else{if(gs<0){gs=i;run=0;}run+=1+(sp>0&&sp<3?sp:0);sp=0;}
  }
  var lost=0,total=last-first+1;
  gaps.forEach(function(g){total-=Math.round(g.len/F);});
  gaps.forEach(function(g){g.before=(g.s-first)-lost;lost+=Math.round(g.len/F);});
  return {gaps:gaps,total:total};
}
function suggestWords(t,res){
  /* Jede Lücke wird einer Wortgrenze zugeordnet (Reihenfolge bleibt, Satzzeichen ziehen Pausen an).

  if(!res||!res.gaps||!res.gaps.length||res.total<=0)return [];
  var n=t.rs,cum=[],c=0,i,g,w;
  for(i=0;i<n;i++){c+=t.words[i].sy.join('').length+1;cum.push(c);}
  var sc=c/n,G=res.gaps,W=n-1;if(W<1)return [];
  function punct(k){return /[.,;:!?]/.test(t.words[k].post);}
  var pos=G.map(function(x){return x.before/res.total*c;});

  for(g=0;g<G.length;g++){
    D[g]=new Float64Array(W);P[g]=new Int32Array(W);
    var bm=g>0?1e18:0,bi=-1;
    for(w=0;w<W;w++){
      var cost=Math.abs(pos[g]-cum[w])/sc,bon=punct(w)?Math.min(1.2,G[g].len/0.4):0;
      var a1=cost-bon+bm,a2=g>0?cost+1+D[g-1][w]:1e18;
      if(a2<a1){D[g][w]=a2;P[g][w]=w;}else{D[g][w]=a1;P[g][w]=bi;}
      if(g>0&&D[g-1][w]<bm){bm=D[g-1][w];bi=w;}
    }
  }
  var asg=new Array(G.length),bw=0;
  for(w=1;w<W;w++)if(D[G.length-1][w]<D[G.length-1][bw])bw=w;
  for(g=G.length-1;g>=0;g--){asg[g]=bw;if(g>0)bw=P[g][bw];}
  var inner=[];for(g=0;g<G.length;g++)if(!punct(asg[g]))inner.push(G[g].len);

  var med=inner.length?inner[Math.floor(inner.length/2)]:0.15,lim=Math.min(1.2,Math.max(0.75,med*3));

    if(out.length>=cap||x.idx<=0||x.idx>=n)return;

    out.push(x.idx);
  });

}

    RSTAGES.map(function(s){return '<button class="btn ghost sm'+(rankOf(Lc)===RSTAGES.indexOf(s)?' on':'')+'" data-a="dbgLv" data-v="'+s.lv+'">'+s.lv+' · '+esc(s.n)+'</button>';}).join('')+
    '</div><button class="btn sm" data-a="dbgFuel">Tank füllen</button></div>';
  h+='<h3 class="setgrp">Dein Code</h3><div class="setrow">'+(CODE?'<span class="hint">Angemeldet mit <b>'+esc(CODE)+'</b>. Der Fortschritt wird automatisch gespeichert und ist auf jedem Gerät mit diesem Code da.</span><button class="link" data-a="login">Anderen Code nutzen</button>':'<button class="link" data-a="login">Mit Code anmelden</button>')+'<button class="link" data-a="reset">Fortschritt zurücksetzen</button></div></div></details>';
  h+='<button class="btn wide" data-a="sheetOk">Fertig</button></div>';
  openBox('#sheet',h);$('#sheet').scrollTop=sc;
}
/* Sichern und Laden: der ganze Fortschritt als Code oder Datei (ohne Aufnahmen) */
function b64e(str){return btoa(unescape(encodeURIComponent(str)));}
function b64d(str){return decodeURIComponent(escape(atob(str)));}
function exportCode(){return 'LM1:'+b64e(JSON.stringify(S));}
function parseBackup(txt){
  txt=String(txt||'').trim();var j=null;
  try{if(txt.indexOf('LM1:')===0)j=JSON.parse(b64d(txt.slice(4).replace(/\s+/g,'')));else if(txt.charAt(0)==='{')j=JSON.parse(txt);}catch(e){j=null;}
  if(!j||typeof j!=='object'||typeof j.xp!=='number'||!j.done)return null;
  return merge(j);
}
var FRAMED=(function(){try{return window.top!==window;}catch(e){return true;}})();
var IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var STANDALONE=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
function renderBackup(msg){
  var h='<div class="card left"><h2>Sichern und laden</h2>';
  h+='<p class="hint">'+(CODE?'Du bist mit dem Code '+esc(CODE)+' angemeldet, der Fortschritt wird online gespeichert. Zusätzlich kannst du ihn hier sichern.':'Der Fortschritt liegt nur in diesem Browser.')+' Mit dem Code kannst du ihn sichern oder auf ein anderes Gerät mitnehmen. Aufnahmen kommen nicht mit.</p>';
  h+='<div class="setrow"><span class="eyebrow">Sichern</span><textarea class="code" id="expCode" readonly>'+esc(exportCode())+'</textarea><div class="row"><button class="btn ghost" data-a="copyCode">Code kopieren</button>'+(FRAMED?'':'<button class="btn ghost" data-a="saveFile">Als Datei</button>')+'</div></div>';
  h+='<div class="setrow"><span class="eyebrow">Laden</span><textarea class="code" id="impCode" placeholder="Code hier einfügen"></textarea><div class="row"><button class="btn ghost" data-a="loadCode">Code laden</button><label class="btn ghost" style="display:flex;align-items:center;justify-content:center">Datei wählen<input type="file" id="impFile" accept=".json,.txt,application/json,text/plain" hidden></label></div></div>';
  if(msg)h+='<p class="hint fb" id="bkmsg">'+esc(msg)+'</p>';
  if(IOS&&!STANDALONE)h+='<p class="hint">Tipp für iPhone und iPad: Öffne die App in Safari und wähle „Teilen“ und dann „Zum Home-Bildschirm“. Dann löscht Safari den Fortschritt nicht nach längerer Pause.</p>';
  h+='<button class="btn wide" data-a="settings">Zurück</button></div>';
  openBox('#sheet',h);
}
function applyBackup(txt){
  var d=parseBackup(txt);
  if(!d){renderBackup('Das hat nicht geklappt. Prüfe, ob der Code vollständig ist.');return;}
  S=d;save();R=null;renderHome();show('home');renderBackup('Geladen: Level '+lvl(S.xp)+', '+doneCount()+' Texte.');
}
/* Anmelden mit Code */
function renderLogin(msg,pre){
  var h='<div class="card left">';
  if(CODE){
    h+='<h2>Angemeldet</h2><p class="hint">Du bist mit dem Code <b>'+esc(CODE)+'</b> angemeldet. Dein Fortschritt wird gespeichert, so kannst du auf jedem Gerät mit diesem Code weitermachen.</p>';
    h+='<p class="hint">'+(SY.dirty||SY.state==='off'?'Noch nicht alles gespeichert. Das passiert, sobald wieder Internet da ist.':'Alles gespeichert.')+'</p>';
    h+='<p class="hint">Anderen Code eingeben:</p>';
  }else{
    h+='<h2>Mit Code anmelden</h2><p class="hint">Mit deinem Code wird dein Fortschritt gespeichert. So kannst du auf jedem Gerät weitermachen, und jeder hat seinen eigenen Stand.</p>';
  }
  h+='<input class="codein" id="codeIn" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="z. B. MOND-4821" value="'+esc(pre||'')+'">';
  if(msg)h+='<p class="hint fb" id="codemsg">'+esc(msg)+'</p>';
  h+='<button class="btn wide" data-a="codeGo">Anmelden</button>';
  if(CODE)h+='<button class="btn ghost wide" data-a="logout">Abmelden</button>';
  h+='<button class="link" data-a="sheetOk">Abbrechen</button></div>';
  openBox('#sheet',h);
  var i=$('#codeIn');if(i&&!pre)try{i.focus();}catch(e){}
}
function useCode(c,st){
  if(SY.dirty)syncPush(true);
  var loc=readLocal(c);
  if(st&&loc&&(loc.ts||0)>(st.ts||0))st=loc;
  CODE=c;try{localStorage.setItem(CODEK,c);}catch(e){}
  SY.state='';SY.dirty=false;R=null;S=merge(st||loc);saveLocal();
  closeBox('#sheet');renderHome();show('home');readStyle();
  syncStart();
}
function loginMsg(msg,pre){if(GATE&&!CODE){closeBox('#sheet');renderGate(msg,pre);show('home');}else renderLogin(msg,pre);}
function codeGo(c){
  c=normCode(c);
  if(c.length<4){loginMsg('Der Code ist zu kurz.',c);return;}
  if(c===CODE){closeBox('#sheet');return;}
  loginMsg('Einen Moment …',c);
  syncGet(c).then(function(r){
    if(r.nein){loginMsg('Diesen Code gibt es nicht. Prüfe, ob er richtig geschrieben ist.',c);return;}
    if(r.state){useCode(c,r.state);return;}
    if(readLocal(c)){useCode(c,null);return;}
    if(GATE&&!(S.xp>0)){codeNew(c,false);return;}
    var h='<div class="card left">'+(GATE?'<h2>Willkommen!</h2><p class="hint">Auf diesem Gerät gibt es schon einen Lese-Fortschritt. Soll er zu deinem Code <b>'+esc(c)+'</b> mitkommen?</p>':'<h2>Neuer Code</h2><p class="hint">Den Code <b>'+esc(c)+'</b> gibt es noch nicht. Soll er neu angelegt werden?</p>');
    h+='<button class="btn wide" data-a="codeNew" data-v="'+esc(c)+'">Neu anfangen</button>';
    if(S.xp>0)h+='<button class="btn ghost wide" data-a="codeKeep" data-v="'+esc(c)+'">Fortschritt von hier mitnehmen</button>';
    h+='<button class="link" data-a="login">Anders schreiben</button></div>';
    openBox('#sheet',h);
  }).catch(function(){
    if(readLocal(c)){useCode(c,null);return;}
    loginMsg('Gerade gibt es keine Verbindung. Versuche es gleich nochmal.',c);
  });
}
function codeNew(c,keep){
  var d=keep?merge(JSON.parse(JSON.stringify(S))):merge(null);
  CODE=normCode(c);try{localStorage.setItem(CODEK,CODE);}catch(e){}
  R=null;S=d;save();syncPush();closeBox('#sheet');renderHome();show('home');readStyle();
}
function logout(msg){
  if(SY.dirty)syncPush(true);
  CODE='';try{localStorage.removeItem(CODEK);}catch(e){}
  SY.state='';SY.dirty=false;R=null;S=load();closeBox('#sheet');renderHome();show('home');readStyle();
  if(msg)loginMsg(msg);
}
function renderReset(){
  openBox('#sheet','<div class="card"><h2>Fortschritt löschen?</h2><p class="hint">Alle gelesenen Texte, Autos und markierten Wörter auf diesem Gerät werden gelöscht.</p><div class="cfbtns"><button class="btn ghost" data-a="sheetOk">Abbrechen</button><button class="btn" data-a="doReset">Löschen</button></div></div>');
}
/* Klicks */
document.addEventListener('click',function(e){
  var w=e.target.closest('.w');
  if(w&&R&&R.phase==='mark'&&$('#rtext').contains(w)){var i=w.dataset.i;R.marks[i]=!R.marks[i];w.classList.toggle('st',!!R.marks[i]);if(R.marks[i])R.all[i]=true;else{R.all[i]=false;delete R.all[i];}return;}
  if(w&&R&&R.phase==='opa'&&$('#rtext').contains(w)){var oi=w.dataset.i;if(R.all[oi]){delete R.all[oi];w.classList.remove('st');}else{R.all[oi]=true;w.classList.add('st');}return;}
  if(w&&R&&$('#rr')&&$('#rr').contains(w)){listen(+w.dataset.i);return;}
  if(w&&R&&R.phase==='read'&&$('#rtext').contains(w)){listen(+w.dataset.i);return;}
  var pt=e.target.closest&&e.target.closest('[data-pt]');
  if(pt&&$('#v-stats').contains(pt)){var pi=+pt.dataset.pt,pp=S.log.filter(function(x){return x.wpm;}).slice(-30)[pi],cr=$('#chartread');
    if(cr&&pp)cr.textContent=fmtDate(pp.ts)+' · '+(byId[pp.id]?byId[pp.id].title:'')+' · '+pp.wpm+' Wörter pro Minute';
    var ds=document.querySelectorAll('#v-stats .dt');for(var di=0;di<ds.length;di++)ds[di].classList.toggle('sel',di===pi);return;}
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'home':case 'home2':stopListen();closeBox('#modal');renderHome();show('home');break;
    case 'cat':renderCat(v);break;
    case 'topics':renderTopics();break;
    case 'open':openText(v);break;
    case 'nextread':stopListen();closeBox('#modal');openText(v);break;
    case 'leave':recStop(false);stopListen();renderHome();show('home');break;
    case 'listen':listen(undefined,'a');break;
    case 'listenR':listen(undefined,'b');break;
    case 'start':startRound();break;
    case 'plr':plToggle(v);break;
    case 'plseek':plSeek(v,e.clientX);break;
    case 'ms':R.ms=v;renderCtl();window.scrollTo(0,0);break;
    case 'self':if(R&&R.entry){R.entry.self=+v;save();var nx=$('#dock [data-a="ms"]');if(nx)nx.disabled=false;var sb2=document.querySelectorAll('.selfrow .btn');for(var si=0;si<sb2.length;si++){var on=(+sb2[si].dataset.v===+v);sb2[si].classList.toggle('on',on);sb2[si].classList.toggle('ghost',!on);}}break;
    case 'takeSug':(R.sug||[]).forEach(function(k){R.marks[k]=true;R.all[k]=true;var ww=$('#rtext .w[data-i="'+k+'"]');if(ww)ww.classList.add('st');});break;
    case 'stats':renderStats();show('stats');break;
    case 'opa':opaStart('opa');break;
    case 'solo':opaStart('solo');break;
    case 'soloHear':soloHear();break;
    case 'opaKid':opaStep('kid');break;
    case 'opaNext':opaStep('next');break;
    case 'opaBack':opaStep('back');break;
    case 'stop':stopRound();break;
    case 'shareRec':shareRec();break;
    case 'whNoteOk':S.whNote='';save();renderHome();break;
    case 'cancel':recStop(false);cdHide();if(MODE==='partner'&&R.phase==='opa'){stopListen();renderHome();show('home');break;}R.phase='read';renderCtl();break;
    case 'mode':setMode(v||null);renderHome();show('home');break;
    case 'again':R.phase='read';renderCtl();window.scrollTo(0,0);break;
    case 'check':R.phase='check';R.qi=0;renderCtl();window.scrollTo(0,0);break;
    case 'pick':var pq=v.split('-'),qi=+pq[0],oj=+pq[1];if(R.pick[qi]===null){R.pick[qi]=oj;R.qs[qi]=R.opts[qi][oj]===R.t.q[qi].a?1:0;renderCtl();}break;
    case 'finish':finish();break;
    case 'nextQ':R.qi=(R.qi||0)+1;renderCtl();window.scrollTo(0,0);break;
    case 'garage':renderGarage();break;
    case 'pickcar':S.rcar=v;save();renderGarage();break;
    case 'race':stopListen();closeBox('#modal');raceOpen();break;
    case 'tourNext':tourOpen(TI+1);break;
    case 'tourEnd':tourEnd();break;
    case 'tourSay':say(TOUR[TI].s);break;
    case 'tourAgain':closeBox('#sheet');renderHome();show('home');tourOpen(0);break;
    case 'raceGo':S.raceIntro=1;save();closeBox('#modal');raceOpen();break;
    case 'evoOk':closeBox('#modal');if(R&&R.afterEvo){var f=R.afterEvo;R.afterEvo=null;f();}break;
    case 'col':S.col=v;save();renderSheet();if(!$('#v-home').hidden)renderHome();break;
    case 'album':renderAlbum();break;
    case 'card':var t=byId[v];openBox('#modal','<div class="card">'+cardHTML(t,true)+'<div class="cfbtns"><button class="btn ghost" data-a="closeModal">Schließen</button><button class="btn" data-a="nextread" data-v="'+t.id+'">Nochmal lesen</button></div></div>');break;
    case 'closeModal':stopListen();closeBox('#modal');break;
    case 'settings':renderSheet();break;
    case 'set':var k=b.dataset.k,val=v;if(k==='size'||k==='line'||k==='space')val=+v;else if(k==='syl'||k==='rec'||k==='nums'||k==='wh')val=(v==='true');S.set[k]=val;save();if(k==='wh'&&val)whPreload();renderSheet();readStyle();break;
    case 'sheetOk':closeBox('#sheet');break;
    case 'reset':renderReset();break;
    case 'dbgLv':S.xp=XPK*(+v-1)*(+v-1);var ds=RSTAGES[rankOf(+v)];if(ds.car)S.rcar=ds.car;save();renderSheet();renderHome();break;
    case 'dbgFuel':if(!hasCar()){S.xp=XPK*(RSTAGES[CAR0].lv-1)*(RSTAGES[CAR0].lv-1);S.rcar=RSTAGES[CAR0].car;}S.fuel=XP_RACE;save();renderSheet();renderHome();break;
    case 'delRecs':recDelAll().then(function(){var b=$('#delRecsBtn');if(b)b.textContent='Aufnahmen gelöscht';});break;
    case 'wj':wjStart();break;
    case 'wjSay':if(W)sayWord(W.list[W.k]);break;
    case 'wjClap':wjClap(+v);break;
    case 'wjRead':wjRead();break;
    case 'wjJudge':wjJudge(v==='1');break;
    case 'backup':renderBackup();break;
    case 'login':loginMsg('');break;
    case 'codeGo':codeGo($('#codeIn').value);break;
    case 'codeNew':codeNew(v,false);break;
    case 'codeKeep':codeNew(v,true);break;
    case 'logout':logout();break;
    case 'copyCode':var ta=$('#expCode');try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){b.textContent='Kopiert';},function(){ta.select();document.execCommand('copy');b.textContent='Kopiert';});}else{ta.select();document.execCommand('copy');b.textContent='Kopiert';}}catch(er){ta.select();}break;
    case 'saveFile':try{var bl=new Blob([JSON.stringify(S)],{type:'application/json'}),au=URL.createObjectURL(bl),an=document.createElement('a');an.href=au;an.download='readster-'+dkey(new Date())+'.json';document.body.appendChild(an);an.click();setTimeout(function(){URL.revokeObjectURL(au);an.remove();},2000);}catch(er){}break;
    case 'loadCode':applyBackup($('#impCode').value);break;
    case 'doReset':S=merge(null);save();closeBox('#sheet');R=null;renderHome();show('home');break;
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='codeIn'){e.preventDefault();codeGo(e.target.value);}});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='nameIn'){S.name=e.target.value.trim().slice(0,16);save();if(!$('#v-home').hidden)renderHome();}});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='impFile'&&e.target.files&&e.target.files[0]){var fr=new FileReader();fr.onload=function(){applyBackup(fr.result);};fr.readAsText(e.target.files[0]);}
});
if(window.speechSynthesis){try{window.speechSynthesis.onvoiceschanged=function(){};}catch(e){}}
whCrashCheck();
try{var MM=localStorage.getItem('readster.mode');if(MM==='solo'||MM==='partner')setMode(MM);}catch(e){} /* zuletzt gewählter Modus */
renderHome();show('home');
syncStart();
/* Link mit ?code=MOND-4821 meldet direkt mit diesem Code an */
(function(){var m=/[?&]code=([^&#]+)/i.exec(location.search);if(!m)return;var c=normCode(decodeURIComponent(m[1]));
  try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){}
  if(c&&c!==CODE)codeGo(c);})();
})();
</script>
