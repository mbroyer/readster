<title>Readster Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Lexend:wght@300;400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: eine schmale Spalte fürs Tablet. Start = Monster, Wochenziel, nächster Text, Themen. Lesen = ein Text pro Bildschirm. Stil und Farben wie Vokamon. */
:root{
  --bg:#07202b;--surface:#0f3342;--ink:#e8f8ff;--muted:#8fbccc;--line:#1d4d61;
  --accent:#2fd6d0;--accent-edge:#169a96;--accent-ink:#042321;
  --cta:#ff7a59;--cta-edge:#c4492b;--cta-ink:#2b0c03;
  --xp:#ffd04d;--xp-edge:#c79500;--xp-ink:#3d2a00;
  --good:#4fd18b;--good-bg:#12392a;--bad:#ff7c82;--bad-bg:#46202a;--warn-bg:#443a14;
  --sy-a:#8be9e3;--sy-b:#ffd9a0;
  --f-display:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
b,strong{font-weight:600}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:14px 32px}
.app{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
h2{font-family:var(--f-display);font-weight:500;font-size:1.45rem;text-wrap:balance;line-height:1.2}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
.eyebrow{font-size:.75rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.6rem;color:var(--ink)}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:500;font-size:.92rem;font-variant-numeric:tabular-nums}
.chip.lvl{background:var(--xp);border-color:var(--xp-edge);color:var(--xp-ink)}
.iconbtn{cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:50%;width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-family:var(--f-display);font-weight:500;font-size:1rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.btn{font-family:var(--f-display);font-weight:500;font-size:1.2rem;padding:14px 22px;border-radius:18px;border:0;background:var(--cta);color:var(--cta-ink);box-shadow:0 5px 0 var(--cta-edge);cursor:pointer;transition:transform .08s,box-shadow .08s;text-align:center;min-height:52px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--cta-edge)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn.wide{width:100%}
.btn.on{background:var(--warn-bg);border-color:var(--xp)}
.link{background:none;border:0;color:var(--muted);font-weight:500;cursor:pointer;padding:10px;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 180px}
.bar{height:16px;border-radius:999px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--xp);box-shadow:inset 0 -4px 0 var(--xp-edge);transition:width .5s ease}
.xptext{font-size:.9rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.mon{width:112px;height:116px;flex:none;--mi:#4ade80;--tile:var(--surface);padding:4px}
.mon .m{fill:var(--mi)}.mon .k{fill:var(--tile)}
.mon .ms{fill:none;stroke:var(--mi);stroke-linecap:round;stroke-linejoin:round}
.mon .ks{fill:none;stroke:var(--tile);stroke-linecap:round;stroke-linejoin:round}
.sw{flex:0 0 48px!important;min-width:48px;height:48px;border-radius:50%!important;padding:0!important}
.sw[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.evo{display:flex;align-items:center;justify-content:center;gap:10px}
.evo .mon{width:120px;height:134px}.evo-old{opacity:.55}.evo-ar{font-size:2rem;color:var(--xp)}
.rank{display:inline-block;background:var(--xp);color:#1b1500;border-radius:999px;padding:2px 12px;font-weight:500;font-size:.85rem}
.mon svg{width:100%;height:100%;display:block;overflow:visible}
.mon.big{width:150px;height:156px}
.hero{flex-direction:row;align-items:center;gap:16px}
.hero .info{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.stagename{font-family:var(--f-display);font-weight:600;font-size:1.7rem;line-height:1.05}
.week{gap:14px}
.alt{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.alt .row>*{flex:1 1 120px}
.selfq{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:12px;border-top:2px solid var(--line)}
.selfq .row>*{flex:1 1 0;min-width:0;padding-inline:6px}
.selfq h3{font-size:1.05rem;margin:0}
.prev{position:sticky;top:-20px;z-index:2;box-shadow:0 8px 16px rgba(0,0,0,.4)}
details.adult.set{border-top:2px solid var(--line);padding-top:12px}
details.adult.set[open]>div{display:flex;flex-direction:column;gap:16px;margin-top:12px}
.dots{display:flex;gap:8px;justify-content:space-between}
.dot{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
.dot i{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;border:3px solid var(--line);background:var(--bg);display:block}
.dot.on i{background:var(--xp);border-color:var(--xp-edge)}
.dot.today i{border-color:var(--accent)}
.dot span{font-size:.75rem;font-weight:500;color:var(--muted)}
.next{gap:10px}
.proto{align-self:center;background:var(--xp);color:#1b1500;border-radius:999px;padding:2px 12px;font-weight:500;font-size:.8rem}
.pick{display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 140px);justify-content:center}
.pick h2{text-align:center;font-size:1.7rem}
.applogo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px}
.applogo img{width:96px;height:96px;border-radius:24px;border:2px solid var(--line);display:block}
.applogo .brand{font-size:2.2rem}
.madeby.small span{font-size:9px}.madeby.small img{width:60px}
.pickwrap{min-height:calc(100vh - 46px);display:flex;flex-direction:column;justify-content:center}
.pick{min-height:0!important}
.pickwrap .foot{padding:36px 0 8px}
.mode{display:flex;align-items:center;gap:16px;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px;cursor:pointer;box-shadow:0 5px 0 var(--line);color:var(--ink);font:inherit}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.mode .ic{flex:0 0 56px;height:56px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.mode .ic svg{width:32px;height:32px}
.mode b{display:block;font-family:var(--f-display);font-size:1.45rem}
.mode span{color:var(--muted);font-weight:600;font-size:.95rem}
.mtog{display:inline-flex;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.mtog button{width:40px;height:34px;border:0;border-radius:999px;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mtog button svg{width:22px;height:22px}
.mtog button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.next .q{font-family:var(--f-display);font-weight:500;font-size:1.5rem;line-height:1.2;text-wrap:balance}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}

var TEXTS=[{"id": "tier-01", "cat": "Tiere", "title": "Warum fällt ein Gecko nicht von der Decke?", "name": "Gecko", "syl": "Ein Ge·cko läuft an der Wand und so·gar kopf·über an der De·cke. Wie geht das? Hat er et·wa Kle·ber an den Fü·ßen? Nein, sei·ne Ze·hen sind vol·ler win·zi·ger Här·chen, und zwar Mil·li·o·nen da·von. Kennst du den Trick mit dem Luft·bal·lon? Wenn du ihn an dei·nen Haa·ren reibst, bleibt er an der Wand kle·ben. So ähn·lich ist es beim Ge·cko. Sei·ne Här·chen kom·men ganz dicht an die Wand und hal·ten dort fest, ganz oh·ne Kle·ber. Ein Här·chen al·lein hält fast nichts, a·ber al·le zu·sam·men tra·gen den gan·zen Ge·cko. Wenn er los·las·sen will, rollt er die Ze·hen ein·fach ab. Die Na·tur hat noch mehr Tricks: Ein Tier kann sei·ne Far·be wech·seln und sei·ne Au·gen ein·zeln dre·hen. Wie heißt es?", "q": [{"q": "Hat der Gecko Kleber an den Füßen?", "a": "Nein, seine Zehen haben winzige Härchen.", "f": ["Ja, er hat klebrigen Schleim an den Füßen.", "Ja, seine Füße saugen sich fest."]}, {"q": "Was macht der Gecko, wenn er loslassen will?", "a": "Er rollt die Zehen ab.", "f": ["Er springt einfach ab.", "Er wartet, bis der Kleber trocknet."]}], "next": "tier-02", "card": "Millionen winziger Härchen an den Zehen halten ihn fest.", "r": "Die Natur hat noch mehr Tricks: Ein Tier kann seine Farbe wechseln und seine Augen einzeln drehen. Wie heißt es?"}, {"id": "tier-02", "cat": "Tiere", "title": "Warum wechselt das Chamäleon die Farbe?", "name": "Chamäleon", "syl": "Ein Cha·mä·le·on sitzt auf ei·nem Ast. Plötz·lich wird es grün, dann gelb und dann fast rot. Vie·le den·ken, dass es sich da·mit ver·steckt. Das stimmt a·ber nur ein biss·chen, denn meis·tens zeigt es mit der Far·be sei·ne Lau·ne. Wenn es auf·ge·regt ist, leuch·tet es gelb und rot. Wenn es ru·hig ist, bleibt es e·her grün. In sei·ner Haut ste·cken win·zi·ge Kris·tal·le, die das Licht mal so und mal so zu·rück·wer·fen. Dar·um sieht die Haut im·mer wie·der an·ders aus. Ein Tier im Meer hat acht Ar·me und blau·es Blut. Wie vie·le Her·zen hat es?", "q": [{"q": "Wozu wechselt das Chamäleon meistens die Farbe?", "a": "Um seine Laune zu zeigen.", "f": ["Um sich vor Feinden zu verstecken.", "Um Insekten anzulocken."]}, {"q": "Was steckt in der Haut des Chamäleons?", "a": "Winzige Kristalle.", "f": ["Winzige Härchen.", "Bunte Farbtropfen."]}], "next": "tier-03", "card": "Mit der Farbe zeigt es vor allem seine Laune.", "r": "Ein Tier im Meer hat acht Arme und blaues Blut. Wie viele Herzen hat es?"}, {"id": "tier-03", "cat": "Tiere", "title": "Welches Tier hat drei Herzen?", "name": "Krake", "syl": "Der Kra·ke hat drei Her·zen! Zwei da·von pum·pen das Blut zu den Kie·men, und das drit·te pumpt es durch den Kör·per. Sein Blut ist auch nicht rot, son·dern blau. Au·ßer·dem hat der Kra·ke acht Ar·me, a·ber kei·ne Kno·chen. Dar·um passt er so·gar durch ganz en·ge Spal·ten. Und er ist ziem·lich schlau: In ei·nem A·qua·ri·um hat ein Kra·ke schon ein·mal ein Glas ge·öff·net. Ein an·de·res Tier lebt im Meer, at·met a·ber Luft und springt gern aus dem Was·ser. Nachts ruht nur sein hal·bes Ge·hirn. Wer ist das?", "q": [{"q": "Wie viele Herzen hat der Krake?", "a": "Drei.", "f": ["Eins.", "Acht."]}, {"q": "Welche Farbe hat das Blut vom Kraken?", "a": "Blau.", "f": ["Rot.", "Grün."]}], "next": "tier-04", "card": "Der Krake hat drei Herzen und blaues Blut.", "r": "Ein anderes Tier lebt im Meer, atmet aber Luft und springt gern aus dem Wasser. Nachts ruht nur sein halbes Gehirn. Wer ist das?"}, {"id": "tier-04", "cat": "Tiere", "title": "Wer schläft mit halbem Gehirn?", "name": "Delfin", "syl": "Der Del·fin schläft mit hal·bem Ge·hirn! Er ist ein Säu·ge·tier und at·met Luft, so wie du. Dar·um muss er im·mer wie·der zum At·men auf·tau·chen. Wür·de er tief schla·fen, könn·te er er·trin·ken. Des·halb ruht im·mer nur ei·ne Hälf·te von sei·nem Ge·hirn, und die an·de·re bleibt wach. Meist bleibt da·bei auch ein Au·ge of·fen. Da·nach wech·seln die Hälf·ten. So ruht sich der Del·fin aus und bleibt trotz·dem si·cher. Ein an·de·res Tier schläft den gan·zen Win·ter lang. Es rollt sich im Laub zu·sam·men und hat Sta·cheln. Wer ist das?", "q": [{"q": "Warum schläft der Delfin nur mit halbem Gehirn?", "a": "Er muss zum Atmen auftauchen und könnte sonst ertrinken.", "f": ["Er hat nur ein halbes Gehirn.", "Er muss die ganze Zeit fressen."]}, {"q": "Was bleibt beim schlafenden Delfin oft offen?", "a": "Ein Auge.", "f": ["Das Maul.", "Beide Ohren."]}], "next": "tier-05", "card": "Er schläft mit nur einer Hälfte vom Gehirn.", "r": "Ein anderes Tier schläft den ganzen Winter lang. Es rollt sich im Laub zusammen und hat Stacheln. Wer ist das?"}, {"id": "tier-05", "cat": "Tiere", "title": "Wie schläft ein Igel im Winter?", "name": "Igel", "syl": "Im Win·ter gibt es kaum Fut·ter, dar·um macht der I·gel Win·ter·schlaf. Er rollt sich in ei·nem Laub·hau·fen ein, und sein Kör·per wird kalt. Sein Herz schlägt dann nur noch et·wa fünf Mal pro Mi·nu·te, sonst sind es rund 200 Schlä·ge! So spart er Kraft, bis der Früh·ling kommt. Wenn er zu früh auf·wacht, ver·braucht er viel E·ner·gie. Dar·um soll man schla·fen·de I·gel nicht stö·ren. Und jetzt das Ge·gen·teil: Ein Tier mit Fle·cken und lan·gen Bei·nen ist an Land am schnells·ten. Wie heißt es?", "q": [{"q": "Warum macht der Igel Winterschlaf?", "a": "Im Winter gibt es kaum Futter.", "f": ["Im Winter ist es ihm zu hell.", "Er muss im Winter wachsen."]}, {"q": "Warum soll man schlafende Igel nicht stören?", "a": "Wacht er zu früh auf, verbraucht er viel Energie.", "f": ["Er wird sonst wütend und beißt.", "Er schläft dann nie wieder ein."]}], "next": "tier-06", "card": "Im Winterschlaf schlägt sein Herz nur noch etwa fünf Mal pro Minute.", "r": "Und jetzt das Gegenteil: Ein Tier mit Flecken und langen Beinen ist an Land am schnellsten. Wie heißt es?"}, {"id": "tier-06", "cat": "Tiere", "title": "Welches Landtier ist am schnellsten?", "name": "Gepard", "syl": "Der Ge·pard ist das schnells·te Land·tier. Er rennt et·wa 100 Ki·lo·me·ter pro Stun·de, so schnell wie ein Au·to auf der Land·stra·ße. Das schafft er a·ber nur kurz, denn nach we·ni·gen hun·dert Me·tern ist er er·schöpft. Dann muss er sich erst ein·mal aus·ru·hen. Trotz·dem ist er an Land un·schlag·bar. Sei·ne Bei·ne sind lang und sein Kör·per ist schlank. Mit dem Schwanz hält er beim Ren·nen das Gleich·ge·wicht. Nur ein Tier ist noch viel schnel·ler. Es fliegt, hat schar·fe Au·gen und fällt im Sturz·flug wie ein Pfeil. Wie heißt es?", "q": [{"q": "Wie schnell rennt der Gepard?", "a": "Etwa 100 Kilometer pro Stunde.", "f": ["Etwa 30 Kilometer pro Stunde.", "Etwa 300 Kilometer pro Stunde."]}, {"q": "Wie lange kann der Gepard so schnell rennen?", "a": "Nur kurz, nach wenigen hundert Metern ist er erschöpft.", "f": ["Mehrere Stunden am Stück.", "Einen ganzen Tag lang."]}], "next": "tier-07", "card": "Etwa 100 km/h schnell, aber nur ganz kurz.", "r": "Nur ein Tier ist noch viel schneller. Es fliegt, hat scharfe Augen und fällt im Sturzflug wie ein Pfeil. Wie heißt es?"}, {"id": "tier-07", "cat": "Tiere", "title": "Wer ist das schnellste Tier der Welt?", "name": "Wanderfalke", "syl": "Der Wan·der·fal·ke ist das schnells·te Tier der Welt. Er jagt an·de·re Vö·gel in der Luft und sieht sei·ne Beu·te schon von weit weg. Dann legt er die Flü·gel an und stürzt wie ein Pfeil nach un·ten. Im Sturz·flug schafft er mehr als 300 Ki·lo·me·ter pro Stun·de, der Ge·pard da·ge·gen nur et·wa 100. So trifft der Fal·ke sei·ne Beu·te mit·ten im Flug. Das größ·te Tier der Welt lebt a·ber im Meer. Es ist län·ger als zwei Bus·se und frisst win·zi·ge Kreb·se. Wie heißt es?", "q": [{"q": "Wie jagt der Wanderfalke?", "a": "Er stürzt mit angelegten Flügeln nach unten.", "f": ["Er läuft schnell am Boden hinterher.", "Er wartet still im Wasser."]}, {"q": "Wie schnell ist er im Sturzflug?", "a": "Mehr als 300 Kilometer pro Stunde.", "f": ["Etwa 50 Kilometer pro Stunde.", "Genau 100 Kilometer pro Stunde."]}], "next": "tier-08", "card": "Im Sturzflug schneller als 300 km/h.", "r": "Das größte Tier der Welt lebt aber im Meer. Es ist länger als zwei Busse und frisst winzige Krebse. Wie heißt es?"}, {"id": "tier-08", "cat": "Tiere", "title": "Welches Tier ist das größte der Welt?", "name": "Blauwal", "syl": "Der Blau·wal ist das größ·te Tier der Welt. Er wird bis zu 30 Me·ter lang, das sind mehr als zwei Bus·se hin·ter·ein·an·der. Trotz·dem frisst er nur win·zi·ge Kreb·se, die Krill hei·ßen. Da·von ver·schlingt er je·den Tag meh·re·re Ton·nen. Da·zu nimmt er einen rie·si·gen Schluck Was·ser und presst ihn durch sei·ne Bar·ten wie·der hi·naus. Bar·ten sind wie ein Sieb, in dem der Krill hän·gen bleibt. Der Blau·wal ist rie·sig, doch im Welt·all gibt es et·was viel Grö·ße·res. Es leuch·tet hell und ist heiß, und du siehst es je·den Tag. Was ist das?", "q": [{"q": "Wovon ernährt sich der Blauwal?", "a": "Von winzigen Krebsen, dem Krill.", "f": ["Von großen Fischen und Robben.", "Von Algen und Seegras."]}, {"q": "Was sind Barten?", "a": "Eine Art Sieb im Maul, in dem der Krill hängen bleibt.", "f": ["Seine Zähne zum Kauen.", "Die Flossen am Bauch."]}], "next": "weltall-01", "card": "Bis zu 30 Meter lang und er frisst winzigen Krill.", "r": "Der Blauwal ist riesig, doch im Weltall gibt es etwas viel Größeres. Es leuchtet hell und ist heiß, und du siehst es jeden Tag. Was ist das?"}, {"id": "weltall-01", "cat": "Weltall", "title": "Wie groß ist die Sonne?", "name": "Sonne", "syl": "Die Son·ne ist ei·ne rie·si·ge Ku·gel aus glü·hend hei·ßem Gas. Sie ist so groß, dass über ei·ne Mil·li·on Er·den hi·nein·pas·sen. Sie ist et·wa 150 Mil·li·o·nen Ki·lo·me·ter von uns ent·fernt. Ihr Licht braucht gut acht Mi·nu·ten bis zu uns. In ih·rer Mit·te ist es mehr als 15 Mil·li·o·nen Grad heiß. Oh·ne die Son·ne gä·be es kein Le·ben auf der Er·de. Die Son·ne ist ein Stern, und nachts siehst du vie·le an·de·re Ster·ne. Das hells·te Licht am Nacht·him·mel ist a·ber gar kein Stern. Wie heißt es?", "q": [{"q": "Wie viele Erden passen in die Sonne?", "a": "Über eine Million.", "f": ["Ungefähr zehn.", "Genau tausend."]}, {"q": "Wie lange braucht das Sonnenlicht bis zu uns?", "a": "Gut acht Minuten.", "f": ["Ein ganzes Jahr.", "Eine Sekunde."]}], "next": "weltall-02", "card": "Über eine Million Erden passen hinein.", "r": "Die Sonne ist ein Stern, und nachts siehst du viele andere Sterne. Das hellste Licht am Nachthimmel ist aber gar kein Stern. Wie heißt es?"}, {"id": "weltall-02", "cat": "Weltall", "title": "Wie weit ist der Mond entfernt?", "name": "Mond", "syl": "Der Mond ist et·wa 384.000 Ki·lo·me·ter von der Er·de ent·fernt. Mit dem Au·to auf der Land·stra·ße bräuch·test du un·ge·fähr 160 Ta·ge bis dort·hin, und zwar oh·ne Pau·se! Der Mond leuch·tet nicht selbst, son·dern wirft nur das Licht der Son·ne zu·rück. Dort gibt es kei·ne Luft zum At·men, dar·um braucht man einen Raum·an·zug. Zwölf Men·schen sind bis·her auf dem Mond ge·lau·fen. Ih·re Fuß·spu·ren sind im·mer noch da, denn dort weht kein Wind, der sie ver·wi·schen könn·te. Und jetzt zu ei·nem Pla·ne·ten mit be·rühm·ten Rin·gen, der kei·nen fes·ten Bo·den hat. Wie heißt er?", "q": [{"q": "Leuchtet der Mond selbst?", "a": "Nein, er wirft nur das Licht der Sonne zurück.", "f": ["Ja, er hat ein eigenes Feuer.", "Ja, nur in der Nacht."]}, {"q": "Warum sind die Fußspuren noch da?", "a": "Dort weht kein Wind.", "f": ["Die Astronauten haben sie nachgemalt.", "Der Boden ist dort aus Beton."]}], "next": "weltall-03", "card": "Die Fußspuren der ersten Menschen sind noch da.", "r": "Und jetzt zu einem Planeten mit berühmten Ringen, der keinen festen Boden hat. Wie heißt er?"}, {"id": "weltall-03", "cat": "Weltall", "title": "Welcher Planet hat Ringe?", "name": "Saturn", "syl": "Sa·turn ist der Pla·net mit den be·rühm·ten Rin·gen. Sie se·hen aus wie ei·ne rie·si·ge Schei·be, a·ber in Wahr·heit be·ste·hen sie aus Mil·li·ar·den Eis·bro·cken. Man·che sind klein wie Sand, an·de·re sind groß wie ein Haus. Sa·turn ist ein Gas·pla·net und hat kei·nen fes·ten Bo·den zum Lan·den. Er ist so·gar leich·ter als Was·ser. Wenn es ein rie·si·ges Be·cken gä·be, wür·de er dar·in schwim·men. A·ber wie kommt man über·haupt ins Welt·all? Da·zu braucht man ein Fahr·zeug, das Feu·er speit und mit lau·tem Don·ner star·tet. Wie heißt es?", "q": [{"q": "Woraus bestehen die Ringe vom Saturn?", "a": "Aus Milliarden Eisbrocken.", "f": ["Aus Sand und Steinen.", "Aus heißem Gas."]}, {"q": "Kann man auf Saturn landen?", "a": "Nein, er hat keinen festen Boden.", "f": ["Ja, auf seinen Ringen.", "Ja, der Boden ist aus Eis."]}], "next": "technik-01", "card": "Seine Ringe bestehen aus Milliarden Eisbrocken.", "r": "Aber wie kommt man überhaupt ins Weltall? Dazu braucht man ein Fahrzeug, das Feuer speit und mit lautem Donner startet. Wie heißt es?"}, {"id": "technik-01", "cat": "Technik", "title": "Wie kommt man ins Weltall?", "name": "Rakete", "syl": "Ei·ne Ra·ke·te muss sehr schnell sein, um im Welt·all zu blei·ben, näm·lich et·wa 28.000 Ki·lo·me·ter pro Stun·de! Da·für ver·brennt sie rie·si·ge Men·gen Treib·stoff. Die hei·ßen Ga·se schie·ßen nach un·ten aus der Dü·se, und da·durch wird die Ra·ke·te nach o·ben ge·drückt. Das nennt man Rück·stoß. Du kennst ihn von ei·nem Luft·bal·lon, denn wenn du ihn los·lässt, flitzt er da·von. Ei·ne Ra·ke·te funk·tio·niert ge·nau·so, nur viel grö·ßer. Und wer hat das Flug·zeug er·fun·den? Es wa·ren zwei Brü·der aus A·me·ri·ka, die vor·her Fahr·rä·der bau·ten. Wie hie·ßen sie?", "q": [{"q": "Wie nennt man den Schub, der die Rakete nach oben drückt?", "a": "Rückstoß.", "f": ["Anziehung.", "Gegenwind."]}, {"q": "Mit welchem Spielzeug kann man das vergleichen?", "a": "Mit einem Luftballon, den man loslässt.", "f": ["Mit einem Kreisel, der sich dreht.", "Mit einem Ball, der hüpft."]}], "next": "technik-02", "card": "Eine Rakete fliegt mit Rückstoß, wie ein Luftballon.", "r": "Und wer hat das Flugzeug erfunden? Es waren zwei Brüder aus Amerika, die vorher Fahrräder bauten. Wie hießen sie?"}, {"id": "technik-02", "cat": "Technik", "title": "Wer hat das Flugzeug erfunden?", "name": "Flugzeug", "syl": "Den ers·ten Flug mit Mo·tor schaff·ten die Brü·der Wil·bur und Or·ville Wright. Das war im Jahr 1903 in A·me·ri·ka. Ihr ers·ter Flug dau·er·te nur zwölf Se·kun·den und war et·wa 37 Me·ter weit. Das ist kür·zer, als ein Jum·bo-Jet lang ist! Vor·her bau·ten die Brü·der Fahr·rä·der und tüf·tel·ten meh·re·re Jah·re lang. Sie bau·ten so·gar einen ei·ge·nen Wind·ka·nal, um ih·re Flü·gel zu tes·ten. Heu·te flie·gen Flug·zeu·ge vie·le Stun·den oh·ne Pau·se. A·ber wie fin·den Pi·lo·ten und See·leu·te ih·ren Weg? Sie nut·zen ein Ge·rät mit ei·ner Na·del. Wie heißt es?", "q": [{"q": "Wie lange dauerte der erste Flug?", "a": "Zwölf Sekunden.", "f": ["Zwölf Minuten.", "Zwei Stunden."]}, {"q": "Was bauten die Brüder, um Flügel zu testen?", "a": "Einen Windkanal.", "f": ["Ein Schwimmbad.", "Einen Turm."]}], "next": "technik-03", "card": "Der erste Flug dauerte nur zwölf Sekunden.", "r": "Aber wie finden Piloten und Seeleute ihren Weg? Sie nutzen ein Gerät mit einer Nadel. Wie heißt es?"}, {"id": "technik-03", "cat": "Technik", "title": "Wie funktioniert ein Kompass?", "name": "Kompass", "syl": "Ei·ne Kom·pass·na·del zeigt im·mer nach Nor·den. A·ber wie macht sie das? Die Na·del ist ein klei·ner Ma·gnet, und die Er·de ist selbst wie ein rie·si·ger Ma·gnet. In ih·rem In·ne·ren fließt näm·lich flüs·si·ges Me·tall, und da·durch ent·steht ein Ma·gnet·feld. Da·nach rich·tet sich die Na·del aus. Schon vor lan·ger Zeit nutz·ten See·leu·te so et·was, da·mit sie auch bei Ne·bel ih·ren Weg fan·den. Auch man·che Zug·vö·gel kön·nen das Ma·gnet·feld spü·ren. Und jetzt zu dir: In dei·ner Brust ar·bei·tet Tag und Nacht ein Mus·kel, den du nicht an·hal·ten kannst. Wie heißt er?", "q": [{"q": "Wohin zeigt die Kompassnadel?", "a": "Nach Norden.", "f": ["Nach Süden.", "Immer zur Sonne."]}, {"q": "Wie ist die Erde in diesem Text beschrieben?", "a": "Wie ein riesiger Magnet.", "f": ["Wie ein riesiger Ball aus Eis.", "Wie ein großes Uhrwerk."]}], "next": "koerper-01", "card": "Die Erde ist wie ein riesiger Magnet.", "r": "Und jetzt zu dir: In deiner Brust arbeitet Tag und Nacht ein Muskel, den du nicht anhalten kannst. Wie heißt er?"}, {"id": "koerper-01", "cat": "Körper", "title": "Was macht dein Herz den ganzen Tag?", "name": "Herz", "syl": "Dein Herz ist un·ge·fähr so groß wie dei·ne Faust, und es schlägt oh·ne Pau·se, Tag und Nacht. Wenn du ruhst, sind es et·wa 80 Schlä·ge pro Mi·nu·te. Das sind mehr als 100.000 Schlä·ge an je·dem Tag! Da·bei pumpt das Herz das Blut durch dei·nen gan·zen Kör·per. Wenn du rennst, schlägt es schnel·ler. Du kannst es spü·ren, wenn du die Hand auf die Brust o·der an den Hals legst. Ver·such es mal! Bei Käl·te o·der Angst ste·hen dir manch·mal plötz·lich die Haa·re zu Ber·ge. Wie nennt man das?", "q": [{"q": "Wie groß ist dein Herz ungefähr?", "a": "So groß wie deine Faust.", "f": ["So groß wie dein Kopf.", "So groß wie eine Erbse."]}, {"q": "Was passiert mit dem Herzschlag, wenn du rennst?", "a": "Er wird schneller.", "f": ["Er wird langsamer.", "Er hört kurz auf."]}], "next": "koerper-02", "card": "Dein Herz schlägt über 100.000 Mal am Tag.", "r": "Bei Kälte oder Angst stehen dir manchmal plötzlich die Haare zu Berge. Wie nennt man das?"}, {"id": "koerper-02", "cat": "Körper", "title": "Warum bekommst du Gänsehaut?", "name": "Gänsehaut", "syl": "Wenn dir kalt ist, be·kommst du Gän·se·haut. Das kann auch bei Angst o·der bei ei·nem schö·nen Lied pas·sie·ren. Fast je·des Haar auf dei·ner Haut hat einen win·zi·gen Mus·kel. Der zieht sich zu·sam·men und stellt das Haar auf, und so ent·ste·hen die klei·nen Hü·gel. Frü·her hat·ten Men·schen viel mehr Kör·per·haa·re. Auf·ge·stell·te Haa·re hiel·ten sie warm o·der lie·ßen sie grö·ßer wir·ken. Heu·te hilft uns das kaum noch, a·ber der Kör·per macht es trotz·dem. Et·was in dir ist hart, hält dich auf·recht und schützt dein Ge·hirn. Was ist das?", "q": [{"q": "Wann bekommst du Gänsehaut?", "a": "Zum Beispiel bei Kälte, Angst oder einem schönen Lied.", "f": ["Nur, wenn du krank bist.", "Nur beim Schlafen."]}, {"q": "Was stellt die Haare auf?", "a": "Ein winziger Muskel am Haar.", "f": ["Der Wind von draußen.", "Ein Knochen unter der Haut."]}], "next": "koerper-03", "card": "Winzige Muskeln stellen die Haare auf.", "r": "Etwas in dir ist hart, hält dich aufrecht und schützt dein Gehirn. Was ist das?"}, {"id": "koerper-03", "cat": "Körper", "title": "Wie viele Knochen hat ein Mensch?", "name": "Knochen", "syl": "Ein Er·wach·se·ner hat 206 Kno·chen. Als Ba·by hat·test du so·gar noch mehr, näm·lich et·wa 300. Vie·le da·von wach·sen mit der Zeit zu·sam·men. Die meis·ten Kno·chen ste·cken in dei·nen Hän·den und Fü·ßen. Der kleins·te Kno·chen sitzt im Ohr und ist nur so groß wie ein Reis·korn. Der größ·te ist der O·ber·schen·kel·kno·chen. Kno·chen sind ü·bri·gens le·ben·dig, denn sie wach·sen und hei·len, wenn sie bre·chen. Das dau·ert oft ei·ni·ge Wo·chen. A·ber wie schnell kann ein Mensch ren·nen? Ein Mann aus Ja·mai·ka ist schnel·ler ge·lau·fen als je·der an·de·re. Wie heißt er?", "q": [{"q": "Wie viele Knochen hat ein Erwachsener?", "a": "206.", "f": ["Genau 100.", "Über 1000."]}, {"q": "Wo sitzt der kleinste Knochen?", "a": "Im Ohr.", "f": ["Im kleinen Zeh.", "In der Nase."]}], "next": "sport-01", "card": "206 Knochen, der kleinste sitzt im Ohr.", "r": "Aber wie schnell kann ein Mensch rennen? Ein Mann aus Jamaika ist schneller gelaufen als jeder andere. Wie heißt er?"}, {"id": "sport-01", "cat": "Sport", "title": "Wer ist der schnellste Mensch der Welt?", "name": "Schnellster Mensch", "syl": "U·sain Bolt aus Ja·mai·ka ist der schnells·te Mensch der Welt. Im Jahr 2009 lief er in Ber·lin 100 Me·ter in 9,58 Se·kun·den. Das ist bis heu·te Welt·re·kord. Sei·ne Schrit·te sind sehr lang, des·halb brauch·te er für die gan·ze Stre·cke nur et·wa 41 Schrit·te. Da·bei war er kurz mit mehr als 40 Ki·lo·me·tern pro Stun·de un·ter·wegs. Das ist fast so schnell wie ein Au·to in der Stadt. Und jetzt zu ei·nem Sport mit Ball und Korb. Der Korb hängt weit über dei·nem Kopf, a·ber wie hoch ge·nau?", "q": [{"q": "Aus welchem Land kommt Usain Bolt?", "a": "Aus Jamaika.", "f": ["Aus Amerika.", "Aus Kenia."]}, {"q": "Wie viele Meter lief er in 9,58 Sekunden?", "a": "100 Meter.", "f": ["400 Meter.", "1000 Meter."]}], "next": "sport-02", "card": "100 Meter in 9,58 Sekunden.", "r": "Und jetzt zu einem Sport mit Ball und Korb. Der Korb hängt weit über deinem Kopf, aber wie hoch genau?"}, {"id": "sport-02", "cat": "Sport", "title": "Wie hoch hängt ein Basketballkorb?", "name": "Basketballkorb", "syl": "Ein Bas·ket·ball·korb hängt 3,05 Me·ter hoch, bei den Pro·fis und bei al·len Gro·ßen. Der Ring ist 45 Zen·ti·me·ter breit und der Ball et·wa 24 Zen·ti·me·ter groß. Der Ball passt al·so mit et·was Platz hin·durch, a·ber man braucht viel Ge·fühl beim Wer·fen. Man·che Spie·ler sprin·gen so hoch, dass sie den Ball von o·ben in den Korb stop·fen. Das nennt man Dun·king. Und jetzt zu ei·nem Spiel mit gel·bem Ball und Schlä·ger, das ein·mal drei Ta·ge dau·er·te! Wie lan·ge spiel·ten die bei·den ins·ge·samt?", "q": [{"q": "Wie hoch hängt der Korb?", "a": "3,05 Meter.", "f": ["2 Meter.", "5 Meter."]}, {"q": "Wie nennt man es, wenn man den Ball mit der Hand in den Korb stopft?", "a": "Dunking.", "f": ["Freiwurf.", "Rebound."]}], "next": "sport-03", "card": "Der Korb hängt 3,05 Meter hoch.", "r": "Und jetzt zu einem Spiel mit gelbem Ball und Schläger, das einmal drei Tage dauerte! Wie lange spielten die beiden insgesamt?"}, {"id": "sport-03", "cat": "Sport", "title": "Welches Tennisspiel dauerte drei Tage?", "name": "Längstes Match", "syl": "Im Jahr 2010 spiel·ten John Is·ner und Ni·co·las Ma·hut in Wim·ble·don ge·gen·ein·an·der. Das Spiel dau·er·te mehr als elf Stun·den und zog sich über drei Ta·ge. Der letz·te Satz ging 70 zu 68, da·bei en·det ein Satz nor·ma·ler·wei·se bei 6 o·der 7. So·gar die An·zei·ge·ta·fel gab ir·gend·wann auf. Am En·de wa·ren bei·de völ·lig er·schöpft. Es ist das längs·te Ten·nis·spiel al·ler Zei·ten. Und jetzt zu ei·nem ech·ten Rät·sel: Im Meer zwi·schen Flo·ri·da und Ber·mu·da sol·len Schif·fe und Flug·zeu·ge ein·fach ver·schwin·den. Wie heißt die·ser Ort?", "q": [{"q": "Wie lange dauerte das Spiel?", "a": "Mehr als elf Stunden, über drei Tage.", "f": ["Genau 90 Minuten.", "Eine Stunde."]}, {"q": "Wo fand das Spiel statt?", "a": "In Wimbledon.", "f": ["In Paris.", "In New York."]}], "next": "raetsel-01", "card": "Über elf Stunden, verteilt auf drei Tage.", "r": "Und jetzt zu einem echten Rätsel: Im Meer zwischen Florida und Bermuda sollen Schiffe und Flugzeuge einfach verschwinden. Wie heißt dieser Ort?"}, {"id": "raetsel-01", "cat": "Rätsel", "title": "Was ist das Bermuda-Dreieck?", "name": "Bermuda-Dreieck", "syl": "Das Ber·mu·da-Drei·eck ist ein Ge·biet im At·lan·tik, zwi·schen Flo·ri·da, Ber·mu·da und Puer·to Ri·co. Dort sol·len Schif·fe und Flug·zeu·ge ein·fach ver·schwin·den, das er·zählt man sich schon seit vie·len Jahr·zehn·ten. Doch For·scher ha·ben nach·ge·zählt. Dort ver·schwin·den nicht mehr Schif·fe als in an·de·ren Mee·ren, in de·nen viel los ist. Oft sind Stür·me schuld, und man·che Ge·schich·ten wur·den auch aus·ge·schmückt. Ein ech·tes Rät·sel ist es al·so nicht. A·ber in Schott·land soll in ei·nem See ein Mons·ter mit ei·nem lan·gen Hals le·ben. Wie heißt es?", "q": [{"q": "Wo liegt das Bermuda-Dreieck?", "a": "Im Atlantik.", "f": ["Im Pazifik.", "In der Nordsee."]}, {"q": "Was sagen Forscher zu den verschwundenen Schiffen?", "a": "Dort verschwinden nicht mehr als anderswo.", "f": ["Dort wohnt ein Seeungeheuer.", "Ein Magnet zieht sie nach unten."]}], "next": "raetsel-02", "card": "Dort verschwinden nicht mehr Schiffe als anderswo.", "r": "Aber in Schottland soll in einem See ein Monster mit einem langen Hals leben. Wie heißt es?"}, {"id": "raetsel-02", "cat": "Rätsel", "title": "Gibt es Nessie wirklich?", "name": "Nessie", "syl": "Im Loch Ness in Schott·land soll ein Mons·ter le·ben, das man Nes·sie nennt. Im Jahr 1933 gab es vie·le Be·rich·te, denn Men·schen woll·ten einen lan·gen Hals im Was·ser ge·se·hen ha·ben. Spä·ter such·ten vie·le Leu·te mit Boo·ten, Schall·wel·len und Ka·me·ras, a·ber ge·fun·den ha·ben sie nichts. Im Jahr 2018 un·ter·such·ten For·scher so·gar Was·ser·pro·ben auf Erb·gut. Ein Mons·ter fan·den sie nicht, a·ber sehr viel Erb·gut von Aa·len. Viel·leicht ha·ben die Men·schen al·so gro·ße Aa·le ge·se·hen. In Ägyp·ten ste·hen rie·si·ge Stein·bau·ten mit ei·ner Spit·ze. Da·mals gab es a·ber noch kei·ne Krä·ne. Wie wur·den sie ge·baut?", "q": [{"q": "In welchem See soll Nessie leben?", "a": "Im Loch Ness in Schottland.", "f": ["Im Bodensee in Deutschland.", "Im Meer bei Norwegen."]}, {"q": "Was fanden die Forscher in den Wasserproben?", "a": "Viel Erbgut von Aalen, aber kein Monster.", "f": ["Knochen von einem Saurier.", "Ein großes Nest."]}], "next": "raetsel-03", "card": "Im See fand man Erbgut von Aalen, aber kein Monster.", "r": "In Ägypten stehen riesige Steinbauten mit einer Spitze. Damals gab es aber noch keine Kräne. Wie wurden sie gebaut?"}, {"id": "raetsel-03", "cat": "Rätsel", "title": "Wie wurden die Pyramiden gebaut?", "name": "Pyramiden", "syl": "Die gro·ße Py·ra·mi·de von Gi·zeh in Ägyp·ten ist rund 4500 Jah·re alt. Sie be·steht aus mehr als zwei Mil·li·o·nen Stein·blö·cken, und man·che da·von wie·gen meh·re·re Ton·nen. Wie ha·ben die Men·schen das oh·ne Krä·ne ge·schafft? Sie nutz·ten Ram·pen, Schlit·ten und vie·le Ar·bei·ter. Man hat so·gar die Stadt der Ar·bei·ter ge·fun·den, mit Bä·cke·rei·en und Un·ter·künf·ten. Nach heu·ti·gem Wis·sen wa·ren es kei·ne Skla·ven. Ganz si·cher weiß man a·ber trotz·dem nicht al·les. Von ei·ner In·sel er·zählt man, sie sei im Meer ver·sun·ken, a·ber viel·leicht gab es sie nie. Wie heißt sie?", "q": [{"q": "Wie alt ist die große Pyramide ungefähr?", "a": "Rund 4500 Jahre.", "f": ["Rund 100 Jahre.", "Eine Million Jahre."]}, {"q": "Was nutzten die Menschen statt Kränen?", "a": "Rampen, Schlitten und viele Arbeiter.", "f": ["Riesige Maschinen.", "Elefanten aus Afrika."]}], "next": "raetsel-04", "card": "Mehr als zwei Millionen Steinblöcke.", "r": "Von einer Insel erzählt man, sie sei im Meer versunken, aber vielleicht gab es sie nie. Wie heißt sie?"}, {"id": "raetsel-04", "cat": "Rätsel", "title": "Was war Atlantis?", "name": "Atlantis", "syl": "At·lan·tis soll ei·ne In·sel ge·we·sen sein, die im Meer ver·sun·ken ist. Da·von er·zähl·te der Den·ker Pla·ton vor mehr als 2300 Jah·ren. Er be·schrieb ei·ne mäch·ti·ge Stadt mit Hä·fen und Tem·peln. Dann sei sie an ei·nem Tag und in ei·ner Nacht un·ter·ge·gan·gen. Ge·fun·den hat man sie nie. Die meis·ten For·scher glau·ben, dass Pla·ton die Ge·schich·te er·fun·den hat, um da·mit et·was zu er·klä·ren. Viel·leicht er·zählst du die Ge·schich·te ja ein·mal selbst wei·ter. Und jetzt zu·rück zu den Tie·ren: Ein klei·nes Tier läuft kopf·über an der De·cke und fällt nicht her·un·ter. Wie macht es das?", "q": [{"q": "Wer hat die Geschichte von Atlantis erzählt?", "a": "Der Denker Platon.", "f": ["Ein Seemann aus Spanien.", "Ein Forscher von heute."]}, {"q": "Was glauben die meisten Forscher über Atlantis?", "a": "Dass die Geschichte erfunden ist.", "f": ["Dass Atlantis unter dem Eis liegt.", "Dass man es bald findet."]}], "next": "tier-01", "card": "Platon erzählte von der versunkenen Insel.", "r": "Vielleicht erzählst du die Geschichte ja einmal selbst weiter. Und jetzt zurück zu den Tieren: Ein kleines Tier läuft kopfüber an der Decke und fällt nicht herunter. Wie macht es das?"}];

function pauseAnalyze(x,sr){
  /* Stockstellen: Pausen, die deutlich länger sind als die eigenen Pausen zwischen Wörtern */

  var gaps=[],run=0,sp=0,gs=-1;

    else{if(gs<0){gs=i;run=0;}run+=1+(sp>0&&sp<3?sp:0);sp=0;}
  }

  gaps.forEach(function(g){total-=Math.round(g.len/F);});
  gaps.forEach(function(g){g.before=(g.s-first)-lost;lost+=Math.round(g.len/F);});

function suggestWords(t,res){

  var n=t.rs,cum=[],c=0,i,g,w;

  var sc=c/n,G=res.gaps,W=n-1;if(W<1)return [];

    out.push(x.idx);

}

}
function renderReset(){
  openBox('#sheet','<div class="card"><h2>Fortschritt löschen?</h2><p class="hint">Alle Karten, XP und markierten Wörter auf diesem Gerät werden gelöscht.</p><div class="cfbtns"><button class="btn ghost" data-a="sheetOk">Abbrechen</button><button class="btn" data-a="doReset">Löschen</button></div></div>');
}
/* Klicks */
document.addEventListener('click',function(e){
  var w=e.target.closest('.w');
  if(w&&R&&R.phase==='mark'&&$('#rtext').contains(w)){var i=w.dataset.i;R.marks[i]=!R.marks[i];w.classList.toggle('st',!!R.marks[i]);if(R.marks[i])R.all[i]=true;else{R.all[i]=false;delete R.all[i];}return;}
  if(w&&R&&R.phase==='opa'&&$('#rtext').contains(w)){var oi=w.dataset.i;if(R.all[oi]){delete R.all[oi];w.classList.remove('st');}else{R.all[oi]=true;w.classList.add('st');}return;}
  if(w&&R&&$('#rr')&&$('#rr').contains(w)){listen(+w.dataset.i);return;}
  if(w&&R&&R.phase==='read'&&$('#rtext').contains(w)){listen(+w.dataset.i);return;}
  var pt=e.target.closest&&e.target.closest('[data-pt]');
  if(pt&&$('#v-stats').contains(pt)){var pi=+pt.dataset.pt,pp=S.log.filter(function(x){return x.wpm;}).slice(-30)[pi],cr=$('#chartread');
    if(cr&&pp)cr.textContent=fmtDate(pp.ts)+' · '+(byId[pp.id]?byId[pp.id].title:'')+' · '+pp.wpm+' Wörter pro Minute';
    var ds=document.querySelectorAll('#v-stats .dt');for(var di=0;di<ds.length;di++)ds[di].classList.toggle('sel',di===pi);return;}
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'home':case 'home2':stopListen();closeBox('#modal');renderHome();show('home');break;
    case 'cat':renderCat(v);break;
    case 'open':openText(v);break;
    case 'nextread':stopListen();closeBox('#modal');openText(v);break;
    case 'leave':recStop(false);stopListen();renderHome();show('home');break;
    case 'listen':listen(undefined,'a');break;
    case 'listenR':listen(undefined,'b');break;
    case 'start':startRound();break;
    case 'self':if(R&&R.entry){R.entry.self=+v;save();var sb2=document.querySelectorAll('.selfrow .btn');for(var si=0;si<sb2.length;si++){var on=(+sb2[si].dataset.v===+v);sb2[si].classList.toggle('on',on);sb2[si].classList.toggle('ghost',!on);}}break;
    case 'takeSug':(R.sug||[]).forEach(function(k){R.marks[k]=true;R.all[k]=true;var ww=$('#rtext .w[data-i="'+k+'"]');if(ww)ww.classList.add('st');});break;
    case 'stats':renderStats();show('stats');break;
    case 'opa':opaStart('opa');break;
    case 'solo':opaStart('solo');break;
    case 'soloHear':soloHear();break;
    case 'opaKid':opaStep('kid');break;
    case 'opaNext':opaStep('next');break;
    case 'opaBack':opaStep('back');break;
    case 'stop':stopRound();break;
    case 'shareRec':shareRec();break;
    case 'whNoteOk':S.whNote='';save();renderHome();break;
    case 'cancel':recStop(false);if(MODE==='partner'&&R.phase==='opa'){stopListen();renderHome();show('home');break;}R.phase='read';renderCtl();break;
    case 'mode':MODE=v||null;renderHome();show('home');break;
    case 'again':R.phase='read';renderCtl();window.scrollTo(0,0);break;
    case 'check':R.phase='check';renderCtl();try{$('#qcard').scrollIntoView({block:'start',behavior:'smooth'});}catch(er){}break;
    case 'pick':var pq=v.split('-'),qi=+pq[0],oj=+pq[1];if(R.pick[qi]===null){R.pick[qi]=oj;R.qs[qi]=R.opts[qi][oj]===R.t.q[qi].a?1:0;renderCtl();}break;
    case 'finish':finish();break;
    case 'evoOk':closeBox('#modal');if(R&&R.afterEvo){var f=R.afterEvo;R.afterEvo=null;f();}break;
    case 'col':S.col=v;save();renderSheet();if(!$('#v-home').hidden)renderHome();break;
    case 'album':renderAlbum();break;
    case 'card':var t=byId[v];openBox('#modal','<div class="card">'+cardHTML(t,true)+'<div class="cfbtns"><button class="btn ghost" data-a="closeModal">Schließen</button><button class="btn" data-a="nextread" data-v="'+t.id+'">Nochmal lesen</button></div></div>');break;
    case 'closeModal':stopListen();closeBox('#modal');break;
    case 'settings':renderSheet();break;
    case 'set':var k=b.dataset.k,val=v;if(k==='size'||k==='line'||k==='space')val=+v;else if(k==='syl'||k==='rec'||k==='nums'||k==='wh')val=(v==='true');S.set[k]=val;save();if(k==='wh'&&val)whPreload();renderSheet();readStyle();break;
    case 'sheetOk':closeBox('#sheet');break;
    case 'reset':renderReset();break;
    case 'delRecs':recDelAll().then(function(){var b=$('#delRecsBtn');if(b)b.textContent='Aufnahmen gelöscht';});break;
    case 'wj':wjStart();break;
    case 'wjSay':if(W)sayWord(W.list[W.k]);break;
    case 'wjClap':wjClap(+v);break;
    case 'wjRead':wjRead();break;
    case 'wjJudge':wjJudge(v==='1');break;
    case 'backup':renderBackup();break;
    case 'copyCode':var ta=$('#expCode');try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){b.textContent='Kopiert';},function(){ta.select();document.execCommand('copy');b.textContent='Kopiert';});}else{ta.select();document.execCommand('copy');b.textContent='Kopiert';}}catch(er){ta.select();}break;
    case 'saveFile':try{var bl=new Blob([JSON.stringify(S)],{type:'application/json'}),au=URL.createObjectURL(bl),an=document.createElement('a');an.href=au;an.download='readster-'+dkey(new Date())+'.json';document.body.appendChild(an);an.click();setTimeout(function(){URL.revokeObjectURL(au);an.remove();},2000);}catch(er){}break;
    case 'loadCode':applyBackup($('#impCode').value);break;
    case 'doReset':S=defaults();save();closeBox('#sheet');R=null;renderHome();show('home');break;
  }
});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='nameIn'){S.name=e.target.value.trim().slice(0,16);save();if(!$('#v-home').hidden)renderHome();}});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='impFile'&&e.target.files&&e.target.files[0]){var fr=new FileReader();fr.onload=function(){applyBackup(fr.result);};fr.readAsText(e.target.files[0]);}
});
if(window.speechSynthesis){try{window.speechSynthesis.onvoiceschanged=function(){};}catch(e){}}
whCrashCheck();
renderHome();show('home');
})();
</script>
</body>
