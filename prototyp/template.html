<style>
/* Layout: eine schmale Spalte fürs Tablet. Start = Monster, Wochenziel, nächster Text, Themen. Lesen = ein Text pro Bildschirm. Stil und Farben wie Vokamon. */
:root{
  --bg:#07202b;--surface:#0f3342;--ink:#e8f8ff;--muted:#8fbccc;--line:#1d4d61;
  --accent:#2fd6d0;--accent-edge:#169a96;--accent-ink:#042321;
  --cta:#ff7a59;--cta-edge:#c4492b;--cta-ink:#2b0c03;
  --xp:#ffd04d;--xp-edge:#c79500;--xp-ink:#3d2a00;
  --good:#4fd18b;--good-bg:#12392a;--bad:#ff7c82;--bad-bg:#46202a;--warn-bg:#443a14;
  --sy-a:#8be9e3;--sy-b:#ffd9a0;
  --f-display:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
b,strong{font-weight:600}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:14px 32px}
.app{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
h2{font-family:var(--f-display);font-weight:500;font-size:1.45rem;text-wrap:balance;line-height:1.2}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
.eyebrow{font-size:.75rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.6rem;color:var(--ink)}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:500;font-size:.92rem;font-variant-numeric:tabular-nums}
.chip.lvl{background:var(--xp);border-color:var(--xp-edge);color:var(--xp-ink)}
.iconbtn{cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:50%;width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-family:var(--f-display);font-weight:500;font-size:1rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.btn{font-family:var(--f-display);font-weight:500;font-size:1.2rem;padding:14px 22px;border-radius:18px;border:0;background:var(--cta);color:var(--cta-ink);box-shadow:0 5px 0 var(--cta-edge);cursor:pointer;transition:transform .08s,box-shadow .08s;text-align:center;min-height:52px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--cta-edge)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn.wide{width:100%}
.btn.on{background:var(--warn-bg);border-color:var(--xp)}
.link{background:none;border:0;color:var(--muted);font-weight:500;cursor:pointer;padding:10px;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 180px}
.bar{height:16px;border-radius:999px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--xp);box-shadow:inset 0 -4px 0 var(--xp-edge);transition:width .5s ease}
.xptext{font-size:.9rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.mon{width:112px;height:116px;flex:none;--mi:#4ade80;--tile:var(--surface);padding:4px}
.mon .m{fill:var(--mi)}.mon .k{fill:var(--tile)}
.mon .ms{fill:none;stroke:var(--mi);stroke-linecap:round;stroke-linejoin:round}
.mon .ks{fill:none;stroke:var(--tile);stroke-linecap:round;stroke-linejoin:round}
.sw{flex:0 0 48px!important;min-width:48px;height:48px;border-radius:50%!important;padding:0!important}
.sw[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.evo{display:flex;align-items:center;justify-content:center;gap:10px}
.evo .mon{width:120px;height:134px}.evo-old{opacity:.55}.evo-ar{font-size:2rem;color:var(--xp)}
.rank{display:inline-block;background:var(--xp);color:#1b1500;border-radius:999px;padding:2px 12px;font-weight:500;font-size:.85rem}
.mon svg{width:100%;height:100%;display:block;overflow:visible}
.mon.big{width:150px;height:156px}
.hero{flex-direction:row;align-items:center;gap:16px}
.hero .info{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.stagename{font-family:var(--f-display);font-weight:600;font-size:1.7rem;line-height:1.05}
.week{gap:14px}
.alt{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.alt .row>*{flex:1 1 120px}
.selfq{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:12px;border-top:2px solid var(--line)}
.selfq .row>*{flex:1 1 0;min-width:0;padding-inline:6px}
.selfq h3{font-size:1.05rem;margin:0}
.prev{position:sticky;top:-20px;z-index:2;box-shadow:0 8px 16px rgba(0,0,0,.4)}
details.adult.set{border-top:2px solid var(--line);padding-top:12px}
details.adult.set[open]>div{display:flex;flex-direction:column;gap:16px;margin-top:12px}
.dots{display:flex;gap:8px;justify-content:space-between}
.dot{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
.dot i{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;border:3px solid var(--line);background:var(--bg);display:block}
.dot.on i{background:var(--xp);border-color:var(--xp-edge)}
.dot.today i{border-color:var(--accent)}
.dot span{font-size:.75rem;font-weight:500;color:var(--muted)}
.next{gap:10px}
.proto{align-self:center;background:var(--xp);color:#1b1500;border-radius:999px;padding:2px 12px;font-weight:500;font-size:.8rem}
.pick{display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 140px);justify-content:center}
.pick h2{text-align:center;font-size:1.7rem}
.pick .mon{width:110px;height:120px;align-self:center}
.mode{display:flex;align-items:center;gap:16px;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px;cursor:pointer;box-shadow:0 5px 0 var(--line);color:var(--ink);font:inherit}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.mode .ic{flex:0 0 56px;height:56px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.mode .ic svg{width:32px;height:32px}
.mode b{display:block;font-family:var(--f-display);font-size:1.45rem}
.mode span{color:var(--muted);font-weight:600;font-size:.95rem}
.mtog{display:inline-flex;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.mtog button{width:40px;height:34px;border:0;border-radius:999px;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mtog button svg{width:22px;height:22px}
.mtog button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.next .q{font-family:var(--f-display);font-weight:500;font-size:1.5rem;line-height:1.2;text-wrap:balance}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;box-shadow:0 4px 0 var(--line);min-height:96px}
.cat:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.cat svg{width:32px;height:32px;color:var(--accent)}
.cat b{font-family:var(--f-display);font-weight:500;font-size:1.15rem}
.cat span{font-size:.85rem;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.backrow{display:flex;align-items:center;gap:12px}
.back{background:none;border:0;cursor:pointer;color:var(--muted);font-weight:500;padding:10px 8px 10px 0;min-height:44px}
.steps{display:flex;gap:6px;flex:1}
.steps i{height:8px;flex:1;border-radius:999px;background:var(--line)}
.steps i.on{background:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;box-shadow:0 4px 0 var(--line);min-height:64px}
.trow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.trow b{font-weight:500;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.badge{flex:none;font-size:.8rem;font-weight:500;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--muted);border:2px solid var(--line)}
.badge.done{background:var(--good-bg);color:var(--good);border-color:var(--good)}
/* Lesetext */
.rtext{--rf:'Nunito';--rsize:1.5rem;--rline:1.9;--rsp:0em;font-family:var(--rf),system-ui,sans-serif;font-size:var(--rsize);line-height:var(--rline);letter-spacing:var(--rsp);word-spacing:.12em;font-weight:500;max-width:36em;overflow-wrap:break-word}
.rtext .w{border-radius:8px;padding:2px 3px;margin-inline:-3px;transition:background .15s}
.rtext.syl-on .sy.s0{color:var(--sy-a)}
.rtext.syl-on .sy.s1{color:var(--sy-b)}
.rtext .w.now{background:var(--warn-bg);box-shadow:0 0 0 3px var(--accent)}
.rtext.marking .w{cursor:pointer}
.rtext.seek .w{cursor:pointer}
.rtext .w.st{background:var(--bad-bg);text-decoration:underline wavy var(--bad);text-underline-offset:6px}
.card.riddle{border:2px dashed var(--accent)}
.card.riddle.locked{opacity:.75}
.card.riddle .rl{display:block;font-family:var(--f-display);font-size:.85rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.card.riddle.reveal{animation:rpop .6s ease-out}
@keyframes rpop{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1)}}
.card.riddle .rtext{padding:0}
.rtext .w.sug{outline:2px dashed var(--xp);outline-offset:1px}
.tiles{display:flex;gap:10px}.tiles>.tile{flex:1 1 0;min-width:0}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-display);font-size:1.9rem;color:var(--xp);line-height:1.1}
.tile span{font-size:.8rem;font-weight:500;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .dt.sel{stroke:var(--ink)}
.chart .hit{fill:transparent;cursor:pointer}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body);font-weight:600}
.sb{display:grid;grid-template-columns:5.5rem 1fr 2rem;gap:8px;align-items:center;font-weight:500;font-size:.95rem}
.sb i{display:block;height:12px;border-radius:6px;background:var(--accent);min-width:2px}
table.tb{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}table.tb td,table.tb th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.fb{font-weight:600;color:var(--ink)}
.sent.todo{opacity:.35}.sent.done{opacity:.65}
.sent.cur{background:var(--warn-bg);border-radius:10px;padding:2px 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.turn{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.turn b{font-family:var(--f-display);font-size:1.3rem}
.turn.opa b{color:var(--xp)}.turn.kid b{color:var(--accent)}
.rec{display:flex;flex-direction:column;gap:8px}.rec audio{width:100%}
.recdot{color:var(--bad);font-weight:500}
details.tip{border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface)}
details.tip summary{cursor:pointer;font-weight:500}details.tip ul{margin:8px 0 0;padding-left:1.2em;color:var(--muted);font-weight:600}
.hint{color:var(--muted);font-weight:600;font-size:.95rem}
.result{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:16px;padding:14px 16px}
.result b{font-family:var(--f-display);font-size:1.5rem;font-weight:500}
.rb{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-weight:500;font-size:.9rem;font-variant-numeric:tabular-nums}
.rb i{display:block;height:12px;border-radius:999px;background:var(--accent)}
.rb.best i{background:var(--xp)}
.qa{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:16px;padding:14px 16px}
.qa p{font-weight:500}
.result-card{display:flex;flex-direction:column;gap:12px}.result-card .rhead{font-family:var(--f-display);font-size:1.45rem;font-weight:500;line-height:1.2}
.result-card .bars{display:flex;flex-direction:column;gap:6px}
.rec.me{background:var(--bg);border-radius:16px;padding:12px 14px}.rec.me b{font-family:var(--f-display);font-weight:500;font-size:1.1rem}
.chk{display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:16px;padding:12px 14px}.chk b{font-family:var(--f-display);font-weight:500;font-size:1.15rem}
.rtext .w.srm{text-decoration:underline dotted var(--accent);text-decoration-thickness:3px;text-underline-offset:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;font-weight:500;text-align:left;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:48px;cursor:pointer}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}.opt.miss{border-color:var(--bad);background:var(--bad-bg)}.opt.off{opacity:.55}.opt:disabled{cursor:default}
.qfb{font-weight:500}.qfb.ok{color:var(--good)}
.qa .ans{background:var(--good-bg);color:var(--good);border-radius:12px;padding:8px 12px;font-weight:500}
/* Karten */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kcard{--c:#2fa868;background:var(--surface);border:2px solid color-mix(in srgb,var(--c) 70%,var(--line));border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,var(--bg));width:100%}

.kcard .kn{font-family:var(--f-display);font-weight:500;font-size:1.05rem;line-height:1.15;overflow-wrap:anywhere}
.kcard .kc{font-size:.7rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kcard.lock{--c:#4a5d6b;box-shadow:0 4px 0 var(--line);cursor:default}
.kcard.lock .mon{--mi:#1b3a4a;--tile:var(--surface)}
.kcard.lock .mon .q{font-family:var(--f-display);font-weight:600;font-size:44px;fill:#5d8296}
.kcard.lock .kn{color:var(--muted)}
.kfull{width:100%;max-width:340px;margin-inline:auto;padding:20px;gap:10px}
.kfull .mon{width:200px;height:auto;aspect-ratio:120/134}
.kfull .mn{font-family:var(--f-display);font-weight:600;font-size:1.9rem;line-height:1}
.kfull .kn{font-size:1.6rem}
.kfull .kf{font-weight:600;font-size:1.05rem;line-height:1.4}
.wj{display:flex;flex-wrap:wrap;gap:8px}
.wj span{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:500;font-size:.95rem}
/* Overlays */
.cfbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
[hidden]{display:none!important}
.cfbox[hidden]{display:none!important}
.cfbox .card{max-width:440px;width:100%;margin-block:auto;text-align:center;align-items:center}
.cfbox .card.left{text-align:left;align-items:stretch}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 90px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:500;cursor:pointer;min-height:48px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.setrow{display:flex;flex-direction:column;gap:8px}
.cfbtns{display:flex;gap:10px;width:100%}
.cfbtns .btn{flex:1}
.xpgain{font-family:var(--f-display);font-weight:600;font-size:1.6rem;color:var(--xp)}

@keyframes fxs{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.6) rotate(var(--rot))}}

<style>

.result .wpm{font-weight:500;color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
details.adult{border:0;padding:0;background:none}
details.adult summary{color:var(--muted);font-weight:500;font-size:.9rem;cursor:pointer;min-height:32px}
details.adult p{color:var(--muted);font-weight:600;font-size:.92rem;margin-top:6px}
.badge.star{color:var(--xp);border-color:var(--line);letter-spacing:.05em}
/* Wort-Jäger */
.wjcta{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:2px solid var(--xp-edge);border-radius:22px;padding:16px 18px;cursor:pointer;box-shadow:0 5px 0 var(--xp-edge)}
.wjcta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--xp-edge)}
.wjcta svg{flex:none;width:40px;height:40px;color:var(--xp)}
.wjcta b{font-family:var(--f-display);font-weight:600;font-size:1.3rem;display:block}
.wjcta span{color:var(--muted);font-weight:500;font-size:.9rem}
.wjword{font-family:var(--rf,'Nunito'),system-ui,sans-serif;font-weight:600;font-size:2.6rem;text-align:center;line-height:1.3;overflow-wrap:anywhere;letter-spacing:var(--rsp,0)}
.claps{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.clap{font-family:var(--rf,'Nunito'),system-ui,sans-serif;font-weight:600;font-size:1.8rem;min-width:72px;min-height:72px;padding:8px 16px;border-radius:18px;background:var(--bg);border:3px solid var(--line);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--line)}
.clap.s0{color:var(--sy-a)}.clap.s1{color:var(--sy-b)}
.clap.on{border-color:var(--xp);background:var(--warn-bg)}
.clap:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.rdots{display:flex;justify-content:center;gap:12px}
.rdots i{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);background:var(--bg)}
.rdots i.on{background:var(--xp);border-color:var(--xp-edge)}
.wjstep{text-align:center;color:var(--muted);font-weight:500}
.wj span.ok{border-color:var(--good);color:var(--good)}
textarea.code{width:100%;min-height:90px;font:600 .8rem/1.3 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px;resize:vertical}
input.name{width:100%;font:700 1.1rem var(--f-body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px}
</style>

<script>

</script>
<script>
(function(){
'use strict';
var XPK=20,WEEKGOAL=4,KEY='readster.prototyp'; /* Speicher-Schlüssel bleibt, damit der Fortschritt nach der Umbenennung erhalten bleibt */
var MADEBY='__MADEBY__';
var CATS=[
 {id:'Tiere',ic:'<svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><ellipse cx="16" cy="21" rx="7" ry="6"/><circle cx="7" cy="14" r="3"/><circle cx="12.5" cy="8.5" r="3"/><circle cx="19.5" cy="8.5" r="3"/><circle cx="25" cy="14" r="3"/></svg>'},
 {id:'Weltall',ic:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="16" cy="16" r="7" fill="currentColor" stroke="none"/><ellipse cx="16" cy="16" rx="14" ry="5" transform="rotate(-20 16 16)"/></svg>'},
 {id:'Technik',ic:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="16" cy="16" r="9" stroke-width="5" stroke-dasharray="3.2 3.2"/><circle cx="16" cy="16" r="7.5" stroke-width="3"/><circle cx="16" cy="16" r="2.5" fill="currentColor" stroke="none"/></svg>'},
 {id:'Körper',ic:'<svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 28C6 21 3 15 3 10.5 3 6.9 5.8 4 9.3 4c2.8 0 5 1.6 6.7 4 1.7-2.400 3.900-4 6.700-4C26.200 4 29 6.900 29 10.500 29 15 26 21 16 28z"/></svg>'},
 {id:'Sport',ic:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="16" cy="16" r="12"/><path d="M4 16h24M16 4c-6 6-6 18 0 24M16 4c6 6 6 18 0 24"/></svg>'},
 {id:'Rätsel',ic:'<svg viewBox="0 0 32 32" aria-hidden="true"><text x="16" y="26" text-anchor="middle" font-family="Lexend,sans-serif" font-weight="600" font-size="30" fill="currentColor">?</text></svg>'}
];
var TILE={'Tiere':'#4ade80','Weltall':'#a78bfa','Technik':'#fb923c','Körper':'#f472b6','Sport':'#facc15','Rätsel':'#2dd4bf'};
var MNAME=['Klebo','Bunto','Trio','Halbi','Schnarch','Rasso','Sturzo','Wumm','Glühi','Kratzo','Ringo','Zisch','Hopsi','Nordo','Poch','Brrr','Knack','Blitzo','Dunko','Marat','Platsch','Nessi','Steino','Blubb'];
var COLS=['#2fd6d0','#4ade80','#a78bfa','#fb923c','#f472b6','#facc15'];
function rankOf(L){var r=0;MON.STAGES.forEach(function(s,i){if(L>=s.lv)r=i;});return r;}
var TEXTS=__DATA__;
var TIMES=__TIMES__;
var byId={};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(s,r){return (r||document).querySelector(s);}
function tokenize(syl){
  return syl.split(' ').map(function(tk){
    var m=/^([^A-Za-zÄÖÜäöüß0-9]*)(.*?)([^A-Za-zÄÖÜäöüß0-9]*)$/.exec(tk);
    var sy=m[2].split('·');
    return {pre:m[1],sy:sy,post:m[3],plain:sy.join('')};
  });
}
TEXTS.forEach(function(t,i){
  t.i=i;byId[t.id]=t;t.words=tokenize(t.syl);
  t.plain=t.words.map(function(w){return w.pre+w.plain+w.post;}).join(' ');
  t.ask=t.r||'';t.rs=t.r?t.words.length-t.r.split(/\s+/).length:t.words.length;
});
TEXTS.forEach(function(t){
  t.sents=[];var s=0;
  for(var i=0;i<t.rs;i++){if(/[.!?]/.test(t.words[i].post)||i===t.rs-1){t.sents.push([s,i+1]);s=i+1;}}
});
/* Schwierigkeit: lange Wörter und Silben pro Wort. Die schwerere Hälfte bekommt zwei Sterne. */
var WSY={};
TEXTS.forEach(function(t){
  var lw=0,sy=0;
  for(var i=0;i<t.rs;i++){var w=t.words[i];sy+=w.sy.length;if(w.plain.replace(/[^A-Za-zÄÖÜäöüß]/g,'').length>=11)lw++;
    var k=w.plain;if(/[A-Za-zÄÖÜäöüß]/.test(k)&&!WSY[k])WSY[k]={sy:w.sy.slice(),id:t.id,i:i};}
  t.diff=lw*2+sy/t.rs*10;
});
(function(){var ds=TEXTS.map(function(t){return t.diff;}).sort(function(a,b){return a-b;}),med=ds[Math.floor(ds.length/2)];TEXTS.forEach(function(t){t.stars=t.diff>=med?2:1;});})();
/* ---------- Zustand ---------- */
function defaults(){return {whNote:'',xp:0,done:{},stolper:{},wj:{},opa:[],name:'',days:{},last:null,col:'#2fd6d0',recN:{},log:[],set:{font:'Lexend',lx:1,size:1,line:1,space:0,syl:true,speed:'normal',rec:true,nums:true,wh:false,whm:-1}};}
function fixState(d){
  /* Ältere Stände: gesammelte Wörter in den Wort-Jäger übernehmen */
  Object.keys(d.stolper||{}).forEach(function(w){if(!d.wj[w])d.wj[w]={n:d.stolper[w],ok:[],done:false};});
  if(!Array.isArray(d.log))d.log=[];
  return d;
}
function merge(j){
  var d=defaults();
  if(j&&typeof j==='object'){for(var k in d){if(j[k]!==undefined&&k!=='set')d[k]=j[k];}
    for(var q in d.set){if(j.set&&j.set[q]!==undefined)d.set[q]=j.set[q];}
    if(!(j.set&&j.set.lx)){d.set.font='Lexend';d.set.lx=1;}} /* Lexend ist jetzt die Standard-Leseschrift */
  return fixState(d);
}
function load(){
  var j=null;
  try{j=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  return merge(j);
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
function lvl(xp){return Math.floor(Math.sqrt(xp/XPK))+1;}
function lvlProg(xp){var L=lvl(xp),a=XPK*(L-1)*(L-1),b=XPK*L*L;return {L:L,pct:Math.max(0,Math.min(100,Math.round((xp-a)/(b-a)*100))),need:b-xp};}
function doneCount(){return Object.keys(S.done).length;}
function dkey(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function weekInfo(){
  var now=new Date(),dow=(now.getDay()+6)%7,arr=[],n=0,lab=['Mo','Di','Mi','Do','Fr','Sa','So'];
  for(var i=0;i<7;i++){var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+i),on=!!S.days[dkey(d)];if(on)n++;arr.push({on:on,today:i===dow,lab:lab[i]});}
  return {arr:arr,n:n};
}
function suggest(){
  var l=S.last&&byId[S.last];
  if(l){var f=byId[l.next];if(f&&!S.done[f.id])return {t:f,from:l};}
  if(!doneCount())return {t:TEXTS[0],from:null};
  var open=TEXTS.filter(function(t){return !S.done[t.id];}).sort(function(a,b){return a.diff-b.diff;});
  return open.length?{t:open[0],from:null}:null;
}
/* Wiederholen: ein Text, der vor 2 bis 10 Tagen gelesen wurde, bevorzugt einer, der holprig war */
function lastRead(id){
  var d=S.done[id];if(d&&d.ts)return d.ts;
  var ts=0;S.log.forEach(function(x){if(x.id===id&&x.ts>ts)ts=x.ts;});S.opa.forEach(function(x){if(x.id===id&&x.ts>ts)ts=x.ts;});return ts;
}
function daysAgo(ts){var a=new Date(ts),b=new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.round((b-a)/864e5);}
function repeatPick(){
  var best=null,bs=-1;
  Object.keys(S.done).forEach(function(id){
    var t=byId[id];if(!t)return;var ts=lastRead(id);if(!ts)return;var ag=daysAgo(ts);if(ag<2||ag>10)return;
    var d=S.done[id],sc=(d.hard?3:0)+(d.marked?2:0)+(d.qmiss?1:0)+(d.rounds<=1?1:0)+ag/10;
    if(sc>bs){bs=sc;best=t;}
  });
  return best;
}
/* Wort-Jäger: höchstens 5 Wörter pro Runde, nicht zweimal am selben Tag */
var WJ_MAX=5,WJ_NEED=3;
function wjDue(){
  var today=dkey(new Date());
  return Object.keys(S.wj).filter(function(w){var e=S.wj[w];return !e.done&&e.last!==today;})
    .sort(function(a,b){return (S.wj[b].n||0)-(S.wj[a].n||0);});
}
function wjAdd(w){
  if(!/[A-Za-zÄÖÜäöüß]/.test(w))return;
  var e=S.wj[w]||{n:0,ok:[],done:false};e.n=(e.n||0)+1;if(e.done){e.done=false;e.ok=[];}S.wj[w]=e;
}
function monHTML(i,tile,cls){
  var svg=(i==='lock')?'<svg viewBox="0 -10 120 134" aria-hidden="true"><text class="q" x="60" y="72" text-anchor="middle">?</text></svg>':MON.svg(i);
  return '<div class="mon '+(cls||'')+(i==='lock'?' lockm':'')+'" style="--mi:'+tile+'">'+svg+'</div>';}
function stageHTML(n,cls){return '<div class="mon '+(cls||'')+'" style="--mi:'+S.col+'">'+MON.stage(n,null)+'</div>';}
var CUR='home',HPUSH=false;
function show(v){
  ['home','cat','read','album','stats','wj'].forEach(function(x){$('#v-'+x).hidden=(x!==v);});
  CUR=v;
  if(v!=='read')stopListen();
  if(v!=='read'&&v!=='wj')setDock('');
  /* Zurück-Geste von iOS und Browser-Zurück führen zur Übersicht statt aus der App */
  if(v!=='home'&&!HPUSH){try{history.pushState({lm:1},'');HPUSH=true;}catch(e){}}
  window.scrollTo(0,0);
}
function setDock(html){
  var d=$('#dock');
  if(!html){d.hidden=true;$('#dockin').innerHTML='';document.body.classList.remove('hasdock');return;}
  $('#dockin').innerHTML=html;d.hidden=false;document.body.classList.add('hasdock');
  document.body.style.setProperty('--dockh',d.offsetHeight+'px');
}
window.addEventListener('resize',function(){var d=$('#dock');if(!d.hidden)document.body.style.setProperty('--dockh',d.offsetHeight+'px');});
window.addEventListener('popstate',function(){
  HPUSH=false;
  if(!$('#sheet').hidden){closeBox('#sheet');}
  if(!$('#modal').hidden){closeBox('#modal');}
  if(CUR==='home')return;
  recStop(false);stopListen();R=null;renderHome();show('home');
});
function openBox(id,html){var b=$(id);b.innerHTML=html;b.hidden=false;}
function closeBox(id){$(id).hidden=true;$(id).innerHTML='';}
/* ---------- Startseite ---------- */
var IC_SOLO='<svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><circle cx="16" cy="10" r="6"/><path d="M5 28c0-6.6 4.9-11 11-11s11 4.4 11 11z"/></svg>';
var IC_DUO='<svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><circle cx="11" cy="11" r="5"/><path d="M1.5 27c0-5.8 4.2-9.5 9.5-9.5s9.5 3.7 9.5 9.5z"/><circle cx="22.5" cy="9" r="4" opacity=".65"/><path d="M17.5 17.4c1.4-1 3.1-1.6 5-1.6 4.7 0 8 3.4 8 8.7h-8.7c-.7-2.9-2.2-5.3-4.3-7.1z" opacity=".65"/></svg>';
var MODE=null;
/* Monster wächst in Stufen; statt XP zeigen wir, wie viele Texte es ungefähr noch bis zur nächsten Stufe sind */
var XP_TEXT=40;
function stageProg(){
  var r=rankOf(lvl(S.xp)),st=MON.STAGES;
  if(r>=st.length-1)return {pct:100,next:null,texts:0};
  var a=XPK*(st[r].lv-1)*(st[r].lv-1),b=XPK*(st[r+1].lv-1)*(st[r+1].lv-1);
  return {pct:Math.max(0,Math.min(100,Math.round((S.xp-a)/(b-a)*100))),next:st[r+1].n,texts:Math.max(1,Math.ceil((b-S.xp)/XP_TEXT))};
}
function growText(){
  var g=stageProg();
  if(!g.next)return 'Dein Monster ist ganz ausgewachsen!';
  var t=g.texts===1?'einen Text':(g.texts+' Texte');
  return rankOf(lvl(S.xp))===0?'Lies '+t+', dann schlüpft es.':'Noch '+t+', dann wird es '+({Riese:'zum Riesen',Legende:'zur Legende'}[g.next]||'zum '+g.next)+'.';
} /* Prototyp: wird bei jedem Start neu gewählt */
function renderPick(){
  var h='<div class="pick"><span class="proto">Prototyp</span>'+stageHTML(rankOf(lvl(S.xp)))+'<h2>Wie liest du heute?</h2>';
  h+='<button class="mode" data-a="mode" data-v="solo"><span class="ic">'+IC_SOLO+'</span><div><b>Allein</b><span>Du hörst zu und liest dann selbst laut.</span></div></button>';
  h+='<button class="mode" data-a="mode" data-v="partner"><span class="ic">'+IC_DUO+'</span><div><b>Mit Partner</b><span>Ihr lest abwechselnd Satz für Satz, zum Beispiel mit Opa.</span></div></button>';
  h+='</div>';
  $('#v-home').innerHTML=h;
}
function renderHome(){
  if(!MODE){renderPick();return;}
  var p=lvlProg(S.xp),sg=suggest(),wk=weekInfo(),n=doneCount();
  var h='<header class="top"><h1 class="brand">Readster</h1><div class="chips"><div class="mtog" role="group" aria-label="Wie liest du?"><button data-a="mode" data-v="solo" aria-pressed="'+(MODE==='solo')+'" aria-label="Allein">'+IC_SOLO+'</button><button data-a="mode" data-v="partner" aria-pressed="'+(MODE==='partner')+'" aria-label="Mit Partner">'+IC_DUO+'</button></div><button class="iconbtn" data-a="stats" aria-label="Dein Fortschritt"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="12" width="4" height="7" rx="1.5" fill="currentColor"/><rect x="9" y="7" width="4" height="12" rx="1.5" fill="currentColor"/><rect x="15" y="3" width="4" height="16" rx="1.5" fill="currentColor"/></svg></button><button class="iconbtn" data-a="settings" aria-label="Lesehilfen einstellen">Aa</button></div></header>';
  if(S.whNote)h+='<section class="card left whnote"><p class="fb">'+esc(S.whNote)+'</p><button class="btn ghost sm" data-a="whNoteOk">Okay</button></section>';
  var due=wjDue().length;
  if(due)h+='<button class="wjcta" data-a="wj"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><circle cx="17" cy="17" r="11"/><path d="M25 25l10 10"/><path d="M12 17h10M17 12v10" stroke-width="2.6"/></svg><div><b>Wort-Jäger</b><span>'+Math.min(due,WJ_MAX)+(Math.min(due,WJ_MAX)===1?' Wort':' Wörter')+' zum Üben</span></div></button>';
  h+='<section class="left"><h2 style="margin-bottom:12px">Worüber willst du lesen?</h2><div class="cats">'+CATS.map(function(c){
    var tot=TEXTS.filter(function(t){return t.cat===c.id;}),d=tot.filter(function(t){return S.done[t.id];}).length;
    return '<button class="cat" data-a="cat" data-v="'+c.id+'">'+c.ic+'<b>'+c.id+'</b><span>'+d+' von '+tot.length+'</span></button>';
  }).join('')+'</div></section>';
  if(sg)h+='<button class="btn wide" data-a="open" data-v="'+sg.t.id+'">'+(sg.from?'Rätsel lösen: '+esc(sg.t.title):'Überrasch mich')+'</button>';
  var stn=MON.STAGES[rankOf(p.L)].n;
  h+='<h2 style="margin:10px 0 -4px">Dein Level</h2>';
  h+='<section class="card week"><div class="hero" style="display:flex">'+stageHTML(rankOf(p.L))+'<div class="info"><span class="eyebrow">'+(S.name?'Dein Monster · '+esc(stn):'Dein Monster')+'</span><span class="stagename">'+esc(S.name||stn)+'</span><div class="bar" role="progressbar" aria-valuenow="'+stageProg().pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+stageProg().pct+'%"></i></div><span class="xptext">'+esc(growText())+'</span></div></div>'+
    '<div class="wk"><div class="row" style="flex-wrap:nowrap;justify-content:space-between;align-items:baseline"><span class="eyebrow">Diese Woche</span><span class="xptext">'+wk.n+' von '+WEEKGOAL+' Tagen</span></div><div class="dots">'+wk.arr.map(function(d){return '<div class="dot'+(d.on?' on':'')+(d.today?' today':'')+'"><i></i><span>'+d.lab+'</span></div>';}).join('')+'</div></div></section>';
  h+='<button class="btn ghost wide" data-a="album">Wissensalbum · '+n+' von '+TEXTS.length+' Karten</button>';
  h+='<div class="foot"><div class="madeby"><span>Made with love by</span><img alt="A Simple Man’s Lab" src="'+MADEBY+'"></div></div>';
  $('#v-home').innerHTML=h;
}
function renderCat(id){
  var items=TEXTS.filter(function(t){return t.cat===id;}).sort(function(a,b){return a.diff-b.diff;});
  var h='<div class="backrow"><button class="back" data-a="home">‹ Zurück</button></div><h2>'+esc(id)+'</h2><p class="hint">Ein Stern: leichter. Zwei Sterne: kniffliger.</p><div class="list">';
  h+=items.map(function(t){
    var d=S.done[t.id],b=d?'<span class="badge done">'+(d.best&&S.set.nums?d.best+' W/min':'gelesen')+'</span>':'<span class="badge star" aria-label="'+(t.stars>1?'kniffliger':'leichter')+'">'+(t.stars>1?'★★':'★')+'</span>';
    return '<button class="trow" data-a="open" data-v="'+t.id+'"><b>'+esc(t.title)+'</b>'+b+'</button>';
  }).join('')+'</div>';
  $('#v-cat').innerHTML=h;show('cat');
}
/* ---------- Lesen ---------- */
var R=null,tts={tok:0,timer:null,on:false};
function fontStack(f){return f;}
function wordsHTML(t,s,e){
  var a=[];
  for(var i=s;i<e;i++){
    var w=t.words[i],sy=w.sy.map(function(x,k){return '<span class="sy s'+(k%2)+'">'+esc(x)+'</span>';}).join('');
    a.push('<span class="w" data-i="'+i+'">'+esc(w.pre)+sy+esc(w.post)+'</span>');
  }
  return a.join(' ');
}
function textHTML(t){return wordsHTML(t,0,t.rs);}
function riddleBlock(t,reveal){
  if(t.rs>=t.words.length)return '';
  return '<section class="card riddle'+(reveal?' reveal':'')+'"><span class="rl">Rätsel</span><div class="rtext syl-on" id="rr">'+wordsHTML(t,t.rs,t.words.length)+'</div><div class="row" style="margin-top:12px"><button class="btn ghost" data-a="listenR" id="bR">'+lab('b','Rätsel anhören')+'</button></div></section>';

function pauseAnalyze(x,sr){
  /* Stockstellen: Pausen, die deutlich länger sind als die eigenen Pausen zwischen Wörtern */

  var gaps=[],run=0,sp=0,gs=-1;
  for(i=first;i<=last;i++){
    if(e[i]>thr){sp++;if(sp>=3&&gs>=0){if(run>=3)gaps.push({s:gs,len:run*F});gs=-1;run=0;}}
    else{if(gs<0){gs=i;run=0;}run+=1+(sp>0&&sp<3?sp:0);sp=0;}
  }

  gaps.forEach(function(g){total-=Math.round(g.len/F);});
  gaps.forEach(function(g){g.before=(g.s-first)-lost;lost+=Math.round(g.len/F);});

  str(0,'RIFF');v.setUint32(4,36+n*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,n*2,true);

function to16k(x,sr){
  if(sr===16000)return new Float32Array(x);
  var r=sr/16000,n=Math.floor(x.length/r),o=new Float32Array(n);
  for(var i=0;i<n;i++){var a=Math.floor(i*r),b=Math.min(x.length,Math.floor((i+1)*r)),s=0;for(var j=a;j<b;j++)s+=x[j];o[i]=b>a?s/(b-a):x[a]||0;}
  return o;
}
/* Gehörte Wörter (mit Zeiten) dem Text zuordnen; daraus: ausgelassene Wörter und Stockstellen */
function whCombine(t,chunks,pa){
  var H=[],i,j;
  (chunks||[]).forEach(function(c){var ts=c.timestamp||[],s0=ts[0]==null?0:ts[0],e0=ts[1]==null?s0:ts[1];
    String(c.text||'').trim().split(/\s+/).forEach(function(w){var n=normW(w);if(n)H.push({n:n,s:s0,e:e0});});});
  var T=[];for(i=0;i<t.rs;i++){var w=t.words[i];T.push(normW(w.pre+w.sy.join('')+w.post));}
  var N=T.length,M=H.length,D=[],B=[];
  for(i=0;i<=N;i++){D[i]=new Float32Array(M+1);B[i]=new Int8Array(M+1);}
  for(i=0;i<=N;i++)for(j=0;j<=M;j++){
    if(!i&&!j)continue;
    var best=1e9,bk=0;
    if(i&&D[i-1][j]+1<best){best=D[i-1][j]+1;bk=1;}
    if(j&&D[i][j-1]+1<best){best=D[i][j-1]+1;bk=2;}
    if(i&&j){var c=simW(T[i-1],H[j-1].n)?0:1;if(D[i-1][j-1]+c<best){best=D[i-1][j-1]+c;bk=c?4:3;}}
    if(i&&j>1&&simW(T[i-1],H[j-2].n+H[j-1].n)&&D[i-1][j-2]<best){best=D[i-1][j-2];bk=5;}
    D[i][j]=best;B[i][j]=bk;
  }
  var mt=[],hm=[];for(i=0;i<N;i++)mt[i]=-1;for(j=0;j<M;j++)hm[j]=-1;
  var a=N,b=M;
  while(a>0||b>0){var k=B[a][b];if(k===3){mt[a-1]=b-1;hm[b-1]=a-1;a--;b--;}else if(k===5){mt[a-1]=b-2;hm[b-2]=a-1;hm[b-1]=-2;a--;b-=2;}else if(k===4){a--;b--;}else if(k===1)a--;else b--;}
  var miss=[],ok=0,n=0;for(i=0;i<N;i++){if(!T[i])continue;n++;if(mt[i]>=0)ok++;else miss.push(i);}
  var nxt=new Array(M+1);nxt[M]=-1;for(j=M-1;j>=0;j--)nxt[j]=hm[j]>=0?hm[j]:nxt[j+1];
  function punct(k){return k>=0&&/[.,;:!?]/.test(t.words[k].post);}
  var cand={};function add(k,sc){if(k>0&&k<t.rs)cand[k]=Math.max(cand[k]||0,sc);}
  /* a) lange Pausen: das Wort direkt danach */
  var gl=(pa&&pa.gaps||[]).map(function(g){return g.len;}).sort(function(x,y){return x-y;});
  var med=gl.length?gl[Math.floor(gl.length/2)]:0.15,lim=Math.min(1.0,Math.max(0.6,med*2.5));
  var gp=[];
  (pa&&pa.gaps||[]).forEach(function(g){
    var t1=g.s*0.02+g.len;
    for(j=0;j<M&&H[j].s<t1-0.25;j++);
    if(j<M&&nxt[j]>=0)gp.push({k:nxt[j],len:g.len});
  });
  /* Pausen am Satzanfang mit den eigenen Satzpausen vergleichen */
  var sp=gp.filter(function(x){return punct(x.k-1)&&x.len>=0.25;}).map(function(x){return x.len;}).sort(function(x,y){return x-y;});
  var slim=sp.length>=3?Math.max(lim+0.4,sp[Math.floor(sp.length/2)]*1.8):Math.max(1.5,lim+0.9);
  gp.forEach(function(x){if(x.len>=(punct(x.k-1)?slim:lim))add(x.k,x.len);});
  /* b) Wiederholungen und Neuansätze: zusätzliche gehörte Wörter vor einem Textwort */
  for(j=0;j<M;j++)if(hm[j]===-1){
    var kp=-1;for(var q=j-1;q>=0;q--)if(hm[q]>=0){kp=hm[q];break;}
    var k2=(kp>=0&&(simW(T[kp],H[j].n)||T[kp].indexOf(H[j].n)===0))?kp:nxt[j];
    if(k2>0)add(k2,0.9);
  }
  /* c) lang gezogene Wörter */
  var dr=[];for(i=0;i<N;i++)if(mt[i]>=0){var h=H[mt[i]];dr.push({i:i,d:h.e-h.s,r:(h.e-h.s)/Math.max(2,T[i].length)});}

  dr.forEach(function(x){if(rm>0&&x.r>3*rm&&x.d>1.0)add(x.i,0.8);});
  var cap=Math.max(3,Math.min(10,Math.round(t.rs/8)));
  var out=Object.keys(cand).map(Number).sort(function(x,y){return cand[y]-cand[x];}).slice(0,cap).sort(function(x,y){return x-y;});
  return {sug:out,miss:miss,ok:ok,n:n,heard:M};
}

function wjRead(){W.reads++;if(W.reads>=3)W.step='judge';renderWJ();}
function wjJudge(ok){
  var w=W.list[W.k],e=S.wj[w],today=dkey(new Date());
  if(e){e.last=today;if(ok){e.ok=e.ok||[];if(e.ok.indexOf(today)<0)e.ok.push(today);if(e.ok.length>=WJ_NEED)e.done=true;}}
  W.res.push({w:w,ok:!!ok,done:!!(e&&e.done)});save();
  if(W.k+1<W.list.length){W.k++;W.step='clap';W.claps={};W.reads=0;renderWJ();window.scrollTo(0,0);sayWord(W.list[W.k]);return;}
  wjEnd();
}
function wjEnd(){
  var okN=W.res.filter(function(r){return r.ok;}).length,gain=10+okN*5,wasRank=rankOf(lvl(S.xp));
  S.xp+=gain;S.days[dkey(new Date())]=1;save();setDock('');
  var list=['Runde geschafft: 10 XP'];if(okN)list.push('Kann ich: '+okN*5+' XP');
  var done=W.res.filter(function(r){return r.done;}).length;
  function show2(){
    var p=lvlProg(S.xp);
    var h='<div class="card"><span class="eyebrow">Wort-Jäger</span><h2>Super gejagt!</h2>'+stageHTML(rankOf(p.L),'big')+'<span class="xpgain">Dein Monster ist gewachsen!</span><span class="xptext">'+esc(growText())+'</span>';
    h+='<div class="wj">'+W.res.map(function(r){return '<span class="'+(r.ok?'ok':'')+'">'+esc(r.w)+(r.done?' ✓':'')+'</span>';}).join('')+'</div>';
    if(done)h+='<p class="hint fb">'+done+(done===1?' Wort ist':' Wörter sind')+' jetzt ganz geschafft!</p>';
    h+='<button class="btn wide" data-a="home2">Zur Übersicht</button></div>';
    openBox('#modal',h);burst();
  }
  var nowRank=rankOf(lvl(S.xp));
  if(nowRank!==wasRank){R=R||{};showEvolve(wasRank,nowRank,show2);}else show2();
}
/* Album */
function renderAlbum(){
  var n=doneCount();
  var h='<div class="backrow"><button class="back" data-a="home">‹ Zurück</button></div><h2>Wissensalbum</h2><p class="hint">'+n+' von '+TEXTS.length+' Karten. Jede gelesene Geschichte schaltet eine Karte frei.</p><div class="grid">';
  h+=TEXTS.map(function(t){
    if(S.done[t.id])return '<button class="kcard" data-a="card" data-v="'+t.id+'" style="--c:'+TILE[t.cat]+'">'+monHTML(t.i,TILE[t.cat],'')+'<span class="kc">'+esc(t.cat)+'</span><span class="kn">'+esc(MNAME[t.i])+'</span></button>';
    return '<div class="kcard lock" aria-label="Noch nicht freigeschaltet">'+monHTML('lock','#1b3a4a','')+'<span class="kc">'+esc(t.cat)+'</span><span class="kn">?</span></div>';
  }).join('')+'</div>';
  var ws=Object.keys(S.wj).sort(function(a,b){return (S.wj[a].done?1:0)-(S.wj[b].done?1:0)||(S.wj[b].n||0)-(S.wj[a].n||0);}).slice(0,40);
  h+='<section class="card"><h2>Deine Wort-Jäger-Liste</h2>'+(ws.length?'<p class="hint">Grün mit Haken: geschafft. Die anderen übst du im Wort-Jäger.</p><div class="wj">'+ws.map(function(w){var e=S.wj[w];return '<span class="'+(e.done?'ok':'')+'">'+esc(w)+(e.done?' ✓':'')+'</span>';}).join('')+'</div>':'<p class="hint">Hier erscheinen die Wörter, die du beim Lesen antippst.</p>')+'</section>';
  $('#v-album').innerHTML=h;show('album');
}
/* Lesehilfen */
function renderSheet(){
  var s=S.set,od=$('#sheet details.set'),wasOpen=!!(od&&od.open),sc=$('#sheet').scrollTop;
  function seg(key,opts){return '<div class="seg">'+opts.map(function(o){return '<button data-a="set" data-k="'+key+'" data-v="'+o[0]+'" aria-pressed="'+(String(s[key])===String(o[0]))+'">'+o[1]+'</button>';}).join('')+'</div>';}
  var h='<div class="card left"><h2>Lesehilfen</h2>';
  h+='<div class="rtext syl-on prev" style="--rf:\''+esc(s.font)+'\';--rsize:'+[1.25,1.5,1.8][s.size]+'rem;--rline:'+[1.7,2,2.35][s.line]+';--rsp:'+[0,.04,.08][s.space]+'em;background:var(--bg);border-radius:14px;padding:12px 14px"><span class="w"><span class="sy s0">Ge</span><span class="sy s1">cko</span></span> <span class="w"><span class="sy s0">läuft</span></span> <span class="w"><span class="sy s0">an</span></span> <span class="w"><span class="sy s0">der</span></span> <span class="w"><span class="sy s0">Wand</span></span>.</div>';
  h+='<div class="setrow"><span class="eyebrow">Schrift</span>'+seg('font',[['Lexend','Lexend'],['Atkinson Hyperlegible','Klar'],['Nunito','Rund']])+'</div>';
  h+='<div class="setrow"><span class="eyebrow">Größe</span>'+seg('size',[[0,'Normal'],[1,'Groß'],[2,'Sehr groß']])+'</div>';
  h+='<div class="setrow"><span class="eyebrow">Silben in zwei Farben</span>'+seg('syl',[[true,'An'],[false,'Aus']])+'</div>';
  h+='<div class="setrow"><span class="eyebrow">Vorlese-Tempo</span>'+seg('speed',[['slow','Langsam'],['normal','Normal']])+'</div>';
  h+='<h2 style="margin-top:8px">Dein Monster</h2>';
  h+='<div class="setrow"><span class="eyebrow">Name</span><input class="name" id="nameIn" maxlength="16" autocomplete="off" placeholder="z. B. Krümel" value="'+esc(S.name||'')+'"></div>';
  h+='<div class="setrow"><span class="eyebrow">Farbe</span><div class="seg">'+COLS.map(function(c){return '<button class="sw" data-a="col" data-v="'+c+'" aria-label="Farbe" aria-pressed="'+(S.col===c)+'" style="background:'+c+'"></button>';}).join('')+'</div></div>';
  h+='<details class="adult set"'+(wasOpen?' open':'')+'><summary>Für Erwachsene</summary><div>';
  h+='<div class="setrow"><span class="eyebrow">Zeilenabstand</span>'+seg('line',[[0,'Eng'],[1,'Normal'],[2,'Weit']])+'</div>';
  h+='<div class="setrow"><span class="eyebrow">Buchstabenabstand</span>'+seg('space',[[0,'Normal'],[1,'Mehr'],[2,'Viel']])+'</div>';
  h+='<div class="setrow"><span class="eyebrow">Aufnahme beim Lesen</span>'+seg('rec',[[true,'An'],[false,'Aus']])+'<span class="hint">Die Aufnahmen bleiben nur auf diesem Gerät.</span><button class="link" id="delRecsBtn" data-a="delRecs">Alle Aufnahmen löschen</button></div>';
  h+='<div class="setrow"><span class="eyebrow">Genaue Auswertung (Whisper)</span>'+seg('wh',[[true,'An'],[false,'Aus']])+'<span class="hint">Erkennt Stockstellen und ausgelassene Wörter genauer. '+(WH_SERVER?'Die Aufnahme geht dafür kurz an Cloudflare und wird dort nicht gespeichert.':'Beim ersten Einschalten werden einmalig '+(whModel()?'etwa 40':'etwa 80')+' MB geladen, am besten im WLAN. Danach läuft alles auf diesem Gerät, der Ton verlässt es nicht.')+'</span><span class="hint fb" id="whst">'+esc(S.set.wh?whStatus():'')+'</span></div>';
  h+='<div class="setrow"><span class="eyebrow">Tempo-Zahlen zeigen</span>'+seg('nums',[[true,'An'],[false,'Aus']])+'<span class="hint">Aus: Es gibt nur „schneller als beim ersten Mal“, keine Wörter pro Minute.</span></div>';
  h+='<button class="link" data-a="backup">Fortschritt sichern oder laden</button><button class="link" data-a="reset">Fortschritt zurücksetzen</button></div></details>';
  h+='<button class="btn wide" data-a="sheetOk">Fertig</button></div>';
  openBox('#sheet',h);$('#sheet').scrollTop=sc;
}
/* Sichern und Laden: der ganze Fortschritt als Code oder Datei (ohne Aufnahmen) */
function b64e(str){return btoa(unescape(encodeURIComponent(str)));}
function b64d(str){return decodeURIComponent(escape(atob(str)));}
function exportCode(){return 'LM1:'+b64e(JSON.stringify(S));}
function parseBackup(txt){
  txt=String(txt||'').trim();var j=null;
  try{if(txt.indexOf('LM1:')===0)j=JSON.parse(b64d(txt.slice(4).replace(/\s+/g,'')));else if(txt.charAt(0)==='{')j=JSON.parse(txt);}catch(e){j=null;}
  if(!j||typeof j!=='object'||typeof j.xp!=='number'||!j.done)return null;
  return merge(j);
}
var FRAMED=(function(){try{return window.top!==window;}catch(e){return true;}})();
var IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var STANDALONE=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
function renderBackup(msg){
  var h='<div class="card left"><h2>Sichern und laden</h2>';
  h+='<p class="hint">Der Fortschritt liegt nur in diesem Browser. Mit dem Code kannst du ihn sichern oder auf ein anderes Gerät mitnehmen. Aufnahmen kommen nicht mit.</p>';
  h+='<div class="setrow"><span class="eyebrow">Sichern</span><textarea class="code" id="expCode" readonly>'+esc(exportCode())+'</textarea><div class="row"><button class="btn ghost" data-a="copyCode">Code kopieren</button>'+(FRAMED?'':'<button class="btn ghost" data-a="saveFile">Als Datei</button>')+'</div></div>';
  h+='<div class="setrow"><span class="eyebrow">Laden</span><textarea class="code" id="impCode" placeholder="Code hier einfügen"></textarea><div class="row"><button class="btn ghost" data-a="loadCode">Code laden</button><label class="btn ghost" style="display:flex;align-items:center;justify-content:center">Datei wählen<input type="file" id="impFile" accept=".json,.txt,application/json,text/plain" hidden></label></div></div>';
  if(msg)h+='<p class="hint fb" id="bkmsg">'+esc(msg)+'</p>';
  if(IOS&&!STANDALONE)h+='<p class="hint">Tipp für iPhone und iPad: Öffne die App in Safari und wähle „Teilen“ und dann „Zum Home-Bildschirm“. Dann löscht Safari den Fortschritt nicht nach längerer Pause.</p>';
  h+='<button class="btn wide" data-a="settings">Zurück</button></div>';
  openBox('#sheet',h);
}
function applyBackup(txt){
  var d=parseBackup(txt);
  if(!d){renderBackup('Das hat nicht geklappt. Prüfe, ob der Code vollständig ist.');return;}
  S=d;save();R=null;renderHome();show('home');renderBackup('Geladen: Level '+lvl(S.xp)+', '+doneCount()+' Texte.');
}
function renderReset(){
  openBox('#sheet','<div class="card"><h2>Fortschritt löschen?</h2><p class="hint">Alle Karten, XP und markierten Wörter auf diesem Gerät werden gelöscht.</p><div class="cfbtns"><button class="btn ghost" data-a="sheetOk">Abbrechen</button><button class="btn" data-a="doReset">Löschen</button></div></div>');
}
/* Klicks */
document.addEventListener('click',function(e){
  var w=e.target.closest('.w');
  if(w&&R&&R.phase==='mark'&&$('#rtext').contains(w)){var i=w.dataset.i;R.marks[i]=!R.marks[i];w.classList.toggle('st',!!R.marks[i]);if(R.marks[i])R.all[i]=true;else{R.all[i]=false;delete R.all[i];}return;}
  if(w&&R&&R.phase==='opa'&&$('#rtext').contains(w)){var oi=w.dataset.i;if(R.all[oi]){delete R.all[oi];w.classList.remove('st');}else{R.all[oi]=true;w.classList.add('st');}return;}
  if(w&&R&&$('#rr')&&$('#rr').contains(w)){listen(+w.dataset.i);return;}
  if(w&&R&&R.phase==='read'&&$('#rtext').contains(w)){listen(+w.dataset.i);return;}
  var pt=e.target.closest&&e.target.closest('[data-pt]');
  if(pt&&$('#v-stats').contains(pt)){var pi=+pt.dataset.pt,pp=S.log.filter(function(x){return x.wpm;}).slice(-30)[pi],cr=$('#chartread');
    if(cr&&pp)cr.textContent=fmtDate(pp.ts)+' · '+(byId[pp.id]?byId[pp.id].title:'')+' · '+pp.wpm+' Wörter pro Minute';
    var ds=document.querySelectorAll('#v-stats .dt');for(var di=0;di<ds.length;di++)ds[di].classList.toggle('sel',di===pi);return;}
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'home':case 'home2':stopListen();closeBox('#modal');renderHome();show('home');break;
    case 'cat':renderCat(v);break;
    case 'open':openText(v);break;
    case 'nextread':stopListen();closeBox('#modal');openText(v);break;
    case 'leave':recStop(false);stopListen();renderHome();show('home');break;
    case 'listen':listen(undefined,'a');break;
    case 'listenR':listen(undefined,'b');break;
    case 'start':startRound();break;
    case 'self':if(R&&R.entry){R.entry.self=+v;save();var sb2=document.querySelectorAll('.selfrow .btn');for(var si=0;si<sb2.length;si++){var on=(+sb2[si].dataset.v===+v);sb2[si].classList.toggle('on',on);sb2[si].classList.toggle('ghost',!on);}}break;
    case 'takeSug':(R.sug||[]).forEach(function(k){R.marks[k]=true;R.all[k]=true;var ww=$('#rtext .w[data-i="'+k+'"]');if(ww)ww.classList.add('st');});break;
    case 'stats':renderStats();show('stats');break;
    case 'opa':opaStart('opa');break;
    case 'solo':opaStart('solo');break;
    case 'soloHear':soloHear();break;
    case 'opaKid':opaStep('kid');break;
    case 'opaNext':opaStep('next');break;
    case 'opaBack':opaStep('back');break;
    case 'stop':stopRound();break;
    case 'shareRec':shareRec();break;
    case 'whNoteOk':S.whNote='';save();renderHome();break;
    case 'cancel':recStop(false);if(MODE==='partner'&&R.phase==='opa'){stopListen();renderHome();show('home');break;}R.phase='read';renderCtl();break;
    case 'mode':MODE=v||null;renderHome();show('home');break;
    case 'again':R.phase='read';renderCtl();window.scrollTo(0,0);break;
    case 'check':R.phase='check';renderCtl();try{$('#qcard').scrollIntoView({block:'start',behavior:'smooth'});}catch(er){}break;
    case 'pick':var pq=v.split('-'),qi=+pq[0],oj=+pq[1];if(R.pick[qi]===null){R.pick[qi]=oj;R.qs[qi]=R.opts[qi][oj]===R.t.q[qi].a?1:0;renderCtl();}break;
    case 'finish':finish();break;
    case 'evoOk':closeBox('#modal');if(R&&R.afterEvo){var f=R.afterEvo;R.afterEvo=null;f();}break;
    case 'col':S.col=v;save();renderSheet();if(!$('#v-home').hidden)renderHome();break;
    case 'album':renderAlbum();break;
    case 'card':var t=byId[v];openBox('#modal','<div class="card">'+cardHTML(t,true)+'<div class="cfbtns"><button class="btn ghost" data-a="closeModal">Schließen</button><button class="btn" data-a="nextread" data-v="'+t.id+'">Nochmal lesen</button></div></div>');break;
    case 'closeModal':stopListen();closeBox('#modal');break;
    case 'settings':renderSheet();break;
    case 'set':var k=b.dataset.k,val=v;if(k==='size'||k==='line'||k==='space')val=+v;else if(k==='syl'||k==='rec'||k==='nums'||k==='wh')val=(v==='true');S.set[k]=val;save();if(k==='wh'&&val)whPreload();renderSheet();readStyle();break;
    case 'sheetOk':closeBox('#sheet');break;
    case 'reset':renderReset();break;
    case 'delRecs':recDelAll().then(function(){var b=$('#delRecsBtn');if(b)b.textContent='Aufnahmen gelöscht';});break;
    case 'wj':wjStart();break;
    case 'wjSay':if(W)sayWord(W.list[W.k]);break;
    case 'wjClap':wjClap(+v);break;
    case 'wjRead':wjRead();break;
    case 'wjJudge':wjJudge(v==='1');break;
    case 'backup':renderBackup();break;
    case 'copyCode':var ta=$('#expCode');try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){b.textContent='Kopiert';},function(){ta.select();document.execCommand('copy');b.textContent='Kopiert';});}else{ta.select();document.execCommand('copy');b.textContent='Kopiert';}}catch(er){ta.select();}break;
    case 'saveFile':try{var bl=new Blob([JSON.stringify(S)],{type:'application/json'}),au=URL.createObjectURL(bl),an=document.createElement('a');an.href=au;an.download='readster-'+dkey(new Date())+'.json';document.body.appendChild(an);an.click();setTimeout(function(){URL.revokeObjectURL(au);an.remove();},2000);}catch(er){}break;
    case 'loadCode':applyBackup($('#impCode').value);break;
    case 'doReset':S=defaults();save();closeBox('#sheet');R=null;renderHome();show('home');break;
  }
});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='nameIn'){S.name=e.target.value.trim().slice(0,16);save();if(!$('#v-home').hidden)renderHome();}});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='impFile'&&e.target.files&&e.target.files[0]){var fr=new FileReader();fr.onload=function(){applyBackup(fr.result);};fr.readAsText(e.target.files[0]);}
});
if(window.speechSynthesis){try{window.speechSynthesis.onvoiceschanged=function(){};}catch(e){}}
whCrashCheck();
renderHome();show('home');
})();
</script>
