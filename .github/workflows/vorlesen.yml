name: Vorlesen erzeugen

# Erzeugt die Vorlese-Aufnahmen mit ElevenLabs und baut die Seite neu.
# Läuft von selbst, wenn sich etwas im Ordner "quelle" ändert, und per Hand über "Run workflow".
# Es werden nur Aufnahmen neu gemacht, deren Text sich geändert hat.

on:
  workflow_dispatch:
    inputs:
      langsam:
        description: "Auch eine eigene langsame Fassung aufnehmen (kostet doppelt)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["quelle/**"]

permissions:
  contents: write

concurrency:
  group: vorlesen
  cancel-in-progress: false

jobs:
  vorlesen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Silbentrennung installieren
        run: pip install pyphen==0.18.1

      - name: Aufnahmen erzeugen
        working-directory: quelle
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          TEMPI=n
          if [ "${{ inputs.langsam }}" = "true" ] || ls ../audio/*-s-a.mp3 >/dev/null 2>&1; then TEMPI=n,s; fi
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::warning::Secret ELEVENLABS_API_KEY fehlt noch. Die Seite wird ohne neue Aufnahmen gebaut."
            exit 0
          fi
          python3 vorlesen_elevenlabs.py --ordner ../audio --tempi "$TEMPI"

      - name: Lautstärke der Hinweise angleichen
        working-directory: quelle
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 lautstaerke.py ../audio

      - name: Seite bauen
        working-directory: quelle
        run: AUDIO_DIR=../audio AUDIO_MODE=dateien OUT=../index.html python3 build.py

      - name: Hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898388+github-actions[bot]@users.noreply.github.com"
          git add -A index.html
          [ -d audio ] && git add -A audio
          if git diff --cached --quiet; then echo "Nichts Neues."; exit 0; fi
          git commit -m "Vorlesen: Aufnahmen und Seite aktualisiert"
          git push
